<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>난세일생</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Ma+Shan+Zheng&family=Gothic+A1:wght@400;600;800&display=swap">
<style>
/* Layout: an app-shaped war table — fixed status bar, an ink map that fills the screen, sheets that rise from the bottom, a five-slot command bar. Single paper-and-ink look by choice. */
:root{
  --paper:#efe5cf;
  --paper2:#f7f0e1;
  --ink:#26201c;
  --muted:#6f6356;
  --line:#d8c9aa;
  --red:#b3352a;
  --gold:#a8822a;
  --good:#3d7a52;
  --fac:#6f6356;
  --display:"Song Myung","AppleMyungjo","Noto Serif KR","Batang",serif;
  --seal:"Ma Shan Zheng","Noto Serif SC","Song Myung",serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*,*::before,*::after{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:disabled{cursor:not-allowed;opacity:.42}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--red);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.2;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:12px} .tiny{font-size:11px}
.seal{font-family:var(--seal);display:inline-grid;place-items:center;color:#f6eedc;background:var(--fac);border-radius:6px;line-height:1;flex:none}
.pt{display:inline-block;border-radius:50%;overflow:hidden;flex:none;background:var(--paper);box-shadow:0 0 0 1.5px var(--paper2),0 0 0 2.5px #00000033;vertical-align:middle}
.pt svg{display:block;width:100%;height:100%}
.pt.sq{border-radius:10px}
.pt.gray{filter:grayscale(.85) sepia(.2)}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:#26201c12;white-space:nowrap}
.chip.up{background:#3d7a5222;color:#2c5d3d} .chip.down{background:#b3352a1c;color:#922a21} .chip.gold{background:#a8822a22;color:#73581a} .chip.red{background:var(--red);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips .chip{animation:pop .3s ease both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:.2}to{transform:none;opacity:1}}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.btn{border:0;border-radius:10px;padding:11px 14px;background:var(--ink);color:#f6eedc;font-family:var(--display);font-size:17px}
.btn.fac{background:var(--fac)}
.btn:active{transform:translateY(1px)}
.btn2{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--paper2);font-weight:800;font-size:13px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:800}
.bar .r{display:flex;justify-content:space-between;font-size:11px;font-weight:800;gap:4px}
.bar .r b{font-variant-numeric:tabular-nums}
.track{height:5px;border-radius:99px;background:#26201c16;overflow:hidden;margin-top:2px}
.track i{display:block;height:100%;border-radius:99px;transition:width .35s}
.lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted)}

/* ===== app shell ===== */
#app{height:100%;max-width:640px;margin:0 auto;position:relative;display:flex;flex-direction:column;background:var(--paper);overflow:hidden}
.top{flex:none;padding:8px max(12px,env(safe-area-inset-left,0px)) 6px;border-bottom:1px solid var(--line);background:var(--paper2);display:flex;flex-direction:column;gap:6px;position:relative;z-index:5}
.top .r1{display:flex;align-items:center;gap:10px}
.ptwrap{position:relative;flex:none;display:inline-flex;border:0;background:none;padding:0}
.ptwrap .seal{position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;font-size:13px;box-shadow:0 0 0 2px var(--paper2)}
.top .id{flex:1;min-width:0;display:flex;flex-direction:column}
.top .id b{font-family:var(--display);font-weight:400;font-size:19px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .id span,.top .date span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .date{text-align:right;display:flex;flex-direction:column;flex:none}
.top .date b{font-family:var(--display);font-weight:400;font-size:17px;line-height:1.15;font-variant-numeric:tabular-nums}
.icon{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--paper);font-size:18px;flex:none;display:grid;place-items:center}
.stats{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.stat{flex:none;display:flex;align-items:baseline;gap:4px;padding:3px 8px;border-radius:8px;background:#26201c0c;font-size:11px;font-weight:800;color:var(--muted)}
.stat b{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums}
.stat.warn b{color:var(--red)}
.view{flex:1;min-height:0;overflow:auto;position:relative;-webkit-overflow-scrolling:touch}
.view.map{overflow:hidden;display:flex;flex-direction:column}
.pane{padding:10px max(12px,env(safe-area-inset-left,0px)) 16px;display:flex;flex-direction:column;gap:10px}
.nav{flex:none;display:grid;grid-template-columns:1fr 1fr 1.35fr 1fr 1fr;align-items:stretch;border-top:1px solid var(--line);background:var(--paper2);padding:4px max(6px,env(safe-area-inset-left,0px));gap:2px;position:relative;z-index:5}
.nav button{border:0;background:none;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:4px 2px;font-size:11px;font-weight:800;color:var(--muted);position:relative}
.nav button i{font-style:normal;font-family:var(--seal);font-size:21px;line-height:1.1;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink);background:#26201c0d}
.nav button[aria-current="page"] i{color:var(--red)}
.nav .next{background:var(--ink);color:#f6eedc;margin:2px 4px}
.nav .next b{font-family:var(--display);font-weight:400;font-size:16px;line-height:1.15}
.nav .next small{font-size:10px;opacity:.75}
.nav .badge{position:absolute;top:2px;right:18%;min-width:16px;height:16px;border-radius:99px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}
.ap{display:flex;gap:3px}
.ap i{width:7px;height:7px;border-radius:50%;background:#f6eedc;display:block}
.ap i.off{background:#f6eedc44}

/* ===== map ===== */
.mapwrap{flex:1 1 auto;min-height:220px;position:relative}
.mapwrap svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
.citybtn{cursor:pointer}
.cname{font-family:var(--body);font-weight:800;font-size:3px;paint-order:stroke;stroke:#efe5cf;stroke-width:.9px;fill:var(--ink)}
.cname.on{fill:#fff;stroke:none;font-size:2.8px}
.ctp{font-family:var(--body);font-weight:800;font-size:2.4px;paint-order:stroke;stroke:#efe5cf;stroke-width:.8px;fill:#5b4f43}
.threat{animation:pulse 1.4s ease-in-out infinite}
.mapnote{position:absolute;left:8px;right:8px;top:8px;display:flex;flex-direction:column;gap:5px;pointer-events:none}
.note{pointer-events:auto;display:flex;align-items:center;gap:8px;background:#f7f0e1ee;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12px;box-shadow:0 2px 8px #26201c14;text-align:left;width:100%}
.note b{font-family:var(--display);font-weight:400;font-size:14px}
.note.danger{border-color:#b3352a66;background:#fbefe6ee}
.mapview{flex:1 1 auto;min-height:0;position:relative}
.mapscroll{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#e3d6b9;scrollbar-width:thin}
.mapinner{min-width:100%}
.mapinner svg{display:block;width:100%;height:auto}
.mapctl{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:3}
.mapctl button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#f7f0e1f0;font-weight:800;font-size:19px;box-shadow:0 2px 6px #26201c22;display:grid;place-items:center}
.mapctl button.me{width:auto;height:34px;padding:0 12px;font-size:12px;background:#b3352a;color:#fff;border-color:#b3352a}
.meping{animation:pulse 1.6s ease-in-out infinite}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.legend{flex:none;display:flex;gap:4px;overflow-x:auto;padding:6px 10px;border-top:1px solid var(--line);background:var(--paper2);scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.legend .chip{flex:none}

/* ===== bottom panel (city) ===== */
.panel-bg{position:absolute;inset:0;z-index:20;background:#26201c22}
.cpanel{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:74%;overflow:auto;background:var(--paper2);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px #26201c33;animation:rise .22s ease;padding:0 max(12px,env(safe-area-inset-left,0px)) 14px;display:flex;flex-direction:column;gap:9px}
.cpanel .grab{position:sticky;top:0;background:var(--paper2);padding:8px 0 4px;display:flex;justify-content:center;z-index:2}
.cpanel .grab i{width:40px;height:4px;border-radius:9px;background:#26201c33;display:block}
.scene{margin:0 calc(-1 * max(12px,env(safe-area-inset-left,0px)));line-height:0;border-bottom:1px solid var(--line)}
.scene svg{display:block;width:100%;height:auto;aspect-ratio:320/110;max-height:130px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.act{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 4px;font-size:13px;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.act small{font-size:10px;font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.act.war{border-color:#b3352a77;color:#922a21;background:#fbefe6}
.act.big{grid-column:span 3}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;text-align:center}
.kv div{background:#26201c0b;border-radius:8px;padding:4px 2px}
.kv span{display:block;font-size:10px;font-weight:800;color:var(--muted)}
.kv b{font-family:var(--display);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums}

/* ===== lists & cards ===== */
.card{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card h3{font-size:18px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:2px}
.sec h3{font-size:17px}
.prow{display:flex;align-items:center;gap:10px;padding:8px 2px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.prow:last-child{border-bottom:0}
.prow .nm{font-weight:800;min-width:58px}
.prow .mini{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:1;min-width:0}
.bond{width:52px;flex:none}
.badge{font-size:10px;font-weight:800;padding:1px 6px;border-radius:99px;background:var(--gold);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:#26201c0d;border-radius:10px;padding:3px}
.seg button{border:0;border-radius:8px;padding:7px 4px;background:transparent;font-weight:800;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--paper2);color:var(--ink);box-shadow:0 1px 3px #26201c22}
.armycard{border-left:4px solid var(--fac)}
.armycard.enemy{border-left-color:var(--red);background:#fbefe6}

/* ===== sheets & modals ===== */
.sheet-bg{position:fixed;inset:0;background:#26201c66;display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{background:var(--paper2);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px max(14px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;animation:rise .22s ease}
.modal-bg{position:absolute;inset:0;z-index:30;background:#26201c55;display:flex;align-items:flex-end;justify-content:center;padding:10px max(10px,env(safe-area-inset-left,0px))}
.modal{width:100%;max-height:100%;overflow:auto;background:var(--paper2);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px #26201c44;animation:rise .25s ease}
.modal.full{height:100%}
.ehead{display:flex;gap:12px;align-items:center}
.ehead .seal{width:50px;height:50px;font-size:32px;background:var(--ink)}
.ehead h3{font-size:22px}
.choices{display:flex;flex-direction:column;gap:6px}
.choice{text-align:left;background:var(--paper);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.choice:hover{border-color:var(--ink)}
.p{font-size:11px;font-weight:800;white-space:nowrap;padding:3px 8px;border-radius:99px;background:#26201c0d;font-variant-numeric:tabular-nums}
.p.hi{color:var(--good)} .p.lo{color:var(--red)}
.result{border-left:3px solid var(--good);padding-left:10px}
.result.bad{border-color:var(--red)}
.toast{position:absolute;left:10px;right:10px;top:4px;z-index:25;background:var(--ink);color:#f6eedc;border-radius:12px;padding:9px 12px;font-size:13px;display:flex;flex-direction:column;gap:5px;box-shadow:0 6px 18px #26201c44;animation:rise .2s ease, fade 4.5s ease forwards;pointer-events:none}
.toast.bad{background:#7a2a20}
.toast .chip{background:#ffffff22;color:#f6eedc}
.news{display:flex;flex-direction:column;gap:5px;font-size:13px}
.news div{padding-left:9px;border-left:2px solid var(--line)}
.news div.mine{border-left-color:var(--red)}

/* ===== battle ===== */
.sides{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.side{background:#26201c0a;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.side h3{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side .st{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.tacs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tac{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;text-align:left}
.tac b{font-family:var(--display);font-weight:400;font-size:17px}
.tac small{font-size:11px;color:var(--muted)}
.log{font-size:12px;display:flex;flex-direction:column;gap:2px;background:#26201c08;border-radius:8px;padding:7px 9px}
.stage{position:relative;border-radius:10px;overflow:hidden;background:var(--paper)}
.stage canvas{display:block;width:100%;height:200px}
.stage .skip{position:absolute;right:8px;bottom:8px;background:#f7f0e1}
.stage.px{background:#000;border:3px solid #2a241e;box-shadow:0 0 0 1px #000}
.stage.px canvas{height:auto;aspect-ratio:16/9;image-rendering:auto}
.pxcap{position:absolute;left:50%;top:6px;transform:translate(-50%,-4px);background:#0b0f1ed9;border:2px solid #c9b98f;border-radius:4px;padding:2px 9px;font-size:11px;font-weight:800;color:#f3ead6;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.pxcap.on{opacity:1;transform:translate(-50%,0)}
.pxcap b{text-shadow:0 0 1px #fff8,0 0 3px #fff6;filter:brightness(1.6)}
.pxcap i{font-style:normal;color:#e3b34a;margin:0 3px}
.pxbig{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:14px;pointer-events:none;opacity:0;transition:opacity .15s;font-family:var(--display);font-size:clamp(20px,6.5vw,34px);color:#ffd84a;text-shadow:2px 2px 0 #000,-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000}
.pxbig.on{opacity:1}
.pxbig.bad{color:#ff8a7a}
.pxbig.score{font-family:var(--body);font-weight:800;font-size:clamp(13px,3.8vw,18px);align-items:flex-start;padding-top:6px}
.pxbig.score span{background:#0b0f1ed9;border:2px solid #c9b98f;border-radius:4px;padding:2px 8px;color:#f3ead6}
.pxcut{position:absolute;inset:0;display:flex;align-items:center;pointer-events:none;opacity:0}
.pxcut.none{display:none}
.pxcut .band{position:absolute;left:-10%;right:-10%;top:24%;height:52%;background:linear-gradient(90deg,#000e,#1b2a52e6 45%,#000e);transform:skewY(-5deg);border-block:2px solid #e3b34a}
.pxcut.foe .band{background:linear-gradient(90deg,#000e,#4a0f0ae6 45%,#000e);border-color:#ff8a7a}
.pxcut .pt0{position:relative;margin-left:6%;width:27%;aspect-ratio:1;border:3px solid #e3b34a;box-shadow:0 0 0 2px #000;background:#efe5cf}
.pxcut .pt0 svg,.pxcut .vp svg{display:block;width:100%;height:100%}
.pxcut .tx{position:relative;margin-left:4%;display:flex;flex-direction:column;gap:2px;text-shadow:2px 2px 0 #000;color:#fff}
.pxcut .tx small{font-size:clamp(10px,2.8vw,13px);color:#e3b34a;font-weight:800;letter-spacing:.12em}
.pxcut .tx b{font-family:var(--display);font-weight:400;font-size:clamp(18px,5.6vw,30px)}
.pxcut.vs{justify-content:center;gap:4%}
.pxcut.vs .band{background:linear-gradient(90deg,#1b2a52f0,#000e 50%,#4a0f0af0)}
.pxcut .vp{position:relative;width:26%;display:flex;flex-direction:column;align-items:center;gap:3px}
.pxcut .vp svg{aspect-ratio:1;border:3px solid #e3b34a;box-shadow:0 0 0 2px #000;background:#efe5cf;box-sizing:border-box}
.pxcut .vp b{font-family:var(--display);font-weight:400;color:#fff;font-size:clamp(13px,3.8vw,18px);text-shadow:2px 2px 0 #000}
.pxcut .vsx{position:relative;font-family:var(--display);font-size:clamp(26px,8vw,44px);color:#ffd84a;text-shadow:3px 3px 0 #000}
.pxbtns{position:absolute;right:6px;bottom:6px;display:flex;gap:5px}
.pxb{font:inherit;font-size:11px;font-weight:800;color:#f3ead6;background:#0b0f1ecc;border:2px solid #c9b98f;border-radius:4px;padding:4px 8px}
.pxb[aria-pressed="true"]{background:#e3b34a;color:#1b140c}
.moment{border:2px solid var(--gold);background:linear-gradient(#fff6dd,#f3e6c4);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;animation:rise .25s ease}
.moment .mhead{display:flex;align-items:center;gap:8px}
.moment .mhead b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--red)}
.moment p{margin:0;font-size:14px;line-height:1.5}
.moment .seal{width:26px;height:26px;font-size:16px;background:var(--red)}
.mchoices{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.tac .gl{font-family:var(--display);color:var(--red);margin-right:6px;font-size:1.2em}
.scout{display:flex;align-items:center;gap:8px;margin:6px 0 8px;padding:7px 10px;border-radius:9px;background:#efe1b8;border:1px solid #d9bd7a;font-size:13px;font-weight:700;color:#3b2c14}
.scout.dim{background:#ece6d8;border-color:#d4ccb8;color:#7a7060;font-weight:600}
.seal.sm{width:22px;height:22px;font-size:12px;flex:none}
.seal.sm.dim{background:#9a907c}
.duelp .mhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dside{display:flex;align-items:center;justify-content:space-between;gap:6px}
.dm1{display:flex;align-items:center;gap:8px;min-width:0}.dm1.r{flex-direction:row-reverse;text-align:right}
.dm1 b{display:block;font-size:15px}.dm1 small{color:var(--muted,#7a7060);font-size:11px}
.dvs{font-family:var(--display);font-size:22px;color:var(--red)}
.dbars{display:grid;gap:5px;margin:8px 0}
.dhp{position:relative;height:12px;border-radius:6px;background:#3a1410;overflow:hidden}
.dhp i{position:absolute;inset:0 auto 0 0;transition:width .5s}
.dhp b{position:absolute;right:6px;top:-2px;font-size:10px;color:#fff;text-shadow:0 0 2px #000}
.dlog{margin:4px 0;font-size:13px;color:#4a3a22;font-weight:700}
.tacs.three{grid-template-columns:repeat(3,1fr)}
.tacs.three .tac small{font-size:10.5px}
button.stat{border:0;font:inherit;cursor:pointer}
button.stat.pol{background:#e4d3a2;color:#3b2c14}
button.stat.pol.off{background:#e3ddd0;color:#7a7060}
.tac.on{outline:2px solid var(--gold);background:#f3e7c4}
/* ===== title & full pages ===== */
.page{height:100%;overflow:auto;padding:14px max(14px,env(safe-area-inset-left,0px)) 28px;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:12px}
.brand .seal{width:54px;height:54px;font-size:36px;background:var(--red)}
.brand h1{font-size:34px}
.segb{border:1.5px solid var(--line);background:var(--paper2);border-radius:10px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:1px}
.segb b{font-size:14px}
.segb small{font-size:11px;color:var(--muted);line-height:1.35}
.segb[aria-pressed="true"]{border-color:var(--ink);background:#fff9ec;box-shadow:inset 0 0 0 1px var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{border:0;border-radius:9px;padding:8px 0;background:#26201c0d;font-weight:800;font-size:13px}
.tab[aria-selected="true"]{background:var(--fac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gen{position:relative;text-align:left;background:var(--paper2);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.gen .head{display:flex;gap:9px;align-items:center;min-width:0}
.gen .head div{min-width:0;display:flex;flex-direction:column}
.gen strong{font-family:var(--display);font-weight:400;font-size:18px}
.gen .sub{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.gen .best{font-size:11px;color:var(--gold);font-weight:800}
.gen.locked{opacity:.55}
.gen .lock{font-size:11px;font-weight:800;color:var(--muted)}
.ad-slot{border:1.5px dashed var(--line);border-radius:12px;min-height:90px;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:8px}
.tomb{text-align:center;align-items:center}
.tomb h2{font-size:28px}
.epi{font-family:var(--display);font-size:18px;color:var(--red)}
.scorebox{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%}
.scorebox div{background:#26201c0b;border-radius:10px;padding:7px 4px}
.scorebox b{display:block;font-family:var(--display);font-weight:400;font-size:21px;font-variant-numeric:tabular-nums}
.scorebox span{font-size:11px;font-weight:800;color:var(--muted)}
.unlock{background:#fff6dd;border:1px solid #e3cf98;border-radius:10px;padding:9px 11px;font-size:13px;text-align:left;width:100%}
.unlock b{color:#73581a}
.ach{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.ach .seal{width:30px;height:30px;font-size:18px;background:var(--gold)}
.ach.off{color:var(--muted)} .ach.off .seal{background:#b8ad98}
.ach b{display:block} .ach small{font-size:12px}
details summary{font-weight:800;cursor:pointer;padding:5px 0}
@media (min-width:700px){ #app{border-left:1px solid var(--line);border-right:1px solid var(--line)} }
@media (prefers-reduced-motion:reduce){ .cpanel,.sheet,.modal,.toast,.chips .chip{animation:none} .threat{animation:none} .track i{transition:none} }

  const v = u==='cav' ? p.m*.6+p.l*.4 : u==='spear' ? p.l*.6+p.m*.4 : u==='bow' ? p.i*.35+p.l*.35+p.m*.3 : p.l*.5+p.i*.5 - (['wu','lb'].includes(p.fac) ? 0 : 15);

}

  const p = s.gid ? person(s.gid) : null;

  const t = TERRAIN[cid]; let k = 1;

function hashStr(s){ let h = 2166136261; for (const ch of String(s)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h>>>0; }

function brush(pts, w, taper, color, op){

    k = Math.max(k, .14);
    const a = P[Math.max(0,i-1)], b = P[Math.min(n-1,i+1)];
    let dx = b[0]-a[0], dy = b[1]-a[1]; const d = Math.hypot(dx,dy)||1; dx/=d; dy/=d;
    const hw = w*k/2; L.push([P[i][0]-dy*hw, P[i][1]+dx*hw]); R.push([P[i][0]+dy*hw, P[i][1]-dx*hw]);

  const Q = [...L, ...R.reverse()];
  return `<path d="M${Q.map(p => f1(p[0])+' '+f1(p[1])).join('L')}Z" fill="${color||INK}"${op!=null?` opacity="${op}"`:''}/>`;
}

      o += brush([[X(2.8),45.6],[X(5.5),44.3],[X(8.4),44.3],[X(10.6),45.8]], female?1.4:1.3, 'both');
      o += `<path d="M${X(3.5)} 45.2 Q${cx0} 43.8 ${X(9.8)} 45.3 L${X(9.8)} 44.6 Q${cx0} 43.2 ${X(3.5)} 44.5Z" fill="${skin}" opacity=".5"/>`;
      if (female) o += brush([[X(10.3),45.4],[X(11.6),44.2]], .7, 'tip');

  }
  if (ex.includes('patch')) {}
  /* ---------- 코·입 ---------- */
  o += brush([[48.7,45],[48.3,49.5],[47.6,52.6]], .7, 'both', INK, .6);

  o += `<ellipse cx="50" cy="52.6" rx="2.6" ry="1.5" fill="${INK}" opacity=".06"/>`;
  const my = cy - 6.6;
  if (female){ o += `<path d="M47.4 ${my} Q50 ${my-1} 52.6 ${my} Q50 ${my+2.2} 47.4 ${my}Z" fill="#b54a3e"/>`; }
  else o += brush([[46.2,my],[48.2,my+.5],[50,my+.7],[51.8,my+.5],[53.8,my]], 1, 'both');
  if (!female && !child) o += brush([[48.2,my+2.2],[51.8,my+2.2]], .55, 'both', INK, .45);
  /* ---------- 주름 ---------- */
  if (!child && !female && age>=36) o += both([[45.4,51.8],[44.4,54.6],[44.7,57.6]], .6, 'both', INK, Math.min(.65, (age-30)/45));
  if (!child && age>=50) o += both([[45.6,47.8],[43.4,48.6],[40,48.4]], .5, 'both', INK, .4);
  if (ex.includes('scar')) o += brush([[56,48],[60.5,52.5],[62.6,57]], .9, 'both', '#8a3a2c') + brush([[58.5,49.5],[61,48.7]], .6, 'both', '#8a3a2c');
  /* ---------- 수염 ---------- */
  if (!female && !child){
    const strand = (x, y, len, dx, w, c) => brush([[x,y],[x+dx*.4,y+len*.45],[x+dx,y+len]], w, 'tip', c);
    const must = () => both([[49.3,my-2.1],[46.6,my-1.4],[44,my+.2],[42.6,my+2.4]], 1.8, 'tip', beardC);
    if (L.beard==='mustache') o += must();
    else if (L.beard==='goatee'){ o += must(); for (let i=0;i<6;i++){ const x = 48.4+i*.65; o += strand(x, cy-1.5, 7+R()*4, (x-50)*.6, 1.3, beardC); } }
    else if (L.beard==='stub'){ for (let i=0;i<70;i++){ const a = Math.PI*(.08+.84*R()), rr = jw*.9 + R()*2.2; const x = 50 + Math.cos(a)*rr*(1.05), y = 51 + Math.sin(a)*(cy-51)*1.02; if (y<my-2.5 || (Math.abs(x-50)<3.6 && y<my+1.6 && y>my-3)) continue; o += `<circle cx="${f1(x)}" cy="${f1(y)}" r=".32" fill="${beardC}" opacity=".55"/>`; } }
    else if (L.beard==='full' || L.beard==='long' || L.beard==='wild') {
      const longB = L.beard==='long', wild = L.beard==='wild';
      const depth = longB ? 30 : wild ? 9 : 10;
      // 수염 덩어리
      o += `<path d="M${50-jw-2} 50 C${50-jw-2} ${cy-2} ${50-6} ${cy+depth*.55} 50 ${cy+depth} C${50+6} ${cy+depth*.55} ${50+jw+2} ${cy-2} ${50+jw+2} 50 C${50+jw-1} 57 ${53} ${my-1.6} 50 ${my-1.2} C${47} ${my-1.6} ${50-jw+1} 57 ${50-jw-2} 50Z" fill="${beardC}"/>`;
      o += `<path d="M46 ${my+1.2} Q50 ${my+3.4} 54 ${my+1.2} Q50 ${my+1.8} 46 ${my+1.2}Z" fill="${shade(skin,.7)}"/>`;
      const n = longB ? 26 : 18;
      for (let i=0;i<n;i++){
        const t = i/(n-1), a = Math.PI*(.02+.96*t), x = 50 - Math.cos(a)*(jw+1.6), y = 50 + Math.sin(a)*(cy-49);
        if (wild){ const ang = Math.atan2(y-48, x-50); const len = 5+R()*4; o += brush([[x,y],[x+Math.cos(ang)*len, y+Math.sin(ang)*len+1.5]], 1.6, 'tip', beardC); }
        else if (longB){ const len = 10 + Math.sin(t*Math.PI)*(depth-4) + R()*3; o += strand(x, y, len, (50-x)*.45 + (R()-.5)*2, 1.2, i%3 ? beardC : shade(beardC, greyK>.5?.75:1.6)); }
        else o += strand(x, y, 5+Math.sin(t*Math.PI)*6+R()*2, (50-x)*.25, 1.1, beardC);
      }
      o += must();
      if (wild) for (const s of [-1,1]) o += brush([[50+s*1,my-2],[50+s*5,my-1.6],[50+s*9,my-4.5]], 2.2, 'tip', beardC);
    }
  }
  /* ---------- 머리·쓰개 ---------- */
  const hairCap = `<path d="M${50-fw-.6} 41 C${50-fw-1.4} 26 ${50-fw*.5} 18.6 50 18.6 C${50+fw*.5} 18.6 ${50+fw+1.4} 26 ${50+fw+.6} 41 L${50+fw-1.2} 36 C${50+fw-2.4} 30.4 ${55} 28 50 28.6 C45 28 ${50-fw+2.4} 30.4 ${50-fw+1.2} 36Z" fill="${hair}"/>` +
    brush([[50-fw+1.8,33],[50-5,28.4],[50+5,28.4],[50+fw-1.8,33]], .6, 'both', mix(hair,'#ffffff',.25)) +

      for (let i=1;i<6;i++){ o += brush([[47-i*7,10-i*1.6],[46-i*7,7-i*1.2]], .8, 'flat', INK, .6) + brush([[53+i*7,10-i*1.6],[54+i*7,7-i*1.2]], .8, 'flat', INK, .6); } }

    for (const s of [-1,1]){

    o += brush([[50-fw-3,38],[50-fw-3.2,26],[50-fw*.55,14.6],[50,12.4],[50+fw*.55,14.6],[50+fw+3.2,26],[50+fw+3,38]], 1.3);
    o += `<path d="M${50-fw-3.6} 34.2 Q50 28.6 ${50+fw+3.6} 34.2 L${50+fw+3.6} 38.6 Q50 33.4 ${50-fw-3.6} 38.6Z" fill="${shade(hc,.55)}"/>`;
    o += brush([[50-fw-3.6,38.6],[50,33.4],[50+fw+3.6,38.6]], 1.1);
    for (let i=-3;i<=3;i++) o += `<circle cx="${f1(50+i*4.4)}" cy="${f1(35.9 - (1-Math.abs(i)/3.5)*2.6)}" r=".7" fill="#c9a24a"/>`;
    o += brush([[50,13],[50,32]], 1.8, 'both', shade(hc,1.45));
    o += `<path d="M50 25.6 L53.4 30.6 L50 33.2 L46.6 30.6Z" fill="#c9a24a"/>` + brush([[46.6,30.6],[50,25.6],[53.4,30.6],[50,33.2],[46.6,30.6]], .6, 'flat');

    }
  } else if (hat==='scholar'){
    o += hairCap;
    const sc = L.hc==='#e9e4d4' ? '#cfd8d4' : hc;
    o += `<path d="M${50-fw+.2} 32.4 C${50-fw-.6} 24 ${50-fw+1} 15.6 ${50-6} 14.6 Q50 17.6 ${50+6} 14.6 C${50+fw-1} 15.6 ${50+fw+.6} 24 ${50+fw-.2} 32.4 Q50 27 ${50-fw+.2} 32.4Z" fill="${sc}"/>`;
    o += brush([[50-fw+.2,32.4],[50-fw-.4,23],[50-6,14.6],[50,17.4],[50+6,14.6],[50+fw+.4,23],[50+fw-.2,32.4]], 1) + brush([[50-fw+.2,32.4],[50,27.2],[50+fw-.2,32.4]], .9);
    for (const x of [-7,-3.5,0,3.5,7]) o += brush([[50+x*.8,17.4+Math.abs(x)*.1],[50+x,28.6-Math.abs(x)*.25]], .45, 'both', INK, .45);
    o += brush([[50-fw-1,33],[50+fw+1,33]], .9, 'flat', shade(sc,.7));

    o += hairCap;
    o += `<ellipse cx="50" cy="15" rx="9" ry="6.2" fill="${hair}"/><ellipse cx="50" cy="9.4" rx="5.6" ry="4.2" fill="${hair}"/>`;
    o += brush([[41,15],[50,12.6],[59,15]], .6, 'both', mix(hair,'#ffffff',.3));
    o += brush([[58,13],[70,6]], 1, 'flat', '#c9a24a') + `<circle cx="70.4" cy="5.6" r="1.6" fill="#b8392a"/><circle cx="66" cy="9.6" r="1" fill="#c9a24a"/><circle cx="68" cy="10.6" r="1" fill="#c9a24a"/>`;
    o += `<circle cx="40" cy="17" r="2" fill="#d9705f"/><circle cx="40" cy="17" r=".8" fill="#f6d36b"/>`;
  } else if (child){
    o += hairCap + `<circle cx="40" cy="20" r="4.6" fill="${hair}"/><circle cx="60" cy="20" r="4.6" fill="${hair}"/>` + brush([[36,21],[44,19]], .8, 'flat', '#a8382a') + brush([[56,19],[64,21]], .8, 'flat', '#a8382a');
  } else o += hairCap + knot(18);
  /* ---------- 소품 ---------- */
  if (ex.includes('fan')){
    o += `<g transform="translate(78 86) rotate(-14)"><path d="M0 0 L-12 -24 Q0 -32 12 -24Z" fill="#f8f4ea"/>`;
    for (let i=-4;i<=4;i++) o += `<path d="M0 0 L${i*2.8} ${-27+Math.abs(i)*.6}" stroke="${INK}" stroke-width=".35" opacity=".6"/>`;
    o += `<path d="M0 0 L-12 -24 Q0 -32 12 -24Z" fill="none" stroke="${INK}" stroke-width=".8"/><rect x="-1.2" y="0" width="2.4" height="13" fill="#7a5a34"/></g>`;
  }
  if (opt.seal){ o += `<rect x="83" y="83" width="13" height="13" rx="1.6" fill="#b3352a"/><text x="89.5" y="93.4" text-anchor="middle" font-size="9.6" fill="#f6eedc" font-family="serif">${opt.seal}</text>`; }
  return o + '</svg>';
}

const DEFAULT_LOOK = { skin:'b', hat:'helmet', hc:'#6a6a6a', beard:'stub', bc:'', eye:'round', extra:'' };
function lookOf(p){
  if (p.look) return p.look;

  const r = seeded(hashStr(p.id + p.n)), mil = (p.m||50)+(p.l||50) >= (p.i||50)+(p.c||50);

    hc:['#555555','#666666','#7a6a5a','#6a7a8a','#8a7a6a','#4a5560'][Math.floor(r()*6)], beard:['none','stub','mustache','goatee','full'][Math.floor(r()*5)], bc:'', eye:['sharp','calm','round'][Math.floor(r()*3)], extra:'' };
}
function kidLook(k){
  const P = lookOf(me()), r = seeded(hashStr(k.id + k.n));
  return { skin: P.skin==='c' ? 'b' : (r()<.7 ? P.skin : 'abde'[Math.floor(r()*4)]), hat: r()<.55 ? (P.hat==='crown' ? 'cap' : P.hat) : (r()<.5 ? 'helmet' : 'cap'), hc: r()<.6 ? P.hc : '#666666',
    beard: ['none','stub','mustache','goatee','full'][Math.floor(r()*5)], bc:'', eye: r()<.6 ? (P.eye==='closed' ? 'sharp' : P.eye) : ['sharp','calm','round'][Math.floor(r()*3)], extra:'' };
}
function spouseLook(){ return { skin: Math.random()<.5 ? 'e' : 'a', hat:'none', hc:'', beard:'none', bc:'', eye:'calm', extra:'' }; }
const PT_CACHE = new Map();
function ptSvg(L, age, female, col){

function ptHTML(L, age, female, col, size, cls){ return `<span class="pt ${cls||''}" style="width:${size}px;height:${size}px">${ptSvg(L, age, female, col)}</span>`; }

/* =====================================================================

   ===================================================================== */
let G = null;
const person = id => G.people[id];
const me = () => G.people[G.pid];
const city = id => G.cities[id];
const fac = id => G.facs[id];
const allCities = () => Object.values(G.cities);
const citiesOf = f => allCities().filter(c => c.owner===f);
const aliveFacs = () => Object.values(G.facs).filter(f => f.alive);
const facName = f => { if (!f) return '무주지'; const F = G.facs[f]; if (!F) return '재야'; const r = F.ruler && person(F.ruler); return r ? `${r.n}군` : '옛 세력'; };
const facColor = f => f && G.facs[f] ? G.facs[f].color : '#8f8574';
const facSeal = f => f && G.facs[f] ? G.facs[f].seal : '野';
const allied = (a,b) => !!(a && b && G.facs[a] && (G.facs[a].ally[b]||0) > 0);
const hostile = (a,b) => !!(b && a!==b && !allied(a,b));
const ageOf = p => G.year - p.b;
const active = p => p && p.alive && p.active;
const npcs = () => Object.values(G.people).filter(p => active(p) && p.id!==G.pid);
const peopleIn = (cid, f) => npcs().filter(p => p.city===cid && !p.army && (f===undefined || p.fac===f));
const bestGen = (cid, f) => peopleIn(cid, f).sort((a,b) => (b.m+b.l)-(a.m+a.l))[0];
const bond = id => G.bond[id] ?? 0;
const addBond = (id, v) => { G.bond[id] = clamp(bond(id)+v, -100, 100); };
const apMax = () => G.role==='ruler' ? 6 : 4;
const troopCap = () => G.role==='ronin' ? 5000 : 2500 + G.rank*2000;
const isSworn = id => G.sworn.includes(id);
const lordName = () => G.pfac && fac(G.pfac) && person(fac(G.pfac).ruler) ? person(fac(G.pfac).ruler).n : '';
const mates = () => G.pfac ? npcs().filter(p => p.fac===G.pfac) : peopleIn(G.city);
const armies = () => G.armies;
const armiesOf = f => G.armies.filter(a => a.fac===f);
const armyById = id => G.armies.find(a => a.id===id);
const totalTroops = f => citiesOf(f).reduce((a,c) => a+c.troops, 0) + armiesOf(f).reduce((a,x) => a+x.troops, 0);
const growth = a => clamp((a-3)/14, .15, 1);
const kidStat = (k, s) => Math.round(k.st[s]*growth(G.year-k.born));
const mi = () => G.year*12 + G.month;
const dateStr = () => `${G.year}년 ${G.month}월`;
const maxWall = c => 30 + c.dev*5 + ({ pass:30, mountain:15, river:5 }[TERRAIN[c.id]] || 0);
const cityCap = c => c.dev*2200 + 3000;
const besieged = cid => G.armies.some(a => a.state==='siege' && a.to===cid);
const travel = (a,b) => { const A = city(a), B = city(b); return Math.hypot(A.x-B.x, A.y-B.y) > 24 ? 2 : 1; };
const wavg = (list, k) => { const t = list.reduce((s,a)=>s+a.troops,0) || 1; return list.reduce((s,a)=>s+a[k]*a.troops,0)/t; };
const notable = p => PEOPLE_RAW.some(r => r[0]===p.id) || p.fam;
const playerCity = () => G.inArmy ? null : G.city;
function armyName(a){ const g = a.gens.map(person).find(p => p && p.alive); return `${g ? g.n : facName(a.fac).replace(/군$/,'')} 군단`; }
function visible(cid){
  const c = city(cid);
  if (G.scout && G.scout[cid] >= mi()) return true;
  if (!G.pfac) return cid===G.city || city(G.city).adj.includes(cid);
  if (c.owner===G.pfac || allied(G.pfac, c.owner)) return true;
  if (G.armies.some(a => a.fac===G.pfac && (a.to===cid))) return true;
  return c.adj.some(a => city(a).owner===G.pfac) || city(G.city).adj.includes(cid);
}
const armyVisible = a => a.fac===G.pfac || (G.pfac && (city(a.to).owner===G.pfac || visible(a.to) || visible(a.from))) || (!G.pfac && (a.to===G.city || a.from===G.city));
const plotRange = cid => { const c = city(cid); if (!c.owner || c.owner===G.pfac || allied(G.pfac, c.owner)) return false; return G.role==='ruler' ? c.adj.some(a => city(a).owner===G.pfac) : city(G.city).adj.includes(cid) || G.armies.some(a => a.player && a.to===cid); };
function news(t, major, mine){ G.mnews.push({ t, mine:!!mine }); if (major) { G.chron.push({ y:G.year, m:G.month, t }); if (G.chron.length > 500) G.chron.splice(0, 150); } }

function initWorld(sc){
  const S = SCEN[sc], ownerOf = {};
  for (const [f, cs] of Object.entries(S.own)) for (const c of cs) ownerOf[c] = f;
  CITY_RAW.forEach(([id,n,x,y,dev,adj]) => { const o = ownerOf[id] || null;
    G.cities[id] = { id, n, x, y, dev, adj:[...adj], owner:o, troops: o ? dev*1500 + 1500 : dev*300 + 700, gov:null, wall:0, pool:dev*400, morale:100 }; });
  allCities().forEach(c => { c.wall = maxWall(c); c.adj.forEach(a => { if (!G.cities[a].adj.includes(c.id)) G.cities[a].adj.push(c.id); }); });
  FAC_RAW.forEach(([id,seal,color]) => G.facs[id] = { id, seal, color, ruler:S.rulers[id]||null, alive:!!S.rulers[id], gold:600, ally:{} });
  for (const r of PEOPLE_DEF){
    const [id,n,b,d,m,i,l,c,tr,,ap0] = r;
    const e = careerAt(id, sc); let f = e[1];
    if (f!=='free' && !S.rulers[f]) f = 'free';
    G.people[id] = { id, n, fac:f, city:e[2], b, d, m, i, l, c, tr, ap: ap0 || b+16, alive: d >= sc, active:false, loy:ri(60,85), army:null };
  }
  for (const [f, rid] of Object.entries(S.rulers)){
    const p = G.people[rid]; p.fac = f; p.alive = true; if (p.ap > sc) p.ap = sc;
    if (G.cities[p.city].owner!==f) p.city = S.own[f][0];
    G.cities[p.city].troops += 3000;
  }
  for (const f of Object.values(G.facs)) if (f.alive){ const r = person(f.ruler); f.seal = SEALS[surnameOf(r.n)] || f.seal; }
  activate(true);
}
function activate(ff){
  for (const p of Object.values(G.people)){
    if (p.active || !p.alive || G.year < p.ap) continue;
    p.active = true;
    const par = PARENT[p.id] && person(PARENT[p.id]);
    if (par && active(par) && par.fac!=='free' && G.facs[par.fac] && G.facs[par.fac].alive){ p.fac = par.fac; p.city = par.army ? (capitalOf(par.fac) || p.city) : par.city; }
    else if (p.fac==='local') p.fac = city(p.city).owner || 'free';
    else if (p.fac!=='free' && !(G.facs[p.fac] && G.facs[p.fac].alive)) p.fac = 'free';
    if (p.fac!=='free' && city(p.city).owner!==p.fac){ const c = capitalOf(p.fac); if (c) p.city = c; }
    if (!ff && OFFICER_PICKS.some(o => o[0]===p.id)) news(`${J(p.n,'이')} 세상에 이름을 드러냈다 (${p.fac==='free'?'재야':facName(p.fac)}).`, true, p.fac===G.pfac);
  }
}
function capitalOf(f){
  const F = fac(f); if (!F) return null;
  const r = person(F.ruler);
  if (r && city(r.city) && city(r.city).owner===f) return r.city;
  const cs = citiesOf(f); return cs.length ? cs.sort((a,b)=>b.troops-a.troops)[0].id : null;
}

/* ---------------- 새 게임 ---------------- */
function newGame(pid, sc, mode){
  sc = sc || 196; mode = mode || 'real';
  G = { year:sc, month:1, scen:sc, mode, people:{}, cities:{}, facs:{}, armies:[], bond:{}, sworn:[], chron:[], mnews:[], queue:[], done:{}, recent:[],
        kids:[], spouse:null, spouses:[], heir:null, gen:1, dyn:[], dynScore:0, wins:0, duels:0, flags:{ sieges:0 }, nid:0, firstPid:pid,
        diff:(prefs().diff||'normal'), firstHist:null, toast:null, sel:null, view:'map', phase:'act', maxAge:0, scout:{}, plots:{}, ambush:{}, plotWins:0, inArmy:null, campaign:null, lastEvent:0 };
  initWorld(sc);
  const p0 = person(pid), start = Math.max(sc, p0.ap);
  G.protect = pid;
  while (G.year < start){ G.mnews = []; monthStep(true); calendar(true); }
  G.mnews = []; G.queue = [];
  if (!p0.alive){ p0.alive = true; p0.active = true; }
  if (p0.army){ const a = armyById(p0.army); if (a) a.gens = a.gens.filter(g => g!==pid); p0.army = null; }
  G.firstHist = mode==='real' ? p0.d : null;
  setupPlayer(pid);
  const k = OFFICER_PICKS.find(o=>o[0]===pid); if (k) META.played[k[1]] = 1;
  if (pid==='liubei' || pid==='liushan') META.played.shu = 1; if (pid==='sunce' || pid==='sunjian' || pid==='sunquan') META.played.wu = 1; if (pid==='cao') META.played.wei = 1;
  saveMeta();
  news(`${dateStr()}, ${p0.n}의 이야기가 시작된다.`, true, true);
  G.mnews = [];
  startMonth(true);
}
function setupPlayer(pid){
  const p = person(pid);
  G.pid = pid; G.surname = surnameOf(p.n); G.startYear = G.year;
  G.pfac = (p.fac==='free' || !G.facs[p.fac] || !G.facs[p.fac].alive) ? null : p.fac;
  if (!G.pfac) p.fac = 'free';
  G.role = !G.pfac ? 'ronin' : fac(G.pfac).ruler===pid ? 'ruler' : 'officer';
  const a = ageOf(p);
  G.rank = G.role==='officer' ? Math.min(3, (Math.max(p.m,p.i,p.l)>=90?1:0) + (a>=35?1:0) + (a>=45?1:0)) : 0;
  G.merit = 0; G.trust = 60; G.gold = G.role==='ruler' ? 1200 : G.role==='officer' ? 300 : 200;
  G.troops = G.role==='officer' ? 1500 + p.l*12 : 0;
  G.train = 45; G.hp = clamp(100 - Math.max(0, a-40)*2, 40, 100);
  G.city = p.city; G.gov = null; G.inArmy = null;
  G.bond = {}; G.sworn = [];
  for (const q of Object.values(G.people)) if (q.id!==pid) G.bond[q.id] = (G.pfac && q.fac===G.pfac) ? 20 : 0;
  for (const [a1,b1,v,s] of BONDS){ const o = a1===pid ? b1 : b1===pid ? a1 : null; if (o){ G.bond[o] = v; if (s) G.sworn.push(o); } }
  newMission();
}

/* ---------------- 달력 ---------------- */
function calendar(ff){
  G.month++;
  if (G.month > 12){
    G.month = 1; G.year++;
    activate(ff);
    if (!ff){
      const a = ageOf(me());
      G.maxAge = Math.max(G.maxAge, a);
      let d = a<35 ? -6 : a<45 ? 2 : a<55 ? 5 : a<65 ? 8 : 12;
      if (me().tr==='장수' && d>0) d = Math.ceil(d/2);
      if (d>0) d += ri(0,3);
      G.hp = clamp(G.hp - d);
      for (const k of G.kids) if (k.pid && person(k.pid) && person(k.pid).alive){ const q = person(k.pid); for (const st of ['m','i','l','c']) q[st] = Math.max(q[st], kidStat(k, st)); }
      for (const k of G.kids) if (G.year-k.born===15) news(`${J(k.n,'이')} 성인이 되었다. 후계자로 세울 수 있다.`, true, true);
    }
  }
}

/* ---------------- 한 달의 세계 ---------------- */
function monthStep(ff){
  const pr = !ff && G.role==='ruler' ? G.pfac : null;
  for (const f of shuffle(aliveFacs())){
    if (!f.alive) continue;
    const cs = citiesOf(f.id);
    if (!cs.length){ if (!armiesOf(f.id).length) destroyFaction(f.id); continue; }
    for (const c of cs){
      c.pool = Math.min(c.dev*600, (c.pool||0) + c.dev*45);
      if (!besieged(c.id)){ c.wall = Math.min(maxWall(c), c.wall + 3); c.morale = Math.min(100, (c.morale??100) + 5); }
      const cap = cityCap(c);
      if (f.id===pr){
        const g = c.gov && person(c.gov);
        if (c.troops < cap) c.troops = Math.min(cap, c.troops + c.dev*15);
        if (g && active(g) && g.fac===f.id && g.city===c.id && !g.army){
          if (c.troops < cap) c.troops += Math.round(g.l*1.2);
          if (c.dev<10 && Math.random() < (g.i-30)/1800){ c.dev++; news(`${c.n} 태수 ${g.n}의 다스림으로 개발도가 ${c.dev}(으)로 올랐다.`, false, true); }
        } else if (c.gov && c.gov!==G.pid && (!g || !active(g) || g.fac!==f.id || g.city!==c.id)) c.gov = null;
      } else if (c.troops < cap) c.troops = Math.min(cap, c.troops + Math.round(c.dev*30*dif().grow));
    }
    if (f.id===pr) continue;
    f.gold = (f.gold||0) + cs.reduce((a,c)=>a+c.dev*8, 0);
    if (f.gold >= 700 && Math.random()<.25){ const c = pick(cs); if (c.dev<10){ c.dev++; f.gold -= 700; } }
    aiWar(f, ff);
  }
  armiesStep(ff);
  for (const p of Object.values(G.people)){
    if (!active(p) || p.id===G.pid || p.id===G.protect) continue;
    const a = ageOf(p);
    let q = 0;
    if (G.mode!=='virtual' && p.d) q = G.year>=p.d ? .07 : 0;
    else q = a>=68 ? Math.min(.05, (a-67)*.004) : 0;
    if (q && Math.random() < q) killNpc(p, '병사');
  }
  for (const p of npcs()){
    if (p.fac!=='free' || p.army || (G.retinue && G.retinue.includes(p.id))) continue;
    const c = city(p.city);
    const canAI = c.owner && !(!ff && G.role==='ruler' && c.owner===G.pfac);
    if (canAI && Math.random()<.025){ p.fac = c.owner; if (!ff && notable(p)) news(`${J(p.n,'이')} ${facName(c.owner)}에 출사했다.`, false, c.owner===G.pfac); }
    else if (Math.random()<.02) p.city = pick(c.adj);
  }
  if (!ff && G.role==='ruler'){
    for (const p of npcs().filter(q => q.fac===G.pfac)){
      p.loy = clamp(p.loy + (55 + bond(p.id)/2 - p.loy)*.02);
      if (p.inlaw || isInlawId(p.id)){ p.loy = Math.max(p.loy, 70); G.bond[p.id] = Math.max(G.bond[p.id]||0, 60); }
      if (p.loy < 30 && !isSworn(p.id) && !p.army && Math.random()<.03){ p.fac = 'free'; news(`${J(p.n,'이')} 불만을 품고 떠났다.`, true, true); }
    }
  }
  if (!ff && G.pfac){
    for (const f of aliveFacs()){
      if (f.id===G.pfac || allied(f.id, G.pfac) || Math.random() > .025) continue;
      const tg = citiesOf(G.pfac).filter(c => c.adj.some(a => city(a).owner===f.id));
      if (!tg.length) continue;
      const c = pick(tg);
      if (G.ambush[c.id] >= mi()){ news(`${facName(f.id)}의 첩자가 ${c.n}에서 붙잡혔다.`, false, true); continue; }
      const n = Math.round(c.troops*.06); c.troops -= n;
      news(`${facName(f.id)}의 유언비어가 ${c.n}에 퍼져 병사 ${fmt(n)}이 달아났다.`, false, true);
    }
  }
  if (!ff && G.role==='ruler') for (const _sp2 of spList()){ if (!_sp2.from) continue;
    const rp = person(_sp2.from), f2 = rp && Object.values(G.facs).find(f => f.alive && f.ruler===rp.id);
    if (f2 && allied(G.pfac, f2.id)){
      if (G.month===1){ G.gold += 150; news(`처가 ${facName(f2.id)}에서 축하 선물로 금 150을 보내왔다.`, false, true); }
      for (const c of citiesOf(G.pfac)){
        if (!besieged(c.id) || Math.random() > .18 || G.armies.some(a => a.fac===f2.id && a.to===c.id)) continue;
        const src = c.adj.map(city).find(x => x.owner===f2.id && x.troops>=3000); if (!src) continue;
        const n = Math.round(src.troops*.25), g = bestGen(src.id, f2.id); src.troops -= n;
        createArmy({ fac:f2.id, gens:g?[g.id]:[], troops:n, from:src.id, to:c.id, kind:'reinforce', food:3 });
        news(`처가 ${facName(f2.id)}이(가) ${c.n}에 원군 ${fmt(n)}을 보냈다!`, true, true);
      }
    }
  }
  for (const f of Object.values(G.facs)) for (const k of Object.keys(f.ally)){ f.ally[k]--; if (f.ally[k]<=0) delete f.ally[k]; }
  if (!ff && G.pfac && G.role==='ruler' && citiesOf(G.pfac).length>=Math.round(CITY_RAW.length*.4) && !(G.coalition > mi())){
    const rest = aliveFacs().filter(f => f.id!==G.pfac && citiesOf(f.id).length);
    if (rest.length>=2){ for (const a of rest) for (const b of rest) if (a!==b){ a.ally[b.id] = 24; } G.coalition = mi()+30;
      news(`그대의 세력이 커지자 ${rest.map(f=>facName(f.id)).join(', ')}이(가) 손을 잡고 연합을 맺었다!`, true, true); }
  }
}

/* ---------------- AI 전쟁 ---------------- */
let AI_SEND = .65, AI_THRESH = 1.0, AI_RATE = .10;
const DIFF = { easy:['쉬움','적이 느긋하고 계략이 잘 통한다', { rate:.55, thr:1.05, grow:.8, inc:1.3, plot:.10 }],
  normal:['보통','기본 균형', { rate:1, thr:1, grow:1, inc:1, plot:0 }],
  hard:['어려움','적이 더 자주, 더 크게 쳐들어온다', { rate:1.5, thr:.85, grow:1.2, inc:.85, plot:-.05 }],
  nanse:['난세','모두가 그대를 노린다. 계략도 잘 안 통한다', { rate:2.2, thr:.7, grow:1.5, inc:.7, plot:-.10 }] };
const dif = () => (DIFF[(G && G.diff) || 'normal'] || DIFF.normal)[2];
function aiWar(f, ff){
  const cs = citiesOf(f.id);
  for (const c of cs){
    if (!besieged(c.id) || Math.random() > .35) continue;
    if (G.armies.some(a => a.fac===f.id && a.to===c.id)) continue;
    const src = c.adj.map(city).filter(s => s.owner===f.id && !besieged(s.id) && s.troops>=4000).sort((a,b)=>b.troops-a.troops)[0];
    if (!src) continue;
    const n = Math.round(src.troops*.45), g = bestGen(src.id, f.id);
    src.troops -= n;
    createArmy({ fac:f.id, gens:g?[g.id]:[], troops:n, from:src.id, to:c.id, kind:'reinforce', food:3 });
    if (!ff && G.armies.some(a => a.fac===G.pfac && a.to===c.id)) news(`${facName(f.id)}이(가) ${c.n}에 원군 ${fmt(n)}을 보냈다!`, true, true);
  }
  const busy = G.armies.some(a => a.fac===f.id && a.kind==='attack');
  if (Math.random() > (busy ? AI_RATE*.35 : AI_RATE)*dif().rate) return;
  const targets = new Set();
  for (const c of cs) for (const t of c.adj) targets.add(t);
  let best = null;
  for (const tid of targets){
    const t = city(tid);
    if (t.owner===f.id || (t.owner && allied(f.id, t.owner))) continue;
    if (G.armies.some(a => a.fac===f.id && a.to===tid)) continue;
    const srcs = t.adj.map(city).filter(s => s.owner===f.id && !besieged(s.id) && s.troops>=3000).sort((a,b)=>b.troops-a.troops).slice(0,3);
    if (!srcs.length) continue;
    const avail = srcs.reduce((a,s)=>a+s.troops*AI_SEND, 0);
    const def = t.troops * (1 + t.wall/400) * 1.1;
    const big = !ff && G.pfac && citiesOf(G.pfac).length>=Math.round(CITY_RAW.length*.35);
    const score = avail/def * (t.owner ? 1 : 1.4) * (!ff && t.owner===G.pfac ? (big ? 1.3 : .9) : 1) * rnd(.85, 1.15);
    if (score > AI_THRESH*dif().thr && (!best || score > best.score)) best = { t, srcs, score };
  }
  if (!best) return;
  const used = best.srcs;
  let sent = 0;
  for (const s of used){
    const n = Math.round(s.troops*AI_SEND); if (n<1500) continue;
    const gs = peopleIn(s.id, f.id).sort((a,b)=>(b.m+b.l)-(a.m+a.l)).slice(0, used.length>1 ? 1 : 2).map(p=>p.id);
    s.troops -= n; sent += n;
    createArmy({ fac:f.id, gens:gs, troops:n, from:s.id, to:best.t.id, kind:'attack', food:6 });
  }
  if (!ff && sent && (best.t.owner===G.pfac || visible(best.t.id))) news(`${facName(f.id)}의 군대 ${fmt(sent)}이(가) ${J(best.t.n,'을')} 향해 진군한다!`, best.t.owner===G.pfac, best.t.owner===G.pfac);
}

/* ---------------- 군단 ---------------- */
function createArmy(o){
  const id = 'a' + (++G.nid);
  const eta = travel(o.from, o.to);
  const a = { id, fac:o.fac, gens:(o.gens||[]).filter(Boolean), troops:Math.round(o.troops), max:Math.round(o.troops), morale:o.morale ?? 95, train:o.train ?? 55,
    food:o.food ?? 6, from:o.from, to:o.to, home:o.from, kind:o.kind||'attack', state:'march', eta, total:eta, siege:0, player:!!o.player, share:o.share ?? 0 };
  for (const g of a.gens){ const p = person(g); if (p) p.army = id; }
  if (a.player) G.inArmy = id;
  G.armies.push(a);
  return a;
}
function involves(a){ return a.fac===G.pfac || city(a.to).owner===G.pfac; }
function armiesStep(ff){
  for (const a of G.armies.slice()){
    if (!G.armies.includes(a)) continue;
    if (a.state==='march' || a.state==='return'){
      a.eta--; a.morale = Math.min(100, a.morale + 2);
      if (a.state==='march' && a.food>0 && a.eta<=0) {}
      if (a.eta<=0) arrive(a, ff);
    }
  }
  const groups = {};
  for (const a of G.armies) if (a.state==='siege'){ const k = a.to+'|'+a.fac; (groups[k] = groups[k] || []).push(a); }
  for (const k of Object.keys(groups)){
    let list = groups[k].filter(a => G.armies.includes(a));
    const [tid, fid] = k.split('|');
    const t = city(tid);
    if (t.owner===fid || (t.owner && allied(fid, t.owner)) || !fac(fid) || !fac(fid).alive){ list.forEach(a => sendHome(a)); continue; }
    for (const a of list){ a.food--; a.siege++; if (a.food<0){ a.morale -= 25; if (!ff && involves(a)) news(`${armyName(a)}의 군량이 바닥났다.`, false, true); } }
    list = list.filter(a => { if (a.morale<=15 || a.troops<300){ sendHome(a, a.food<0 ? '군량이 떨어져' : '전의를 잃고', ff); return false; } return true; });
    if (!list.length) continue;
    const tot = list.reduce((s,a)=>s+a.troops,0);
    t.wall = Math.max(0, t.wall - Math.round(6 + tot/1500));
    t.morale = Math.max(0, (t.morale??100) - 6);
    if (t.morale<=20 && tot > t.troops*1.5){ surrender(tid, fid, list, ff); continue; }
    if (!ff && siegeInvolvesPlayer(list, t)){ G.queue.push({ kind:'siege', to:tid, fac:fid }); continue; }
    const est = siegeOdds(list, t);
    if (est < .75 && list.every(a => a.food>=2) && Math.random()<.8){ if (!ff && involves(list[0])) news(`${t.n}: ${facName(fid)}이(가) 포위를 굳히며 때를 기다린다. (성벽 ${t.wall})`, false, list[0].fac===G.pfac || t.owner===G.pfac); continue; }
    autoSiege(tid, fid, list, ff);
  }
}
function genFactor(p){ return p ? .6 + (p.l+p.m)/400 : .55; }
function siegeOdds(list, t){
  const gens = list.flatMap(a => a.gens).map(person).filter(p => p && p.alive);
  const cmd = gens.slice().sort((a,b)=>(b.m+b.l)-(a.m+a.l))[0];
  const att = list.reduce((s,a)=>s+a.troops*(.4+a.morale/170),0) * genFactor(cmd) * (1 + Math.min(.2, (gens.length-1)*.05));
  const dg = bestGen(t.id, t.owner);
  const def = Math.max(1, t.troops) * (.4+(t.morale??100)/170) * genFactor(dg) * (1 + t.wall/300) * (TERRAIN[t.id]==='pass' ? 1.25 : 1);
  return att/def;
}
// 작전 화면용: 같은 조건으로 여러 번 굴려 함락 확률을 어림한다
function estimateCapture(spec, tid, months, n){
  n = n || 40;
  const t = city(tid), w0 = t.wall, m0 = t.morale ?? 100;
  const total0 = spec.reduce((s,x)=>s+x.troops,0); if (total0<=0) return { p:0, m:0 };
  let wins = 0, msum = 0;
  for (let k=0;k<n;k++){
    let wall = w0, mor = m0, def = t.troops, atk = total0, aMor = 95, won = false, m = 1;
    for (; m<=months; m++){
      wall = Math.max(0, wall - Math.round(6 + atk/1500)); mor = Math.max(0, mor-6);
      if (mor<=20 && atk > def*1.5){ won = true; break; }
      t.wall = wall;
      const list = spec.map(x => ({ gens:x.gens, troops:atk*x.troops/total0, train:x.train ?? G.train, morale:aMor }));
      const att = mkArmySide(list, G.pfac); att.max = total0;
      const dg = bestGen(tid, t.owner);
      const dfs = mkSide(dg ? dg.id : null, def, 55, t.owner, false); dfs.morale = mor; dfs.max = Math.max(1, t.troops);
      setUnit(dfs, aiUnit(dfs, tid)); setUnit(att, aiUnit(att, tid, dfs.u));
      const B = { kind:'siege', to:tid, att, def:dfs, round:1, log:[] };
      while (!B.done) fight(B, aiTac(att), aiTac(dfs));
      wall = t.wall;
      if (B.winner==='att'){ won = true; break; }
      atk = att.troops; aMor = att.morale; def = dfs.troops; mor = Math.min(100, dfs.morale+10);
      if (atk < total0*.3 || aMor < 20) break;
    }
    if (won){ wins++; msum += m; }
  }
  t.wall = w0;
  return { p: wins/n, m: wins ? msum/wins : 0 };
}
function surrender(tid, fid, list, ff){
  const t = city(tid), old = t.owner;
  transferCity(t, fid, 0, ff);
  t.troops = 0; t.morale = 60; t.wall = Math.max(15, Math.round(t.wall*.8));
  const npcCmd = list.flatMap(a => a.gens).map(person).find(p => p && p.alive && p.id!==G.pid);
  const pl = list.some(a => a.player);
  for (const a of list) disband(a, tid);
  if (!t.gov && npcCmd) t.gov = npcCmd.id;
  if (pl){ G.merit += 30; G.wins++; G.flags.sieges = (G.flags.sieges||0)+1; if (list.length>1) G.flags.joint = 1; }
  if (!ff) news(`${t.n}이(가) 굶주림과 공포를 못 이겨 ${facName(fid)}에 항복했다!`, true, old===G.pfac || fid===G.pfac);
}
function siegeInvolvesPlayer(list, t){
  if (list.some(a => a.player)) return true;
  return t.owner===G.pfac && G.city===t.id && !G.inArmy && G.role!=='ronin' && !!G.pfac;
}
function arrive(a, ff){
  if (a.state==='return'){ disband(a, a.home); return; }
  const t = city(a.to);
  if (t.owner===a.fac){ disband(a, t.id); if (!ff && a.kind==='reinforce' && involves(a)) news(`원군이 ${t.n}에 도착했다.`, false, true); return; }
  if (a.kind==='reinforce' && t.owner && t.owner!==a.fac && allied(a.fac, t.owner)){ t.troops += a.troops; if (!ff) news(`${facName(a.fac)}의 원군 ${fmt(a.troops)}이 ${t.n}에 입성했다.`, true, t.owner===G.pfac); disband(a, null); return; }
  if (a.kind==='reinforce' || (t.owner && allied(a.fac, t.owner))){ sendHome(a, null, ff); return; }
  a.state = 'siege'; a.siege = 0;
  if (!ff && (involves(a) || visible(t.id))) news(`${armyName(a)}이(가) ${t.n}에 도착해 성을 에워쌌다.`, involves(a), involves(a));
}
function sendHome(a, why, ff){
  if (a.troops < 100 && !a.player){ disband(a, null); return; }
  let home = city(a.home||a.from).owner===a.fac ? (a.home||a.from) : (city(a.to).adj.find(x => city(x).owner===a.fac) || capitalOf(a.fac));
  if (!home){ disband(a, null); return; }
  a.state = 'return'; a.home = home; a.eta = a.to===home ? 0 : travel(a.to, home); a.kind = 'return';
  if (why && !ff && involves(a)) news(`${armyName(a)}이(가) ${why} 물러난다.`, true, true);
  if (a.eta<=0) disband(a, home);
}
function disband(a, cid){
  G.armies = G.armies.filter(x => x!==a);
  const c = cid ? city(cid) : null, ok = c && c.owner===a.fac;
  for (const g of a.gens){ const p = person(g); if (!p) continue; p.army = null;
    if (p.id===G.pid) continue;
    if (ok) p.city = cid; else { const cap = capitalOf(p.fac); if (cap) p.city = cap; else p.fac = 'free'; } }
  let n = a.troops;
  if (a.player){
    G.inArmy = null; me().army = null;
    if (G.role!=='ruler'){ const mine = Math.min(troopCap(), Math.round(a.troops*a.share)); G.troops = ok ? mine : Math.round(mine*.5); n -= mine; }
    if (ok){ G.city = cid; me().city = cid; }
  }
  if (ok) c.troops += Math.max(0, n);
}
function autoSiege(tid, fid, list, ff){
  const B = buildSiege(tid, fid, list, false);
  while (!B.done) fight(B, aiTac(B.att), aiTac(B.def));
  resolveSiege(B, ff);
}

/* ---------------- 전투 계산 ---------------- */
const TAC = { charge:['돌격','m','무력'], fire:['화공','i','지력'], ambush:['기습','l','통솔'], wall:['방진','l','통솔'] };
const BEATS = { charge:'fire', fire:'wall', wall:'ambush', ambush:'charge' };
function mkSide(gid, troops, train, fid, isPlayer){
  const p = gid ? person(gid) : null;
  return { gid, name: p ? p.n : '수비대장', st: p ? { m:p.m, i:p.i, l:p.l } : { m:40, i:40, l:45 }, tr: p ? p.tr : '',
           troops:Math.round(troops), max:Math.max(1,Math.round(troops)), morale:100, train, fid, isPlayer, support:0, helpers:[], duel:false };
}
function supportFor(cid, s){
  const h = peopleIn(cid, G.pfac).filter(p => bond(p.id)>=60).sort((a,b)=>bond(b.id)-bond(a.id)).slice(0,2);
  s.helpers = h.map(p=>p.n); s.support = h.length*.08 + h.filter(p=>isSworn(p.id) || p.inlaw || isInlawId(p.id)).length*.04;
}
function mkArmySide(list, fid){
  const gens = list.flatMap(a => a.gens).map(person).filter(p => p && p.alive);
  const pl = gens.find(p => p.id===G.pid);
  const cmd = pl || gens.slice().sort((a,b)=>(b.m+b.l)-(a.m+a.l))[0];
  const troops = list.reduce((s,a)=>s+a.troops,0);
  const s = mkSide(cmd ? cmd.id : null, troops, wavg(list,'train'), fid, !!pl);
  if (!cmd) s.name = '선봉대장';
  s.morale = wavg(list,'morale');
  const deps = gens.filter(p => p!==cmd);
  if (cmd) for (const k of ['m','i','l']) s.st[k] = Math.max(s.st[k], ...deps.map(d => Math.round(d[k]*.9)));
  s.support = Math.min(.25, deps.length*.05) + (pl ? deps.filter(d => bond(d.id)>=60).length*.04 : 0) + (list.length>1 ? .05 : 0);
  s.helpers = deps.map(d => d.n);
  s.joint = list.length;
  return s;
}
function aiTac(s){
  const w = { charge:s.st.m**2, fire:(s.st.i**2)*.85, ambush:(((s.st.l+s.st.i)/2)**2)*.7, wall:(s.st.l**2)*.6 };
  if (s.u && USYN[s.u]) for (const k of Object.keys(USYN[s.u])) w[k] *= 1.3;
  let t = Object.values(w).reduce((a,b)=>a+b,0)*Math.random();
  for (const k in w){ if ((t -= w[k]) <= 0) return k; }
  return 'charge';
}
function sidePow(s, t, isDef, cid, foe){
  let k = .5 + s.st.l/250 + s.st[TAC[t][1]]/200;
  k *= (.65 + s.train/220) * (.35 + s.morale/150) * (1 + s.support);
  if (s.tr==='명장') k *= 1.1;
  if (isDef) k *= 1 + city(cid).wall/300;
  k *= terrMul(cid, t, isDef, s.fid) * unitMul(s, foe, t, cid);
  return s.troops*k;
}
function fight(B, tA, tD){
  const A = B.att, D = B.def, lines = [];
  let ka = tA===tD ? 1 : BEATS[tA]===tD ? 1.35 : BEATS[tD]===tA ? .72 : 1;
  let kd = tA===tD ? 1 : BEATS[tD]===tA ? 1.35 : BEATS[tA]===tD ? .72 : 1;
  lines.push(`${A.name} ${TAC[tA][0]} · ${D.name} ${TAC[tD][0]}`);
  if (ka>1) lines.push(`${A.name}의 ${J(TAC[tA][0],'이')} ${J(TAC[tD][0],'을')} 꺾었다!`);
  if (kd>1) lines.push(`${D.name}의 ${J(TAC[tD][0],'이')} ${J(TAC[tA][0],'을')} 꺾었다!`);
  let selfA = 0, selfD = 0;
  let bfA = false, bfD = false;
  const bo = B.boost; B.boost = null;
  const boA = bo && bo.side==='att' && bo.tac===tA, boD = bo && bo.side==='def' && bo.tac===tD;
  if (boA) ka *= bo.k; if (boD) kd *= bo.k;
  if (boA || boD) lines.push('기다리던 때가 왔다! 준비한 계책이 들어맞는다.');
  if (tA==='fire'){ if (!boA && Math.random()<.12){ ka *= .3; selfA = A.troops*.08; bfA = true; lines.push('바람이 바뀌어 불길이 공격군 쪽으로 번졌다!'); } else { ka *= 1 + (A.st.i-D.st.i)/120; if (B.kind==='siege') city(B.to).wall = Math.max(0, city(B.to).wall - 6); } }
  if (tD==='fire'){ if (!boD && Math.random()<.12){ kd *= .3; selfD = D.troops*.08; bfD = true; lines.push('바람이 바뀌어 불길이 수비군 쪽으로 번졌다!'); } else kd *= 1 + (D.st.i-A.st.i)/120; }
  const pa = sidePow(A, tA, false, B.to, D), pd = sidePow(D, tD, true, B.to, A);
  const K = B.kind==='siege' ? .12 : .17;
  const toD = Math.round(pa*Math.max(.2,ka)*K*rnd(.85,1.15) + selfD), toA = Math.round(pd*Math.max(.2,kd)*K*rnd(.85,1.15) + selfA);
  const bD = Math.min(D.troops, toD), bA = Math.min(A.troops, toA);
  D.troops -= bD; A.troops -= bA;
  D.morale = clamp(D.morale - bD/D.max*110 - (ka>1?10:0) + (kd>1?4:0), 0, 130);
  A.morale = clamp(A.morale - bA/A.max*110 - (kd>1?10:0) + (ka>1?4:0), 0, 130);
  lines.push(`공격군 -${fmt(bA)} · 수비군 -${fmt(bD)}`);
  B.last = { tA, tD, mA:ka, mD:kd, lA:bA, lD:bD, bfA, bfD };
  B.log = lines; B.round++;
  checkEnd(B);
}
function checkEnd(B){
  const A = B.att, D = B.def, out = s => s.troops <= s.max*.12 || s.morale <= 12;
  if (out(D) && !out(A)) return endB(B, 'att');
  if (out(A)) return endB(B, 'def');
  if (B.round > 3) return endB(B, A.troops*A.morale > D.troops*D.morale*1.6 ? 'att' : 'def');
}
const endB = (B, w) => { B.done = true; B.winner = w; };

function buildSiege(tid, fid, list, interactive){
  const t = city(tid);
  const att = mkArmySide(list, fid);
  const pDef = t.owner===G.pfac && G.city===tid && !G.inArmy && G.role!=='ronin' && !!G.pfac;
  const dg = pDef ? G.pid : (bestGen(tid, t.owner)||{}).id || null;
  const dTroops = t.troops + (pDef && G.role!=='ruler' ? G.troops : 0);
  const def = mkSide(dg, dTroops, pDef ? G.train : 55, t.owner, pDef);
  def.morale = t.morale ?? 100;
  if (pDef){ def.name = me().n; supportFor(tid, def); }
  const ps = list.some(a => a.player) ? 'att' : pDef ? 'def' : null;
  const B = { kind:'siege', to:tid, fid, armies:list.map(a => a.id), att, def, round:1, log:[], ps, cmdPlayer:!!ps,
    share: pDef && G.role!=='ruler' && dTroops ? G.troops/dTroops : 0, months: Math.max(...list.map(a => a.siege)) };
  if (!(interactive && ps==='def')) setUnit(def, aiUnit(def, tid));
  if (!(interactive && ps==='att')) setUnit(att, aiUnit(att, tid, def.u));
  if (G.pfac && fid===G.pfac && G.plots[tid] >= mi()){ def.morale -= 30; delete G.plots[tid]; B.log.push('성 안에서 내응이 일어났다! 적의 사기가 무너진다.'); }
  if (G.pfac && t.owner===G.pfac && G.ambush[tid] >= mi()){ att.morale -= (G.ambushPow||25); delete G.ambush[tid]; B.log.push('숨겨둔 매복병이 적의 옆구리를 찔렀다!'); }
  if (interactive) B.stage = 'unit';
  return B;
}
function resolveSiege(B, ff){
  const t = city(B.to), list = B.armies.map(armyById).filter(Boolean);
  const A = B.att, D = B.def, res = { lines:[], chips:[], win:false, captive:null };
  const before = list.reduce((s,a)=>s+a.troops,0) || 1;
  list.forEach(a => { a.troops = Math.round(A.troops * a.troops/before); a.morale = clamp(Math.round(A.morale), 0, 100); });
  const pAtt = B.ps==='att', pDef = B.ps==='def';
  const k = me() && me().tr==='기병' ? 1.3 : 1;
  if (B.winner==='att'){
    const old = t.owner, dg = D.gid;
    transferCity(t, B.fid, 0, ff);
    t.wall = Math.max(15, Math.round(t.wall*.6)); t.morale = 70; t.troops = 0;
    const npcCmd = list.flatMap(a => a.gens).map(person).find(p => p && p.alive && p.id!==G.pid);
    for (const a of list) disband(a, t.id);
    if (!t.gov && npcCmd && (B.fid!==G.pfac || G.role==='ruler')) t.gov = npcCmd.id;
    if (!ff) news(`${facName(B.fid)}이(가) ${old ? facName(old)+'의 ' : ''}${J(t.n,'을')} 함락했다.`, true, old===G.pfac || B.fid===G.pfac);
    if (dg && dg!==G.pid && active(person(dg)) && person(dg).fac===old){
      if (pAtt && Math.random()<.5) res.captive = dg;
      else if (Math.random()<.25){ const p = person(dg); if (Math.random()<.5){ p.fac = B.fid; p.city = t.id; if (!ff) news(`${J(p.n,'이')} 포로가 되어 ${facName(B.fid)}에 항복했다.`, false, B.fid===G.pfac); } }
    }
    if (pAtt){ res.win = true; const mer = Math.round((30 + t.dev*5)*k); G.merit += mer; G.wins++; G.flags.sieges = (G.flags.sieges||0)+1; if (list.length>1) G.flags.joint = 1;
      res.chips.push([`공적 +${mer}`, true]); res.lines.push(`${J(t.n,'을')} 함락했다!${old ? ' '+facName(old)+'의 깃발이 내려갔다.' : ''}`);
      if (G.role==='officer'){ trustAdd(5); res.chips.push(['신뢰 +5', true]);
        if (G.rank>=2 && !G.gov && t.owner===G.pfac && Math.random()<.6){ G.gov = t.id; t.gov = G.pid; res.lines.push(`주공께서 그대를 ${t.n} 태수로 임명하셨다.`); res.chips.push(['태수 임명', true]); } } }
    if (pDef){ res.lines.push(`${J(t.n,'을')} 잃었다.`); if (!G.dead){ G.hp = clamp(G.hp-10); res.chips.push(['체력 -10', false]); } }
  } else {
    let dt = D.troops;
    if (pDef && G.role!=='ruler'){ const mine = Math.round(dt*B.share); G.troops = mine; dt -= mine; }

const supportAmt = () => 1500 + G.rank*1000;
function newMission(){
  G.campaign = null;
  if (G.role!=='officer'){ G.mission = null; return; }
  const opts = [];
  const adjE = city(G.city).adj.map(city).filter(c => hostile(G.pfac, c.owner) || !c.owner);
  if (adjE.length){ const t = adjE.sort((a,b)=>a.troops-b.troops)[0]; opts.push({ t:'capture', target:t.id, goal:1 }, { t:'capture', target:t.id, goal:1 }); }
  opts.push({ t:'merit', goal:30+G.rank*12, base:G.merit });
  if (adjE.some(c => c.owner)) opts.push({ t:'plot', goal:2, base:G.plotWins||0 });
  opts.push({ t:'troops', goal:Math.min(troopCap(), G.troops+1000) });
  if (city(G.city).adj.some(a => hostile(G.pfac, city(a).owner))) opts.push({ t:'defend', city:G.city, goal:1 });
  const m = npcs().filter(p => p.fac===G.pfac && bond(p.id)<45);
  if (m.length){ const q = pick(m); opts.push({ t:'bond', npc:q.id, goal:60 }); }
  const pickM = pick(opts);
  G.mission = { ...pickM, months: pickM.t==='capture' ? 10 : pickM.t==='defend' ? 6 : 8 };
  if (G.mission.t==='capture') G.campaign = { target:G.mission.target, until:mi()+G.mission.months, support:supportAmt(), deps:2 };
}
function missionProg(){
  const m = G.mission; if (!m) return 0;
  return m.t==='capture' ? (city(m.target).owner===G.pfac ? 1 : 0) : m.t==='merit' ? G.merit-m.base : m.t==='plot' ? (G.plotWins||0)-m.base : m.t==='troops' ? G.troops
       : m.t==='defend' ? (city(m.city).owner===G.pfac ? 1 : 0) : bond(m.npc);
}
function missionText(m){
  return m.t==='capture' ? `${J(city(m.target).n,'을')} 손에 넣어라` : m.t==='merit' ? `공적 ${m.goal}을 쌓아라` : m.t==='plot' ? `적 성에 계략을 ${m.goal}번 성공시켜라` : m.t==='troops' ? `병력을 ${fmt(m.goal)}까지 늘려라`
       : m.t==='defend' ? `${J(city(m.city).n,'을')} 끝까지 지켜라` : `${person(m.npc).n}과(와) 인연 ${m.goal} 이상 맺어라`;
}
function evalMission(){
  const m = G.mission; if (!m) return;
  m.months--;
  const ok = m.t==='defend' ? (m.months<=0 && missionProg()>=1) : missionProg() >= m.goal;
  if (m.t==='defend' && missionProg()<1){ failMission(); return; }
  if (!ok && m.months>0) return;
  if (ok){
    const up = G.rank<5; if (up) G.rank++;
    G.gold += 200; trustAdd(10); G.merit += 25;
    news(`임무 완수! ${up ? RANKS[G.rank]+' 자리에 올랐다.' : '큰 상이 내려졌다.'} (금 +200, 신뢰 +10)`, true, true);
    if (G.rank>=2 && !G.gov){
      const capC = capitalOf(G.pfac);
      const c = [city(G.city), ...citiesOf(G.pfac)].find(c => c.owner===G.pfac && !c.gov && c.id!==capC);
      if (c){ G.gov = c.id; c.gov = G.pid; news(`${c.n} 태수로 임명되었다. 그 성에서 내정을 펼칠 수 있다.`, true, true); }

/* ---------------- 내정 위임 (방침): 내정·징병·훈련·수송은 알아서, 나는 전쟁과 전략에 ---------------- */
const POL = { balanced:['균형','개발과 징병을 고르게. 전선 성은 병력을, 후방 성은 개발을 챙긴다.'], grow:['부국','개발 중심. 징병은 전선 성만 절반 수준으로 채운다.'], army:['강병','징병과 훈련 중심. 개발은 뒤로 미루고 민심이 더 빨리 닳는다.'], front:['전선','후방 성의 병력을 전선으로 보내고, 전선 성은 한도까지 징병한다.'] };
const POLP = { balanced:{ dev:1, fill:.8, train:70, floor:50, ship:1 }, grow:{ dev:2, fill:.5, train:60, floor:55, ship:0 }, army:{ dev:0, devLow:3, fill:.95, train:90, floor:40, ship:1 }, front:{ dev:1, backOnly:1, fill:1, train:80, floor:45, ship:2 } };
function polOf(){ if (!G.pol) G.pol = { on:true, focus:'balanced', reserve:600 }; return G.pol; }
function autoDomestic(){
  const pol = polOf(); G.autoRep = null;
  if (!pol.on || G.role==='ronin' || !G.pfac) return;
  const P = POLP[pol.focus] || POLP.balanced, L = [], keep = G.role==='ruler' ? pol.reserve : 50; let spent = 0;
  const pay = g => { if (G.gold - g < keep) return false; G.gold -= g; spent += g; return true; };
  if (G.role==='ruler'){
    const mine = citiesOf(G.pfac), front = c => c.adj.some(a => { const o = city(a).owner; return !o || hostile(G.pfac, o); });
    const devd = [], slots = Math.max(P.dev, P.devLow ? 1 : 0);
    for (const c of mine.filter(c => c.dev<10 && (!P.backOnly || !front(c)) && (P.dev>0 || c.dev<(P.devLow||0))).sort((a,b) => a.dev-b.dev)){
      if (devd.length >= slots) break; if (pay(300)){ c.dev++; devd.push(c.n); } }
    if (devd.length) L.push(`개발 ${devd.join('·')}`);
    let drafted = 0; const dn = [];
    for (const c of mine.filter(c => (c.pool||0) >= 200).sort((a,b) => (front(b)-front(a)) || (b.pool-a.pool))){
      if (dn.length >= 3 || G.trust < P.floor) break;
      const cap = cityCap(c), room = Math.floor(cap*(front(c) ? P.fill : Math.min(P.fill, .45)) - c.troops);
      const n = Math.min(1500, Math.floor(c.pool), room); if (n < 200) continue;
      if (!pay(Math.round(n*.12))) continue;
      c.pool -= n; c.troops += n; trustAdd(-1); drafted += n; dn.push(c.n);
    }
    if (drafted) L.push(`징병 ${fmt(drafted)}(${dn.join('·')})`);
    let ships = 0;
    if (P.ship) for (const to of mine.filter(c => front(c) && c.troops < cityCap(c)*.7)){
      if (ships >= P.ship) break;
      const from = to.adj.map(city).filter(s => s.owner===G.pfac && !front(s) && s.troops >= 2500 && s.troops >= cityCap(s)*.6).sort((a,b) => b.troops-a.troops)[0];
      if (!from) continue;
      const n = Math.min(Math.floor(from.troops*.4), Math.floor(cityCap(to)*.9 - to.troops)); if (n < 1000) continue;
      from.troops -= n; to.troops += n; ships++; L.push(`수송 ${from.n}→${to.n} ${fmt(n)}`);
    }
    if (G.train < P.train && pay(60)){ G.train = clamp(G.train+5); L.push('훈련 +5'); }
    if (mi()%3===0){ const t = G.toast; ACT.autoAssign(); G.toast = t; }
  } else if (G.role==='officer' && !G.inArmy){
    if (G.gov && G.gov===G.city && city(G.gov).dev<10 && pol.focus!=='army' && Math.random()<.5){ const c = city(G.gov); if (roll('i', 75)){ c.dev++; G.merit += 8; L.push(`${c.n} 개발 ${c.dev}`); } else G.merit += 1; }
    if (G.troops < troopCap()*(P.fill||.8)){ const c = city(G.city), n = Math.min(400 + me().c*4, troopCap()-G.troops, Math.floor(c.pool||0)); if (n >= 100 && pay(60)){ c.pool -= n; G.troops += n; L.push(`징병 ${fmt(n)}`); } }
    if (G.train < P.train && Math.random()<.5){ G.train = clamp(G.train+6); G.merit += 1; L.push('훈련 +6'); }
  }
  if (L.length) G.autoRep = { date: dateStr(), msg: '자동 내정 · ' + L.join(' / '), spent };
}
function openPolicy(){

    const pol = polOf(), ruler = G.role==='ruler';
    box.innerHTML = `<h3>내정 방침</h3><p class="small muted">${ruler ? '내정·징병·훈련·병력 수송을 매달 알아서 처리한다.' : '내 성의 개발과 내 부대의 징병·훈련을 알아서 처리한다.'} 행동력은 쓰지 않는다.</p>
      <div class="row"><button class="${pol.on?'btn':'btn2'} grow" data-pol="on:1">위임 (자동)</button><button class="${pol.on?'btn2':'btn'} grow" data-pol="on:0">직접 한다</button></div>
      ${pol.on ? `<div class="tacs">${Object.keys(POL).map(k => `<button class="tac ${pol.focus===k?'on':''}" data-pol="focus:${k}"><b>${POL[k][0]}</b><small>${POL[k][1]}</small></button>`).join('')}</div>

      <div class="card" style="margin-top:10px"><div class="tiny muted">지난 처리</div><div class="small">${G.autoRep ? esc(G.autoRep.date + ' ' + G.autoRep.msg) + (G.autoRep.spent ? ` (금 -${fmt(G.autoRep.spent)})` : '') : '아직 처리한 내역이 없다.'}</div></div>
      <button class="btn2" data-close>닫기</button>`;

  };
  paint();
}

/* ---------------- 한 달의 흐름 ---------------- */
function startMonth(first){
  G.ap = apMax(); G.toast = null;
  if (G.over) return endGame();
  if (G.dead){ G.phase = 'succession'; return; }
  const forced = EVENTS.some(e => e.forced && !(G.done[e.id] && !e.rep) && roleOk(e) && e.forced());
  if (!first && (forced || (Math.random() < .3 && mi()-G.lastEvent >= 2))){ if (pickEvent()){ G.lastEvent = mi(); return; } }
  G.phase = 'act';
}
function endMonth(){
  if (G.phase!=='act') return;
  G.mnews = [];
  if (G.role==='ruler'){ const inc = Math.round(citiesOf(G.pfac).reduce((a,c)=>a+c.dev*14,0)*(.6+G.trust/250)*dif().inc); G.gold += inc; G.lastIncome = inc; }
  else if (G.role==='officer'){ const s = Math.round((30 + G.rank*25 + (G.gov?20:0))*dif().inc); G.gold += s; G.lastIncome = s; if (G.month===12) G.trust = clamp(G.trust-3); }
  if (G.month%6===0 && G.role==='ruler') G.trust = clamp(G.trust + (G.trust<60 ? 2 : -1));
  autoDomestic();
  G.repDate = dateStr();
  monthStep(false);
  if (ageOf(me())<55 && G.hp<100 && !G.inArmy) G.hp = clamp(G.hp+1);
  const _sp = spList().length && ageOf(me())<56 && G.kids.length<8 && Math.random()<.028*Math.min(2, 1+(spList().length-1)*.6) ? pick(spList()) : null;
  if (_sp){ const k = makeKid(_sp); G.kids.push(k); news(`${k.sex==='남'?'아들':'딸'} ${J(k.n,'이')} 태어났다.`, true, true); }
  if (G.role==='officer' && G.mission) evalMission();
  calendar(false);
  if (G.pfac && citiesOf(G.pfac).length>=UNIFY_N) G.over = { kind:'unify' };
  else if (G.year>=280){ G.over = { kind:'era' }; news('280년, 삼국의 시대가 저물었다.', true, true); }
  if (G.hp<=0 && !G.dead) G.dead = ageOf(me())>=58 ? '노환' : '병사';
  nextQueue();
}
function nextQueue(){
  while (G.queue.length){
    const q = G.queue.shift();
    if (q.kind==='siege'){
      const list = G.armies.filter(a => a.state==='siege' && a.to===q.to && a.fac===q.fac);
      const t = city(q.to);
      if (!list.length || t.owner===q.fac) continue;
      if (G.dead || !siegeInvolvesPlayer(list, t)){ autoSiege(q.to, q.fac, list, false); continue; }
      G.battle = buildSiege(q.to, q.fac, list, true);
      G.phase = 'battle';
      return save();
    }
  }
  G.battle = null;
  const mine = G.mnews.filter(n => n.mine);
  if (mine.length || G.over || G.dead){ G.phase = 'report'; return save(); }
  afterReport();
}
function afterReport(){
  G.lastNews = G.mnews.slice();
  if (G.over) return endGame();
  if (G.dead){ G.phase = 'succession'; return save(); }
  startMonth(false);
  if (!G.dead && G.mnews.length && G.phase==='act') toast(`${dateStr()} · ${G.mnews[0].t}${G.mnews.length>1?` 외 ${G.mnews.length-1}건`:''}`);
  else if (!G.dead && G.autoRep && G.phase==='act') toast(G.autoRep.msg, G.autoRep.spent ? [[`금 -${fmt(G.autoRep.spent)}`, false]] : []);
  save();
}
function afterBattle(){
  G.battle = null;
  if (G.dead){ G.phase = 'succession'; save(); return; }
  nextQueue();
}
const MAXSP = () => G.role==='ruler' ? 3 : 2;
function spList(){ if (!G.spouses) G.spouses = G.spouse ? [G.spouse] : []; G.spouse = G.spouses[0] || null; return G.spouses; }
function addSpouse(sp){ sp.id = sp.id || 's'+(++G.nid); spList().push(sp); G.spouse = G.spouses[0]; return sp; }
const isInlawId = id => spList().some(x => x.from===id);
function makeKid(mom){
  mom = mom || G.spouse;
  const sex = Math.random()<.55 ? '남' : '여';
  const used = new Set(G.kids.map(k=>k.n));
  let n; for (let i=0;i<20;i++){ n = G.surname + pick(sex==='남'?GIVEN_M:GIVEN_F); if (!used.has(n)) break; }
  const st = {};
  for (const s of ['m','i','l','c']) st[s] = clamp(Math.round((me()[s] + mom.st[s])/2 + ri(-12,12)), 15, 95);
  const k = { id:'kid'+(++G.nid), n, sex, born:G.year, st, mom:mom.id, momN:mom.n };
  k.look = kidLook(k);
  return k;
}

/* ---------------- 계승 ---------------- */
function genScore(){
  const p = me(), yrs = G.year - G.startYear;
  let s = G.merit + G.rank*60 + yrs*3 + G.kids.length*20;
  if (G.role==='ruler') s += citiesOf(G.pfac).length*40;
  if (p.d && G.year > p.d && G.mode==='real') s += 100;
  return Math.round(s);
}
function heirCands(){
  const adults = G.kids.filter(k => G.year-k.born>=15 && !k.dead && !k.out);
  const list = [];
  const h = adults.find(k => k.id===G.heir); if (h) list.push({ kid:h.id });
  adults.forEach(k => { if (!list.some(x => x.kid===k.id)) list.push({ kid:k.id }); });
  for (const q of npcs()) if (PARENT[q.id]===G.pid && (q.fac===G.pfac || (!G.pfac && q.city===G.city)) && !aliveFacs().some(f=>f.ruler===q.id) && !list.some(x=>x.npc===q.id)) list.push({ npc:q.id, hist:true });
  if (G.role==='ruler'){
    const hn = HEIRS[G.pid]; if (hn && active(person(hn)) && person(hn).fac===G.pfac && !list.some(x=>x.npc===hn)) list.push({ npc:hn });
    const b = npcs().filter(p => p.fac===G.pfac && bond(p.id)>=40 && !list.some(x=>x.npc===p.id)).sort((a,b)=>bond(b.id)-bond(a.id))[0];
    if (b) list.push({ npc:b.id });
  }
  return list;
}
function succeed(ch){
  const old = me(), score = genScore();
  G.dyn.push({ n:old.n, b:old.b, d:G.year, role:G.role, rank:G.rank, score, cause:G.dead, fac:G.pfac ? facName(G.pfac) : '재야', look:lookOf(old), age:ageOf(old) });
  G.dynScore += score;
  if (G.dead==='숙청') G.flags.purged = 1;
  old.alive = false;
  if (G.inArmy){ const a = armyById(G.inArmy); if (a){ a.gens = a.gens.filter(g => g!==old.id); a.player = false; if (!a.gens.length) sendHome(a); } G.inArmy = null; old.army = null; }
  let np;
  if (ch.kid){
    const k = G.kids.find(x => x.id===ch.kid);
    const ex = k.pid && person(k.pid) && person(k.pid).alive ? person(k.pid) : null;
    const id = ex ? ex.id : 'p'+(++G.nid);
    np = ex || { id, n:k.n, fac:G.pfac||'free', city:G.city, b:k.born, d:null, m:kidStat(k,'m'), i:kidStat(k,'i'), l:kidStat(k,'l'), c:kidStat(k,'c'),

function endGame(){
  const unify = G.over && G.over.kind==='unify';
  if (!G.dynEnded){
    if (unify || G.dead || (G.over && G.over.kind==='era')){ const old = me(); const s = genScore(); G.dyn.push({ n:old.n, b:old.b, d:G.year, role:G.role, rank:G.rank, score:s, cause:unify?'통일':(G.dead||'시대의 끝'), fac:G.pfac?facName(G.pfac):'재야', look:lookOf(old), age:ageOf(old) }); G.dynScore += s; }
    if (G.dead==='숙청') G.flags.purged = 1;
    const total = G.dynScore + (unify ? 1500 : 0);
    const prev = META.best[G.firstPid] || 0;
    if (total > prev) META.best[G.firstPid] = total;
    const fameBefore = META.fame; META.fame += total;
    const got = [];
    const give = id => { if (!META.ach[id]){ META.ach[id] = 1; got.push(id); } };
    const first = G.dyn[0];
    if (first && G.firstHist && first.d > G.firstHist) give('fate');
    if (G.flags.grand) give('grand'); if (G.flags.king) give('king'); if (unify) give('unify'); if (G.flags.defected) give('turncoat');
    if (G.wins>=15) give('warlord'); if (G.duels>=5) give('duelist'); if (G.flags.swornNew) give('sworn'); if (G.gen>=3) give('dynasty');
    if (G.maxAge>=70) give('long'); if (G.flags.purged) give('purged'); if (Object.keys(META.played).length>=3) give('three'); if (total>=3000) give('score');
    if ((G.flags.sieges||0)>=10) give('siege'); if (G.flags.joint) give('joint');
    const unlocked = Object.entries(ALL_PICKS()).filter(([id,c]) => c > fameBefore && c <= META.fame).map(([id]) => PEOPLE_RAW.find(r=>r[0]===id)[1]);
    G.end = { total, prev, best: total>prev, got, unlocked, unify };
    G.dynEnded = true;
    saveMeta();
    if (!SIM && G.slot!=null) try { localStorage.removeItem(slotKey(G.slot)); } catch(e) {}
  }
  G.phase = 'over';
}
function noHeir(){ G.over = { kind:'end' }; endGame(); }

function loadSlot(i){ if (SIM) return null; try { return JSON.parse(localStorage.getItem(slotKey(i))); } catch(e) { return null; } }
function freeSlot(){ for (let i=0;i<SLOTS;i++) if (!loadSlot(i)) return i; return -1; }
function slotLabel(sv){ const q = sv && sv.people && sv.people[sv.pid]; return q ? `${q.n} · ${sv.surname}씨 ${sv.gen}대 · ${sv.year}년 ${sv.month}월` : '(손상된 기록)'; }

function save(){
  if (SIM || !G || G.phase==='over') return;
  if (G.rank>=5) G.flags.grand = 1;
