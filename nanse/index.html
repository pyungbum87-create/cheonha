const EVM = {}; EVENTS.forEach(e => EVM[e.id] = e);
const roleOk = e => !e.r || (e.r==='o' && G.role==='officer') || (e.r==='r' && G.role==='ruler') || (e.r==='n' && G.role==='ronin');

function pickEvent(){
  let ev = EVENTS.find(e => e.forced && !(G.done[e.id] && !e.rep) && roleOk(e) && e.forced());
  const ctx = {};
  if (!ev){
    const pool = [];
    for (const e of EVENTS){
      if (e.forced || G.recent.includes(e.id) || (e.once && G.done[e.id]) || !roleOk(e)) continue;
      if (e.cond && !e.cond()) continue;
      const c = {};
      if (e.npc){ c.npc = e.npc(); if (!c.npc) continue; }
      if (e.city){ c.city = e.city(); if (!c.city) continue; }
      if (e.fac){ c.fac = e.fac(); if (!c.fac) continue; }
      if (e.kid){ c.kid = e.kid(); if (!c.kid) continue; }
      pool.push([e, c]);
    }
    if (!pool.length) return false;
    let tot = pool.reduce((a,[e])=>a+(e.w||1),0)*Math.random();
    let pr = pool[pool.length-1];
    for (const p of pool){ if ((tot -= (p[0].w||1)) <= 0){ pr = p; break; } }
    ev = pr[0]; Object.assign(ctx, pr[1]);
  }
  if (ev.once || (ev.forced && !ev.rep)) G.done[ev.id] = 1;
  if (ev.id==='newlord') G.flags.lordDied = 0;
  G.recent.push(ev.id); if (G.recent.length>6) G.recent.shift();
  G.ev = { id:ev.id, ...ctx };
  G.ev.text = ev.x();
  G.ev.res = null;
  G.phase = 'event';
  return true;
}
const evChoices = () => EVM[G.ev.id].c().filter(Boolean);

function applyEff(e){
  const chips = [];
  const add = (label, v, f) => { if (v) chips.push([`${label} ${v>0?'+':''}${f?f(v):v}`, v>0]); };
  const A = G.inArmy ? armyById(G.inArmy) : null;
  let extra = '';
  for (const k of Object.keys(e)){
    let v = e[k];
    switch (k){
      case 'mer': G.merit = Math.max(0, G.merit+v); add('공적', v); break;
      case 'tr': add(G.role==='ruler'?'민심':'신뢰', trustAdd(v)); break;
      case 'trSet': G.trust = v; chips.push([`신뢰 ${v}`, true]); break;
      case 'gold': G.gold = Math.max(0, G.gold+v); add('금', v); break;
      case 'tp': if (G.role==='ruler'){ const c = city(G.city); if (c.owner===G.pfac){ c.troops = Math.max(0, c.troops+v); add('병력', v, fmt); } } else if (A){ A.troops = Math.max(100, A.troops+v); add('군단 병력', v, fmt); } else { G.troops = clamp(G.troops+v, 0, 99999); add('병력', v, fmt); } break;
      case 'tpA': if (A){ const n = Math.round(A.troops*v); A.troops = Math.max(100, A.troops+n); add('군단 병력', n, fmt); } break;
      case 'tpC': { const c = city(G.city); const n = Math.round(c.troops*v); c.troops = Math.max(0, c.troops+n); add('성 병력', n, fmt); break; }
      case 'moraleA': if (A){ A.morale = clamp(A.morale+v); add('군단 사기', v); } break;
      case 'foodA': if (A){ A.food = Math.max(0, A.food+v); add('군량(개월)', v); } break;
      case 'wallT': if (A){ const t = city(A.to); t.wall = Math.max(0, t.wall+v); add(`${t.n} 성벽`, v); } break;
      case 'wallC': { const c = city(G.city); c.wall = Math.min(maxWall(c), c.wall+v); add('성벽', v); break; }
      case 'raid': { const list = G.armies.filter(a => a.state==='siege' && a.to===G.city); for (const a of list){ a.troops = Math.round(a.troops*.88); a.morale = Math.max(5, a.morale-15); } chips.push(['적 병력 -12%', true], ['적 사기 -15', true]); break; }
      case 'rescue': { const c = city(G.city), share = 1; const ds = peopleIn(G.city, G.pfac).filter(p => bond(p.id)>=40).slice(0,1).map(p=>p.id);
        createArmy({ fac:G.pfac, gens:[G.pid, ...ds], troops:G.troops, from:G.city, to:G.ev.city, kind:'reinforce', food:3, train:G.train, player:true, share }); G.troops = 0; chips.push(['구원 출진', true]); break; }
      case 'scoutC': G.scout[G.ev.city] = mi()+6; chips.push(['정찰 6개월', true]); break;
      case 'insideC': G.plots[G.ev.city] = mi()+3; chips.push(['내응 준비', true]); break;
      case 'hp': if (v<0 && me().tr==='강철') v = Math.round(v*.6); G.hp = clamp(G.hp+v); add('체력', v); break;
      case 'train': G.train = clamp(G.train+v); add('훈련', v); break;
      case 'm': case 'i': case 'l': case 'c': me()[k] = clamp(me()[k]+v); add(ST[k], v); break;
      case 'dev': { const c = city(G.city); if (c.owner===G.pfac){ c.dev = clamp(c.dev+v, 1, 10); add('개발', v); } break; }
      case 'bondN': if (G.ev.npc){ addBond(G.ev.npc, v); add(`${N()} 인연`, v); } break;
      case 'bondAll': mates().forEach(p => addBond(p.id, v)); add('동료 인연', v); break;
      case 'loyAll': npcs().filter(p => p.fac===G.pfac).forEach(p => p.loy = clamp(p.loy+v)); add('충성', v); break;
      case 'fam': G.kids.forEach(k => { const s = pick(['m','i','l','c']); k.st[s] = clamp(k.st[s]+v, 1, 100); }); if (G.kids.length) add('자녀 잠재력', v); break;
      case 'kidSt': { const kd = kidById(G.ev.kid); kd.st[v[0]] = clamp(kd.st[v[0]]+v[1], 1, 100); chips.push([`${kd.n} ${ST[v[0]]} +${v[1]}`, true]); break; }
      case 'sworn': if (!isSworn(G.ev.npc)){ G.sworn.push(G.ev.npc); addBond(G.ev.npc, 100); G.flags.swornNew = 1; chips.push(['의형제',true]); news(`${J(me().n,'이')} ${J(N(),'과')} 의형제를 맺었다.`, true, false); } break;
      case 'marryP': { const p = person(G.ev.npc); if (!p || spList().length>=MAXSP()) break; const sn = surnameOf(p.n); addSpouse({ n:`${sn}씨`, st:{ m:Math.round(p.m*.7), i:Math.round(p.i*.8), l:Math.round(p.l*.7), c:Math.round(p.c*.85) }, from:p.id, y:G.year, look:spouseLook() }); if (p.fac===G.pfac){ p.inlaw = 1; p.loy = 100; } addBond(p.id, 25); chips.push(['혼인',true],[`${p.n} 인연 +25`,true]); news(`${J(me().n,'이')} ${p.n}의 딸과 혼인했다.`, true, false); break; }
      case 'marry': { if (spList().length>=MAXSP()) break; const s = pick(NOBLE); addSpouse({ n:`${s}씨`, st:{ m:ri(30,60), i:ri(45,80), l:ri(30,60), c:ri(55,85) }, from:null, y:G.year, look:spouseLook() }); chips.push(['혼인',true]); news(`${J(me().n,'이')} ${s}씨와 혼인했다.`, true, false); break; }
      case 'ally': { const f = G.ev.fac; fac(G.pfac).ally[f] = v*12; fac(f).ally[G.pfac] = v*12; for (const a of armiesOf(f)) if (city(a.to).owner===G.pfac) sendHome(a); chips.push([`${facName(f)}과 동맹`, true]); break; }
      case 'join': { const p = person(G.ev.npc); p.fac = G.pfac; p.loy = 60; addBond(p.id, 15); chips.push([`${p.n} 합류`, true]); news(`${J(p.n,'이')} ${facName(G.pfac)}에 합류했다.`, true, false); break; }
      case 'joinCity': joinFaction(city(G.city).owner, ''); G.toast = null; chips.push(['출사',true]); break;
      case 'war': { G.campaign = { target:G.ev.city, until:mi()+2, support:supportAmt(), deps:2 };
        const ds = peopleIn(G.city, G.pfac).sort((a,b)=>(b.m+b.l)-(a.m+a.l)).slice(0,2).map(p=>p.id);
        const ap = G.ap; G.ap = Math.max(1, G.ap); ACT.campaign(G.ev.city, ds, 6); G.ap = ap; G.toast = null; chips.push(['출진', true]); break; }
      case 'ronin': { const old = G.pfac; G.pfac = null; G.role = 'ronin'; me().fac = 'free'; G.rank = 0; if (G.gov){ city(G.gov).gov = null; G.gov = null; } G.mission = null; G.campaign = null;
        if (G.inArmy){ const a = armyById(G.inArmy); if (a){ a.gens = a.gens.filter(g => g!==G.pid); a.player = false; } G.inArmy = null; me().army = null; }
        const dest = city(G.city).adj.map(city).find(c => c.owner!==old); if (dest){ G.city = dest.id; me().city = dest.id; } chips.push(['재야',false]); news(`${J(me().n,'이')} ${facName(old)}을(를) 떠났다.`, true, false); break; }
      case 'indep': ACT.independence(true); G.toast = null; chips.push(['독립',true]); break;
      case 'die': G.dead = v; break;
      case 'guandu': { const foe = G.pfac==='wei' ? 'yuan' : 'wei'; const c = citiesOf(foe).sort((a,b)=>b.troops-a.troops)[0]; if (c){ c.troops = Math.round(c.troops*.55); extra = ` ${c.n}의 적 병력이 크게 줄었다.`; } for (const a of armiesOf(foe)) a.food = Math.max(0, a.food-3); break; }
      case 'chibi': { citiesOf('wei').forEach(c => { if (RIVER_CITIES.includes(c.id) || c.adj.some(a => RIVER_CITIES.includes(a))) c.troops = Math.round(c.troops*.5); });
        for (const a of armiesOf('wei')) if (RIVER_CITIES.includes(a.to)) a.troops = Math.round(a.troops*.4);
        if (G.role==='ruler') for (const f of ['wu','shu']) if (f!==G.pfac && fac(f).alive){ fac(G.pfac).ally[f] = 36; fac(f).ally[G.pfac] = 36; }
        extra = ' 조조군 남방 병력이 절반으로 줄었다.'; news('장강에서 조조의 대군이 불타 무너졌다.', true, false); break; }
      case 'kongming': { const p = person('zhugeliang'); p.fac = G.pfac; p.city = G.inArmy ? (capitalOf(G.pfac)||G.city) : G.city; p.loy = 80; addBond('zhugeliang', 60); chips.push(['제갈량 합류',true]); news(`제갈량이 ${facName(G.pfac)}에 출사했다.`, true, false); break; }
    }
  }
  return { chips, extra };
}
function chooseEvent(i){
  if (G.phase!=='event' || G.ev.res) return;
  const c = evChoices()[i]; if (!c) return;
  if (c.cost && G.gold < c.cost) return;
  let ok = true, eff = c.ok;
  if (c.chk){ ok = roll(c.chk[0], c.chk[1]); eff = ok ? c.ok : c.no; }
  const msg = eff.msg;
  const { chips, extra } = applyEff(eff);
  G.ev.res = { t:c.t, ok, msg:(msg||'') + extra, chips };
  if (G.hp<=0 && !G.dead) G.dead = '병사';
  save();
}
function afterEvent(){
  if (G.dead){ G.phase = 'succession'; save(); return; }
  G.ev = null; G.phase = 'act';
  save();
}

function setupMap(){
  const sc = document.getElementById('mapScroll'), inner = document.getElementById('mapInner');
  if (!sc || !inner) return;
  const W = () => inner.offsetWidth, Hh = () => inner.offsetWidth*MAP_H/MAP_W;
  const centerOn = (x, y) => { sc.scrollLeft = x/MAP_W*W() - sc.clientWidth/2; sc.scrollTop = y/MAP_H*Hh() - sc.clientHeight/2 + 30; };
  if (MAPS && MAPS.z===MAPZ) { sc.scrollLeft = MAPS.l; sc.scrollTop = MAPS.t; }
  else if (MAPS && MAPS.cx!=null){ centerOn(MAPS.cx, MAPS.cy); }
  else { const m = mePos(); centerOn(m.x, m.y); }
  const remember = () => { MAPS = { z:MAPZ, l:sc.scrollLeft, t:sc.scrollTop, cx:(sc.scrollLeft+sc.clientWidth/2)/W()*MAP_W, cy:(sc.scrollTop+sc.clientHeight/2-30)/Hh()*MAP_H }; };
  remember();
  sc.addEventListener('scroll', remember, { passive:true });
  const zoom = k => { remember(); const cx = MAPS.cx, cy = MAPS.cy; MAPZ = clamp(MAPZ*k, 1, 4*MAP_K); inner.style.width = Math.round(MAPZ*100)+'%'; centerOn(cx, cy); remember(); };
  const zi = document.getElementById('zIn'), zo = document.getElementById('zOut'), tm = document.getElementById('toMe');
  if (zi) zi.onclick = () => zoom(1.3); if (zo) zo.onclick = () => zoom(1/1.3);
  if (tm) tm.onclick = () => { const m = mePos(); centerOn(m.x, m.y); remember(); };
  sc.addEventListener('pointerdown', e => { if (e.pointerType!=='mouse') return; mapDrag = { x:e.clientX, y:e.clientY, l:sc.scrollLeft, t:sc.scrollTop }; mapMoved = false; });
  sc.addEventListener('click', e => { if (mapMoved){ e.stopPropagation(); e.preventDefault(); mapMoved = false; } }, true);
  if (!mapHandlersOn){ mapHandlersOn = true;
    window.addEventListener('pointermove', e => { if (!mapDrag) return; const el = document.getElementById('mapScroll'); if (!el) return; const dx = e.clientX-mapDrag.x, dy = e.clientY-mapDrag.y; if (Math.abs(dx)+Math.abs(dy) > 5) mapMoved = true; el.scrollLeft = mapDrag.l - dx; el.scrollTop = mapDrag.t - dy; });
    window.addEventListener('pointerup', () => { mapDrag = null; }); }
}

  o += `<path d="M${160-hw/2-14} ${top-14} Q160 ${top-30} ${160+hw/2+14} ${top-14} L${160+hw/2+6} ${top-20} Q160 ${top-36} ${160-hw/2-6} ${top-20}Z" fill="${roof}"/>`;

    : a.kind==='reinforce' ? `${t.n} 구원 중 · ${a.eta}개월 뒤 도착` : `${J(t.n,'으로')} 진군 중 · ${a.eta}개월 뒤 도착`;
  let btns = '';
  if (mine && a.state!=='return' && (G.role==='ruler' || a.player)){
    btns = `<div class="row wrap"><button class="btn2" data-act="retreatArmy" data-arg="${a.id}">퇴각</button><button class="btn2" data-act="supply" data-arg="${a.id}" ${G.ap>0 && G.gold>=foodCost(a.troops,3)?'':'disabled'}>군량 3개월 (금 ${fmt(foodCost(a.troops,3))})</button></div>`;
  } else if (!mine && G.pfac && (t.owner===G.pfac || city(a.to).adj.some(x => city(x).owner===G.pfac)) && a.state!=='return'){
    const ch = Math.round(armyPlotChance(a)*100);
    btns = `<div class="row wrap"><button class="btn2" data-act="armyPlot" data-arg="rumor" data-arg2="${a.id}" ${G.ap>0?'':'disabled'}>유언비어 ${ch}%</button><button class="btn2" data-act="armyPlot" data-arg="fire" data-arg2="${a.id}" ${G.ap>0&&G.gold>=100?'':'disabled'}>진영 화계 ${Math.max(5,ch-10)}% · 금 100</button></div>`;
  }
  return `<div class="card armycard ${mine?'':'enemy'}" style="${mine?'':''}">
    <div class="row between"><div class="row"><span class="seal" style="width:28px;height:28px;font-size:17px;background:${facColor(a.fac)}">${facSeal(a.fac)}</span><div><b>${esc(armyName(a))}</b><div class="tiny muted">${esc(facName(a.fac))}${a.player?' · 그대가 지휘':''}</div></div></div>
      <span class="chip ${a.state==='siege'?'red':''}">${a.state==='siege'?'공성':a.state==='return'?'귀환':a.kind==='reinforce'?'구원':'진군'}</span></div>
    <div class="row">${gens.map(p => pp(p,30)).join('')}<span class="small muted grow">${gens.map(p=>p.n).join(' · ') || '장수 없음'}</span></div>
    <div class="small">${st}</div>
    ${vis ? `<div class="two">${bar('병력', a.troops, a.max, facColor(a.fac), fmt(a.troops))}${bar('사기', a.morale, 100, a.morale<35?'var(--red)':'var(--gold)')}</div>${mine?bar('군량', Math.max(0,a.food), 9, a.food<2?'var(--red)':'var(--good)', `${a.food}개월`):''}` : '<div class="small muted">병력을 알 수 없다.</div>'}
    ${btns}
  </div>`;
}
function viewArmy(){
  const mine = G.armies.filter(a => a.fac===G.pfac);
  const threats = G.pfac ? G.armies.filter(a => a.fac!==G.pfac && (city(a.to).owner===G.pfac) && a.state!=='return') : [];
  const others = G.armies.filter(a => a.fac!==G.pfac && !threats.includes(a) && armyVisible(a) && a.state!=='return');
  let head = '';
  if (G.role==='officer'){
    const m = G.mission;
    if (m){ const pr = missionProg();
      head += `<div class="card" style="border-left:4px solid var(--gold)"><span class="lbl">주공 ${esc(lordName())}의 명 · ${m.months}개월 남음</span><b style="font-family:var(--display);font-size:18px;font-weight:400">${esc(missionText(m))}</b>
        <span class="small muted">${m.t==='capture'?(pr?'완료':'아직'):m.t==='defend'?'기한까지 지키면 완수':`${fmt(Math.max(0,pr))} / ${fmt(m.goal)}`}</span></div>`; }
    if (G.campaign && G.campaign.until>=mi() && !G.campaign.used) head += `<div class="card"><b>${city(G.campaign.target).n} 공략 허가</b><span class="small">지원군 ${fmt(G.campaign.support)} · 부장 ${G.campaign.deps}명 · 군량 무상 · ${G.campaign.until-mi()}개월 안에 출진</span>
      <button class="btn fac" data-sheet="campaign" data-arg="${G.campaign.target}" ${G.inArmy?'disabled':''}>출진 계획 세우기</button></div>`;
  }
  if (G.role==='ruler') head += `<div class="card"><b>작전 세우는 법</b><span class="small muted">지도에서 적 성을 눌러 <b>출진</b>을 고르면, 인접한 여러 성에서 장수와 병력을 골라 한꺼번에 보낼 수 있다(합동 공격). 군단은 다음 달 도착해 달마다 공성한다.</span></div>`;
  return `<div class="pane">${head}
    <div class="sec"><h3>우리 군단</h3><span class="small muted">${mine.length}개</span></div>
    ${mine.length ? mine.map(armyCard).join('') : '<p class="small muted">출정 중인 군단이 없다.</p>'}
    <div class="sec"><h3>다가오는 적</h3><span class="small muted">${threats.length}개</span></div>
    ${threats.length ? threats.map(armyCard).join('') : '<p class="small muted">우리 땅을 노리는 군대는 보이지 않는다.</p>'}
    ${others.length ? `<div class="sec"><h3>천하의 전선</h3></div>${others.slice(0,8).map(armyCard).join('')}` : ''}
  </div>`;
}

/* ---------- 인물 ---------- */
function prowHtml(p){
  const bd = bond(p.id), col = bd>=60 ? 'var(--good)' : bd<0 ? 'var(--red)' : 'var(--gold)';
  const badges = [isSworn(p.id)?'<span class="badge">의형제</span>':'', aliveFacs().some(f=>f.ruler===p.id)?'<span class="badge" style="background:var(--ink)">군주</span>':'', p.fam?'<span class="badge" style="background:var(--good)">가족</span>':'', p.army?'<span class="badge" style="background:var(--red)">원정</span>':''].join(' ');
  return `<button class="prow" data-person="${p.id}">${pp(p,38)}<span class="nm">${esc(p.n)} ${badges}</span>
    <span class="mini">${ageOf(p)}세 · 무${p.m} 지${p.i} 통${p.l} 매${p.c}${G.role==='ruler'&&p.fac===G.pfac?` · 충성 ${Math.round(p.loy)}`:''}<br>${p.army ? '원정 중' : esc(city(p.city).n)}${city(p.city).gov===p.id && !p.army?' 태수':''}</span>
    <span class="bond"><span class="tiny" style="font-weight:800">${bd}</span><div class="track"><i style="width:${clamp((bd+100)/2)}%;background:${col}"></i></div></span></button>`;
}
function viewPeople(){
  const tabs = [['mine', G.pfac?'우리 세력':'이 성'], ['free','재야'], ['world','천하']];
  let body = '';
  if (peopleTab==='free'){
    const frees = npcs().filter(p => p.fac==='free' && !p.army && (visible(p.city))).sort((a,b)=>(b.m+b.i+b.l+b.c)-(a.m+a.i+a.l+a.c));
    body = `<div class="card"><div class="small muted">재야 인물은 우리 성에 있을 때 등용할 수 있다.</div>${frees.length ? frees.map(prowHtml).join('') : '<p class="small muted">보이는 재야 인물이 없다.</p>'}</div>`;
  } else if (peopleTab==='world'){
    const fs = aliveFacs().filter(f => citiesOf(f.id).length || armiesOf(f.id).length).sort((a,b)=>citiesOf(b.id).length-citiesOf(a.id).length);
    body = `<div class="card">${fs.map(f => { const r = person(f.ruler); return `<div class="prow">${r?pp(r,38):''}<span class="mini" style="color:var(--ink)"><b>${esc(facName(f.id))}</b> · ${citiesOf(f.id).length}성 · 병력 ${fmt(totalTroops(f.id))}${allied(G.pfac,f.id)?` · <b style="color:var(--good)">동맹 ${fac(G.pfac).ally[f.id]}개월</b>`:''}</span>
      ${G.role==='ruler' && f.id!==G.pfac && !allied(G.pfac,f.id) ? `<button class="ghost" data-act="diplo" data-arg="${f.id}" ${G.ap>0&&G.gold>=200?'':'disabled'}>동맹 제안</button>` : ''}</div>`; }).join('')}</div>`;
  } else {
    const mine = (G.pfac ? npcs().filter(p => p.fac===G.pfac) : peopleIn(G.city)).sort((a,b)=>bond(b.id)-bond(a.id));
    body = `${G.role==='ruler' ? `<div class="row between"><span class="small muted">장수를 눌러 교류·배치·포상</span><button class="ghost" data-act="autoAssign">빈 성에 자동 배치</button></div>` : '<span class="small muted">장수를 눌러 교류하자. 인연이 깊으면 전투를 돕고 의형제를 맺는다.</span>'}
      <div class="card">${mine.length ? mine.map(prowHtml).join('') : '<p class="small muted">아무도 없다.</p>'}</div>`;
  }
  return `<div class="pane"><div class="seg">${tabs.map(([k,n])=>`<button data-ptab="${k}" aria-pressed="${peopleTab===k}">${n}</button>`).join('')}</div>${body}</div>`;
}

/* ---------- 가문 ---------- */
function viewFamily(){
  const kids = G.kids.map(k => {
    const a = G.year-k.born, canEdu = a>=5 && a<=16 && G.ap>0, adult = a>=15;
    return `<div class="prow" style="flex-wrap:wrap">${kp(k,40)}<span class="nm">${esc(k.n)} ${G.heir===k.id?'<span class="badge">후계</span>':''}${k.momN?`<br><span class="small muted">모 ${esc(k.momN)}</span>`:''}</span>
      <span class="mini">${k.sex} · ${a}세<br>무${kidStat(k,'m')} 지${kidStat(k,'i')} 통${kidStat(k,'l')} 매${kidStat(k,'c')} <span class="muted">(잠재 ${k.st.m}/${k.st.i}/${k.st.l}/${k.st.c})</span></span>
      <div class="row wrap" style="width:100%;gap:5px">${a>=5&&a<=16 ? ['m','i','l','c'].map(s=>`<button class="ghost" data-act="educate" data-arg="${k.id}" data-arg2="${s}" ${canEdu?'':'disabled'}>${ST[s]} 교육</button>`).join('') : ''}
      ${adult && !k.pid && !k.out && !k.dead ? `<button class="ghost" data-act="enlist" data-arg="${k.id}" ${G.ap>0&&G.pfac?'':'disabled'}>장수로 출사</button><button class="ghost" data-sheet="kidmarry" data-arg="${k.id}">혼인 맺기</button>` : ''}
      ${G.heir!==k.id && adult && !k.out && !k.dead ? `<button class="ghost" data-heir="${k.id}">후계로 지정</button>` : ''}
      ${k.pid && !k.dead ? `<span class="badge">장수${person(k.pid) && person(k.pid).army ? ' · 출정 중' : ''}</span>` : ''}${k.out && k.left ? `<span class="badge">어머니를 따라감${k.pid?' · 장수':''}</span>` : k.out ? `<span class="badge">${esc(k.outN||'')} 가문과 혼인</span>` : ''}${k.dead ? `<span class="badge" style="background:#8a2a22">${k.dead}년 전사</span>` : ''}</div></div>`;
  }).join('');
  const canWed = spList().length<MAXSP();
  const matches = !canWed ? [] : mates().filter(p => bond(p.id)>=50 && !p.fam && !isInlawId(p.id) && ageOf(p)>=30).sort((a,b)=>bond(b.id)-bond(a.id)).slice(0,4);
  const allyFacs = G.role==='ruler' && canWed ? aliveFacs().filter(f=>f.id!==G.pfac && !(person(f.ruler) && isInlawId(f.ruler))).sort((a,b)=>citiesOf(b.id).length-citiesOf(a.id).length).slice(0,4) : [];
  const histKids = npcs().filter(q => PARENT[q.id]===G.pid);
  return `<div class="pane">
  <div class="card"><div class="row between"><h3>${G.surname}씨 가문 · ${G.gen}대</h3><span class="chip gold">가문 점수 ${fmt(G.dynScore)}</span></div>
    <p class="small muted">자식이 15세가 되면 장수로 출사시켜 곁에서 싸우게 하거나, 다른 가문과 혼인시켜 관계를 굳힐 수 있다. 그대가 죽으면 후계자가 이어서 플레이한다.</p>
    ${spList().length ? spList().map((sp,i) => `<div class="row between"><div class="row">${ptHTML(sp.look||spouseLook(), Math.max(16, ageOf(me())-3), true, facColor(G.pfac), 40)}<span>${i===0?'정실':'부인'} <b>${esc(sp.n)}</b> <span class="small muted">(${sp.y}년 혼인${sp.from&&person(sp.from)?' · '+esc(person(sp.from).n)+'의 딸':''})</span></span></div><button class="ghost" data-sheet="divorce" data-arg="${sp.id}">이혼</button></div>`).join('') : '<div class="row"><span class="small">배우자 없음</span></div>'}
    ${canWed && ageOf(me())>=15 ? `<div class="acts">${actBtn('명문가 혼담','금 300','data-act="marry" data-arg="noble"',G.ap>0&&G.gold>=300)}
      ${matches.map(p=>actBtn(`${p.n}의 딸`,`인연 ${bond(p.id)}`,`data-act="marry" data-arg="${p.id}"`,G.ap>0)).join('')}
      ${allyFacs.map(f=>actBtn(`${person(f.ruler).n}의 딸`,'혼인 동맹 · 금 400',`data-act="marry" data-arg="fac:${f.id}"`,G.ap>0&&G.gold>=400)).join('')}</div>` : ''}
  </div>
  <div class="card"><h3>자녀</h3>${kids || '<p class="small muted">아직 자녀가 없다. 혼인하면 아이가 태어날 수 있다.</p>'}
    ${histKids.length ? `<span class="lbl">역사 속 자녀</span>${histKids.map(prowHtml).join('')}` : ''}</div>
  ${G.dyn.length ? `<div class="card"><h3>선대</h3>${G.dyn.map((d,i)=>`<div class="prow">${d.look?ptHTML(d.look, d.age||50, false, '#8f8574', 34, 'gray'):''}<span class="nm">${i+1}대 ${esc(d.n)}</span><span class="mini">${d.b}–${d.d} · ${esc(d.fac)} · ${esc(d.cause)}</span><b>${fmt(d.score)}</b></div>`).join('')}</div>` : ''}
  </div>`;
}

/* ---------- 모달 (사건·전투·소식) ---------- */
function viewModal(){
  if (G.phase==='event') return `<div class="modal-bg">${viewEvent()}</div>`;
  if (G.phase==='battle' || G.phase==='battleEnd') return `<div class="modal-bg">${viewBattle()}</div>`;
  if (G.phase==='report') return `<div class="modal-bg">${viewReport()}</div>`;
  return '';
}
function viewEvent(){
  const ev = EVM[G.ev.id];
  const head = G.ev.npc && person(G.ev.npc) ? pp(person(G.ev.npc), 54) : G.ev.kid && kidById(G.ev.kid) ? kp(kidById(G.ev.kid), 54) : `<span class="seal">${ev.s}</span>`;
  if (G.ev.res){
    const r = G.ev.res;
    return `<div class="modal"><div class="ehead">${head}<div><h3>${ev.t}</h3><div class="small muted">${esc(r.t)}</div></div></div>
      <p class="result ${r.ok?'':'bad'}">${esc(r.msg)}</p>${chipsHtml(r.chips)}
      <button class="btn" id="evNext">${G.dead ? '생의 끝' : '확인'}</button></div>`;
  }
  return `<div class="modal"><div class="ehead">${head}<div><h3>${ev.t}</h3><div class="small muted">${dateStr()}</div></div></div>
    <p>${esc(G.ev.text)}</p>
    <div class="choices">${evChoices().map((c,i)=>{
      let tag = '';
      if (c.chk){ const p = Math.round(check(c.chk[0], c.chk[1])*100); tag = `<span class="p ${p>=60?'hi':p<40?'lo':''}">${ST[c.chk[0]]} ${p}%</span>`; }
      return `<button class="choice" data-ev="${i}" ${c.cost && G.gold<c.cost?'disabled':''}><span>${esc(c.t)}</span>${tag}</button>`;
    }).join('')}</div></div>`;
}
function viewReport(){
  const items = G.mnews.slice().sort((a,b) => (b.mine?1:0)-(a.mine?1:0)).slice(0, 14);
  return `<div class="modal"><div class="ehead"><span class="seal">報</span><div><h3>${G.repDate||dateStr()}의 소식</h3><div class="small muted">${G.lastIncome ? `수입 금 +${fmt(G.lastIncome)}` : ''}</div></div></div>
    <div class="news">${items.map(n => `<div class="${n.mine?'mine':''}">${esc(n.t)}</div>`).join('') || '<div>조용한 달이었다.</div>'}</div>
    ${G.dead ? `<p class="result bad">${esc(me().n)}의 숨이 멎었다.</p>` : ''}
    <button class="btn" id="reportNext">${G.over ? (G.over.kind==='era'?'시대의 끝':'천하통일!') : G.dead ? '생의 끝' : `${dateStr()}을 맞는다`}</button></div>`;
}
function sideHtml(s, label){
  const hint = s.isPlayer ? (s.helpers.length ? `함께: ${s.helpers.join(', ')}` : '') : (s.helpers && s.helpers.length ? `부장: ${s.helpers.join(', ')}` : tendency(s));
  const face = s.isPlayer ? pp(me(),36) : s.gid && person(s.gid) ? pp(person(s.gid),36) : ptHTML(DEFAULT_LOOK, 35, false, facColor(s.fid), 36);
  return `<div class="side"><span class="lbl">${label}${s.joint>1?` · 합동 ${s.joint}군단`:''}</span><div class="row">${face}<h3>${esc(s.name)}</h3></div>
    <div class="st">무 ${s.st.m} · 지 ${s.st.i} · 통 ${s.st.l}</div>
    ${s.u ? `<div><span class="chip gold">${UNITS[s.u][0]} · 적성 ${s.apt}</span></div>` : '<div><span class="chip">병종 선택 중</span></div>'}
    ${bar('병력', s.troops, s.max, 'var(--fac)', fmt(s.troops))}
    ${bar('사기', s.morale, 100, s.morale<35?'var(--red)':'var(--gold)')}
    ${hint ? `<div class="tiny muted">${esc(hint)}</div>` : ''}</div>`;
}
function tendency(s){ const m = Math.max(s.st.m, s.st.i, s.st.l); return m===s.st.m ? '성향: 돌격을 즐긴다' : m===s.st.i ? '성향: 화공을 노린다' : '성향: 기습과 방진에 능하다'; }
const TGL = { charge:'突', fire:'火', ambush:'伏', wall:'陣' };
function duelHtml(B, foe){
  const ds = B.ds, fp = foe.gid && person(foe.gid);
  const hp = (v, col) => `<div class="dhp"><i style="width:${clamp(v,0,100)}%;background:${col}"></i><b>${Math.round(v)}</b></div>`;
  const card = k => `<button class="tac dm" data-dm="${k}"><b><span class="gl">${DMOVE[k][2]}</span>${DMOVE[k][0]}${ds.hint && DBEATS[k]===ds.hint ? ' <span class="chip up">간파 우위</span>' : ''}</b><small>${DMOVE[k][1]}</small></button>`;
  return `<div class="duelp"><div class="mhead"><span class="seal">鬪</span><b>일기토 · ${Math.min(ds.r, ds.maxR)}합 / ${ds.maxR}</b></div>
    <div class="dside"><div class="dm1">${pp(me(),38)}<div><b>${esc(me().n)}</b><small>무 ${ds.my}</small></div></div><div class="dvs">對</div><div class="dm1 r">${fp ? pp(fp,38) : ptHTML(DEFAULT_LOOK, 35, false, facColor(foe.fid), 38)}<div><b>${esc(foe.name)}</b><small>무 ${ds.fm}</small></div></div></div>
    <div class="dbars">${hp(ds.mh,'var(--gold)')}${hp(ds.fh,'var(--red)')}</div>
    ${ds.last ? `<p class="dlog">${esc(ds.last)}</p>` : ''}
    <p class="scout ${ds.hint ? '' : 'dim'}"><span class="seal sm ${ds.hint ? '' : 'dim'}">諜</span>${ds.hint ? esc(DHINT[ds.hint]) : `적의 수를 읽지 못했다. (지략 ${ds.mi} 대 ${ds.fi})`}</p>
    <div class="tacs three">${Object.keys(DMOVE).map(card).join('')}</div>
    <div class="row"><button class="btn2 grow" id="duelAuto">알아서 겨룬다</button><button class="btn2" id="duelFlee">물러난다</button></div>
    <p class="tiny muted">강타 › 받아치기 › 속공 › 강타. 같은 수를 내면 서로 상처 입는다. 이긴 수를 연달아 쓰면 기세가 오른다.</p></div>`;
}
function viewBattle(){
  const B = G.battle, t = city(B.to);
  const title = B.kind==='raise' ? `${t.n} 거병` : B.ps==='def' ? `${t.n} 수성전` : `${t.n} 공성전`;
  const sub = `<span class="chip gold">${TERR_INFO[TERRAIN[B.to]][0]}</span>${B.kind==='siege'?`<span class="chip">성벽 ${t.wall}</span>`:''}`;
  if (B.anim) return `<div class="modal"><div class="row between"><h3>${title}</h3><span class="row">${sub}<span class="chip">${B.anim.kind==='duel'?'일기토':Math.min(B.round-1,3)+'합'}</span></span></div>

    <div class="pxbtns"><button class="pxb" id="pxFast" aria-pressed="${!!(META.prefs||{}).fast}">2배속</button><button class="pxb" id="skipAnim">건너뛰기</button></div></div></div>`;

    ctrl = duelHtml(B, foe);
  } else if (G.phase==='battle' && B.stage==='unit'){
    const tr = TERRAIN[B.to];
    const card = u => {
      const apt = aptOf(me(), u), k = APT_MUL[apt] * UTERR[tr][u] * (foe.u ? (UBEATS[u]===foe.u ? 1.25 : UBEATS[foe.u]===u ? .8 : 1) : 1);
      const rel = !foe.u ? '' : UBEATS[u]===foe.u ? '<b style="color:var(--good)">상성 우위</b> · ' : UBEATS[foe.u]===u ? '<b style="color:var(--red)">상성 열세</b> · ' : '';
      return `<button class="tac" data-unit="${u}"><b>${UNITS[u][0]} <span class="small">적성 ${apt}</span></b><small>${rel}지형 ×${UTERR[tr][u].toFixed(2)}</small><small>종합 <b style="color:${k>=1.1?'var(--good)':k<.9?'var(--red)':'var(--ink)'}">${Math.round(k*100)}%</b></small></button>`;
    };
    ctrl = `<p class="small">${foe.u ? `적은 <b>${J(UNITS[foe.u][0],'을')}</b> 앞세웠다.` : '적의 병종은 아직 알 수 없다.'} 어떤 병종으로 싸울까?</p>
      <div class="tacs">${Object.keys(UNITS).map(card).join('')}</div>
      <div class="row wrap"><button class="btn2 grow" id="autoB">장수들에게 맡긴다</button>${B.kind==='siege' && B.ps==='att' ? '<button class="btn2 grow" id="blockade">포위만 유지</button>' : ''}<button class="btn2" id="retreat">${B.ps==='def'?'성을 버린다':'퇴각'}</button></div>
      ${B.kind==='siege' && B.ps==='att' ? `<p class="tiny muted">포위만 유지하면 이번 달은 싸우지 않고 성벽과 수비 사기를 깎는다. 군량 ${Math.min(...B.armies.map(armyById).filter(Boolean).map(a=>a.food))}개월 남음.</p>` : ''}`;
  } else if (G.phase==='battle' && B.moment && MOMENTS[B.moment]){
    const M = MOMENTS[B.moment];
    ctrl = `<div class="moment"><div class="mhead"><span class="seal">機</span><b>결정적 순간</b></div><p>${esc(M.t(B, mine, foe))}</p>
      <div class="mchoices">${M.c.map(([t, d], i) => `<button class="tac" data-mo="${i}"><b>${esc(t)}</b>${d ? `<small>${esc(d)}</small>` : ''}</button>`).join('')}</div></div>`;
  } else if (G.phase==='battle'){
    const tacBtn = k => `<button class="tac" data-tac="${k}"><b><span class="gl">${TGL[k]}</span>${TAC[k][0]}${mine.u && (USYN[mine.u]||{})[k] ? ' <span class="chip up">시너지</span>' : ''}${B.boost && B.boost.side===B.ps && B.boost.tac===k ? ' <span class="chip up">순풍</span>' : ''}${B.scout && BEATS[k]===B.scout.tac ? ' <span class="chip up">간파 우위</span>' : ''}</b><small>${TAC[k][2]} ${mine.st[TAC[k][1]]} · ${TAC[BEATS[k]][0]}에 강함</small></button>`;
    const scoutLine = B.scout ? `<p class="scout"><span class="seal sm">諜</span>${esc(SCOUT[B.scout.tac])}</p>` : `<p class="scout dim"><span class="seal sm dim">諜</span>적의 움직임을 읽지 못했다. (지략 ${mine.st.i} 대 ${foe.st.i})</p>`;
    ctrl = `${scoutLine}<div class="tacs">${['charge','fire','ambush','wall'].map(tacBtn).join('')}</div>
      <div class="row">${foe.gid && !mine.duel ? `<button class="btn2 grow" id="duel">일기토 (무${me().m} 대 ${foe.st.m})</button>` : ''}<button class="btn2" id="autoB">맡긴다</button><button class="btn2" id="retreat">${B.ps==='def'?'성을 버린다':'퇴각'}</button></div>
      <p class="tiny muted">상성: 돌격 › 화공 › 방진 › 기습 › 돌격. 3합 안에 수비를 무너뜨리지 못하면 포위가 다음 달로 이어진다.</p>`;
  } else {
    const r = B.res;
    ctrl = `<p class="result ${r.win?'':'bad'}">${esc(r.lines.join(' '))}</p>${chipsHtml(r.chips)}`;
    if (r.captive){
      const p = person(r.captive);
      ctrl += `<div class="card" style="background:#fff6dd"><div class="row">${pp(p,40)}<div><b>${esc(p.n)}을(를) 사로잡았다</b><div class="tiny muted">무${p.m} 지${p.i} 통${p.l} 매${p.c} · 인연 ${bond(p.id)}</div></div></div>
        <div class="row">${G.pfac?`<button class="btn2 grow" data-cap="recruit">등용</button>`:''}<button class="btn2 grow" data-cap="release">석방</button><button class="btn2 grow" data-cap="execute">처형</button></div></div>`;
    } else {
      if (r.capMsg) ctrl += `<p class="small">${esc(r.capMsg)}</p>`;
      ctrl += `<button class="btn" id="bNext">${G.dead?'생의 끝':'계속'}</button>`;
    }
  }
  return `<div class="modal"><div class="row between"><h3>${title}</h3><span class="row">${sub}<span class="chip">${G.phase==='battle' ? (B.ds?'일기토':B.stage==='unit'?'포진':`${Math.min(B.round,3)} / 3합`) : B.blockade ? '포위' : B.winner===B.ps ? '승리' : '패배'}</span></span></div>
    ${B.ds ? '' : `<div class="sides">${sideHtml(mine,'아군')}${sideHtml(foe,'적군')}</div>`}
    ${B.log && B.log.length && !B.ds ? `<div class="log">${B.log.map(l=>`<div>${esc(l)}</div>`).join('')}</div>` : ''}
    ${ctrl}</div>`;
}

/* ---------- 타이틀 ---------- */
function prefs(){ if (!META.prefs) META.prefs = { scen:196, mode:'real' }; return META.prefs; }
function rowLook(id){ const r = PEOPLE_RAW.find(x => x[0]===id); return lookOf({ id, n:r[1], m:r[6], i:r[7], l:r[8], c:r[9] }); }
function startNew(pid, sc, md, after){
  const go = slot => { newGame(pid, sc, md); G.slot = slot; save(); render(); if (after) after(); };
  const f = freeSlot(); if (f>=0) return go(f);
  const rows = []; for (let i=0;i<SLOTS;i++) rows.push(`<button class="btn2" data-ow="${i}" style="text-align:left">칸 ${i+1} · ${esc(slotLabel(loadSlot(i)))}</button>`);
  const bg = sheet(`<h3>저장 칸이 가득 찼다</h3><p class="small muted">덮어쓸 칸을 고르면 그 칸의 기록은 사라진다.</p>${rows.join('')}<button class="btn2" data-close>취소</button>`);
  bg.querySelectorAll('[data-ow]').forEach(b => b.onclick = () => { bg.remove(); go(+b.dataset.ow); });
}

  $app.querySelectorAll('[data-ttab]').forEach(b => b.onclick = () => { titleTab = b.dataset.ttab; renderTitle(); });

  $app.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { const i = +b.dataset.del, sv = loadSlot(i);
    const bg = sheet(`<h3>칸 ${i+1} 삭제</h3><p class="small muted">${esc(slotLabel(sv))}<br>이 기록은 되돌릴 수 없다.</p><button class="btn2" id="dOk">삭제한다</button><button class="btn2" data-close>취소</button>`);
    bg.querySelector('#dOk').onclick = () => { bg.remove(); try { localStorage.removeItem(slotKey(i)); } catch(e) {} renderTitle(); }; });
}
function sheet(html){
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bg.onclick = e => { if (e.target===bg) bg.remove(); };
  document.body.appendChild(bg);
  bg.querySelectorAll('[data-close]').forEach(x => x.onclick = () => bg.remove());
  return bg;
}
function G_FACNAME(f, sc){ const r = SCEN[sc].rulers[f]; const row = r && PEOPLE_RAW.find(x => x[0]===r); return row ? row[1]+'군의' : ''; }

  sheet(`<h2>게임 방법</h2>

  ${sec('장수로 살 때', `<p>주공이 <b>임무</b>를 준다. 성 공략 임무에는 <b>지원군과 부장</b>이 붙고 군량도 대 준다. 기한 안에 해내면 승진, 못 하면 신뢰가 떨어진다.</p><p>임무가 없어도 <b>알현</b>이나 출진 화면의 <b>지원 요청</b>으로 공략 허가를 받을 수 있다.</p><p>편장군 이상이면 태수가 되고, 장군이 되면 그 성에서 <b>독립</b>할 수 있다. 옆 성의 다른 세력으로 <b>망명</b>도 가능하다.</p>`)}
  ${sec('군주로 살 때', `<p>성마다 <b>장정</b>이 달마다 조금씩 늘어난다. 징병은 장정 수만큼만 할 수 있다.</p><p>장수를 성에 <b>배치</b>하고 <b>태수</b>로 임명하면 그 성의 병력과 개발이 저절로 늘어난다. 인물 화면의 <b>빈 성에 자동 배치</b>도 쓸 수 있다.</p><p>출진은 그 성에 있는 장수만 지휘할 수 있으니, 공격할 성 옆에 강한 장수를 모아두자.</p>`)}
  ${sec('재야로 살 때', `<p>성의 주인에게 <b>사관</b>하면 장수가 된다. 아니면 <b>의병</b>을 모아 주인 없는 성이나 약한 성을 치는 <b>거병</b>으로 스스로 군주가 된다.</p>`)}
  ${sec('인연·가문', `<p>인물 화면에서 술자리·담론·무예 겨루기·선물로 인연을 쌓는다. 인연 60 이상인 장수는 전투를 돕고, 80 이상이면 의형제를 맺을 수 있다.</p><p>혼인하면 아이가 태어난다. 15세가 넘은 자식을 <b>후계</b>로 정해두면, 그대가 죽은 뒤 그 자식으로 이어서 플레이한다.</p>`)}
  ${sec('모드와 점수', `<p><b>현실 모드</b>는 장수들이 역사 속 사망 연도 즈음에 떠나고, <b>가상 모드</b>는 전사하지 않으면 천수를 누린다. 47성 중 36성을 차지하면 천하통일. 280년이 되면 시대가 끝난다.</p>`)}
  <button class="btn2" data-close>닫기</button>`);

function doAct(name, ...args){
  if (!G || G.phase!=='act') return;
  ACT[name](...args);
  if (G.dead && G.phase==='act') G.phase = 'succession';
  save();
  render();
}
function warSheet(tid){
  const t = city(tid), vis = visible(tid), dg = vis ? bestGen(tid, t.owner) : null;
  const srcs = t.adj.map(city).filter(c => c.owner===G.pfac);
  const plan = {}; let food = 6;
  for (const s of srcs) plan[s.id] = { pct:0, gens:[] };
  const avail = s => [...(!G.inArmy && G.city===s.id ? [me()] : []), ...peopleIn(s.id, G.pfac)].sort((a,b)=>(b.m+b.l)-(a.m+a.l));
  const bg = sheet('');
  const box = bg.querySelector('.sheet');
  const draw = () => {
    let total = 0; const used = [], spec = [];
    for (const s of srcs){ const p = plan[s.id]; if (!p.pct) continue; const n = Math.round(s.troops*p.pct); total += n; used.push(s.id); spec.push({ troops:n, gens:p.gens.slice() }); }
    const est = vis && total ? estimateCapture(spec, tid, food) : null;
    const label = !vis ? '정찰 필요' : !est ? '-' : `함락 ${Math.round(est.p*100)}%`;
    const tone = !est ? '' : est.p>=.65 ? 'up' : est.p<.35 ? 'down' : '';
    const near = t.owner ? t.adj.map(city).filter(c => c.owner===t.owner && c.id!==tid).reduce((a,c)=>a+c.troops,0) : 0;
    const cost = foodCost(total, food), arrive = Math.max(1, ...used.map(id => travel(id, tid)), 1);
    box.innerHTML = `<div class="row between"><h3>${t.n} 공략 작전</h3><span class="chip gold">${TERR_INFO[TERRAIN[tid]][0]}</span></div>
      <div class="kv"><div><span>수비</span><b>${vis?fmt(t.troops):'?'}</b></div><div><span>성벽</span><b>${vis?t.wall:'?'}</b></div><div><span>수비 장수</span><b style="font-size:13px">${dg?esc(dg.n):vis?'없음':'?'}</b></div><div><span>적 주변 병력</span><b style="font-size:13px">${t.owner?fmt(near):'-'}</b></div></div>
      <p class="tiny muted">${TERR_INFO[TERRAIN[tid]][1]}. 적은 주변 성에서 원군을 보낼 수 있다.</p>
      ${srcs.map(s => { const p = plan[s.id], gs = avail(s);
        return `<div class="card" style="gap:6px"><div class="row between"><b>${s.n}에서</b><span class="small muted">병력 ${fmt(s.troops)} · ${travel(s.id,tid)}개월 거리</span></div>
          <div class="seg">${[0,.3,.5,.8].map(v=>`<button data-src="${s.id}" data-pct="${v}" aria-pressed="${p.pct===v}">${v?Math.round(v*100)+'%':'안 보냄'}</button>`).join('')}</div>
          ${p.pct ? `<div class="row wrap" style="gap:5px">${gs.length ? gs.map(g => { const k = p.gens.indexOf(g.id); return `<button class="ghost row" style="gap:5px;padding:3px 9px 3px 3px;${k>=0?'background:var(--ink);color:#f6eedc;border-color:var(--ink)':''}" data-gen="${g.id}" data-src="${s.id}">${pp(g,22)}${k===0?'대장 ':k>0?'부장 ':''}${esc(g.id===G.pid?'그대가 직접':g.n)} <span class="tiny" style="opacity:.7">통${g.l}</span></button>`; }).join('') : '<span class="small" style="color:var(--red)">이 성에 장수가 없다. 장수 없이 보내면 약하다.</span>'}</div>` : ''}
        </div>`; }).join('')}
      <div class="row between"><span class="lbl">군량</span><div class="seg" style="width:60%">${[3,6,9].map(v=>`<button data-food="${v}" aria-pressed="${food===v}">${v}개월</button>`).join('')}</div></div>
      <div class="card" style="background:#26201c0b"><div class="row between"><span>총병력 <b>${fmt(total)}</b>${used.length>1?' · <span class="chip up">합동</span>':''}</span><span class="chip ${tone}">${label}</span></div>
        <span class="small muted">${est && est.p ? `군량이 버티는 ${food}개월 안에 함락할 확률 · 평균 ${est.m.toFixed(1)}개월 · ` : vis ? `군량 ${food}개월 안에는 어렵다 · ` : '정찰하면 함락 확률을 볼 수 있다 · '}${arrive}개월 뒤 도착 · 군량 금 ${fmt(cost)} (보유 ${fmt(G.gold)}) · 행동력 1</span><span class="tiny muted">적 원군·계략·전술은 계산에 없다. 내응과 매복, 직접 지휘로 확률을 끌어올릴 수 있다.</span></div>
      <button class="btn fac" id="goWar" ${total>=500 && G.gold>=cost && G.ap>0 ? '' : 'disabled'}>출진</button><button class="btn2" data-close>닫기</button>`;
    box.querySelectorAll('[data-pct]').forEach(b => b.onclick = () => { const p = plan[b.dataset.src]; p.pct = +b.dataset.pct; if (p.pct && !p.gens.length){ const g = avail(city(b.dataset.src)).find(x => x.id!==G.pid) || avail(city(b.dataset.src))[0]; if (g) p.gens = [g.id]; } draw(); });
    box.querySelectorAll('[data-gen]').forEach(b => b.onclick = () => { const p = plan[b.dataset.src], id = b.dataset.gen, k = p.gens.indexOf(id); if (k>=0) p.gens.splice(k,1); else if (p.gens.length<3){ if (id===G.pid) p.gens.unshift(id); else p.gens.push(id); } draw(); });
    box.querySelectorAll('[data-food]').forEach(b => b.onclick = () => { food = +b.dataset.food; draw(); });
    box.querySelector('#goWar').onclick = () => { bg.remove(); G.panel = false; doAct('war', tid, srcs.map(s => ({ from:s.id, pct:plan[s.id].pct, gens:plan[s.id].gens })), food); };
    box.querySelectorAll('[data-close]').forEach(x => x.onclick = () => bg.remove());
  };
  draw();
}
function campaignSheet(tid){

      ${pass ? `<div class="card" style="background:#fff6dd"><b>주공의 허가</b><span class="small">지원군 ${fmt(sup)} · 부장 ${maxD}명 · 군량 무상</span></div>`

      <span class="lbl">부장 (최대 ${maxD}명${pass?'':' · 인연 40 이상'})</span>

}

  const on = (sel, fn) => $app.querySelectorAll(sel).forEach(el => el.onclick = e => fn(el, e));
  on('[data-view]', b => { G.view = b.dataset.view; G.panel = false; render(); });
  on('[data-tome]', () => { G.view = 'map'; G.panel = false; MAPS = null; render(); });

/* --- 도트 전투·일기토 연출 (208×117 도트를 확대) --- */
let anim = null;
const ease = x => x<.5 ? 2*x*x : 1 - (-2*x+2)**2/2;
const lerp = (a,b,t) => a + (b-a)*t;
const cl01 = v => Math.max(0, Math.min(1, v));
function makeAnim(kind, B, before){
  const mine = B[B.ps], foe = B.ps==='att' ? B.def : B.att, fp = foe.gid && person(foe.gid);
  const A = { kind, myName:mine.name, foeName:foe.name, myCol:facColor(mine.fid), foeCol:facColor(foe.fid),
    myLook: lookOf(me()), foeLook: fp ? lookOf(fp) : DEFAULT_LOOK, myAge: ageOf(me()), foeAge: fp ? ageOf(fp) : 35,
    myFemale: !!me().female, foeFemale: !!(fp && fp.female), terr: TERRAIN[B.to] || 'plain',
    castle: B.kind==='siege' ? (B.ps==='def' ? 'L' : 'R') : null, wall: B.kind==='siege' ? city(B.to).wall : 0, myU: mine.u, foeU: foe.u, seed: (B.round||1) + B.to };
  if (kind==='fight'){
    const L = B.last, att = B.ps==='att';
    Object.assign(A, { myT: att?L.tA:L.tD, foeT: att?L.tD:L.tA, myAdv: att?L.mA:L.mD, foeAdv: att?L.mD:L.mA, myBf: att?L.bfA:L.bfD, foeBf: att?L.bfD:L.bfA,
      myLoss: before[0]-mine.troops, foeLoss: before[1]-foe.troops, myBefore: before[0], foeBefore: before[1] });
  } else Object.assign(A, B.lastDuel || { win:false, cap:false }, { died: !!G.dead });
  B.anim = A;
}
function runAnim(){
  const B = G.battle, A = B && B.anim, cv = document.getElementById('bcv');
  if (!A || !cv) return;
  if (anim && anim.cv===cv) return;
  if (anim && anim.stop) anim.stop();
  const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
  const me_ = anim = { raf:0, timer:0, cv };
  const stop = () => { cancelAnimationFrame(me_.raf); clearTimeout(me_.timer); };
  const finish = () => { if (anim!==me_) return; stop(); anim = null; if (G && G.battle) G.battle.anim = null; render(); };
  me_.finish = finish; me_.stop = stop;
  pxOverlays(A);
  let reduce = false; try { reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e) {}
  const draw = A.kind==='duel' ? pxDuel(ctx, A) : pxFight(ctx, A);
  if (reduce){ draw(1, 1); me_.timer = setTimeout(finish, 1200); return; }
  const dur = (A.kind==='duel' ? 6200 : 5200) / ((META.prefs||{}).fast ? 2 : 1), t0 = performance.now();
  let prev = 0;
  const frame = now => { if (anim!==me_) return; const t = Math.min(1, (now-t0)/dur); draw(t, prev); prev = t; if (t<1) me_.raf = requestAnimationFrame(frame); else me_.timer = setTimeout(finish, 500); };
  me_.raf = requestAnimationFrame(frame);
}
/* HTML 오버레이 (한글 글자·초상) */
function pxOverlays(A){

    cut.innerHTML = `<div class="band"></div><div class="vp l">${myPt}<b>${esc(A.myName)}</b></div><div class="vsx">VS</div><div class="vp r">${foePt}<b>${esc(A.foeName)}</b></div>`;
  } else {
    const mine = BEATS[A.myT]===A.foeT && !A.myBf, foeWin = BEATS[A.foeT]===A.myT && !A.foeBf;

const TAC_CRY = { charge:'전군, 돌격하라!', fire:'불화살을 쏘아라!', ambush:'복병이여, 일어나라!', wall:'방진을 굳혀라!' };

/* =====================================================================
   수묵 전장 연출 (640×360 고해상 캔버스 · 코드로 그린 먹과 안료)

const VW = 640, VH = 360, HZ = 150, GY0 = 200, GY1 = 338;
const TWO_PI = Math.PI*2;
const TOD = {
  dawn:  { top:'#8fa3b0', mid:'#e6d2b2', low:'#f5c58c', sun:'#fff0c8', sx:.74, sy:.5, far:'#a39fa0', mid2:'#7a7d7e', near:'#4b504e', fog:'255,232,200', gr:['#b89c64','#8e7948','#5e5334'], moon:0 },
  day:   { top:'#a2bccb', mid:'#dbe5df', low:'#efe9d4', sun:'#ffffff', sx:.28, sy:.34, far:'#a9b5b6', mid2:'#7f908d', near:'#4f5e59', fog:'242,242,228', gr:['#aba368','#80864f','#575d38'], moon:0 },
  dusk:  { top:'#5f4d66', mid:'#d4855c', low:'#f2b46a', sun:'#ffd9a0', sx:.24, sy:.52, far:'#8c6c68', mid2:'#5d4a4f', near:'#2f2a30', fog:'240,168,118', gr:['#8c6e4b','#6a5238','#43372a'], moon:0 },
  night: { top:'#0f1729', mid:'#22335a', low:'#4a5a80', sun:'#eef1f7', sx:.7, sy:.24, far:'#33436a', mid2:'#232f4b', near:'#131a2a', fog:'110,134,180', gr:['#3b4842','#2b362f','#1c2420'], moon:1 }
};
const sdOf = A => hashStr(String(A.seed));
function todOf(A){
  const fire = A.kind==='fight' && (A.myT==='fire' || A.foeT==='fire');
  const k = sdOf(A) % 4;
  return TOD[fire ? (k%2 ? 'night' : 'dusk') : ['dawn','day','dusk','day'][k]];
}
const rgba = (rgb, a) => `rgba(${rgb},${a})`;
const BGC = new Map();

function ridge(x, R, base, amp, step, color, fog, fa, floor){
  const pts = []; let h = 0;
  for (let px=-step; px<=VW+step*2; px+=step){ h = h*.5 + (R()-.5)*amp*1.7; pts.push([px, base + h]); }
  x.save();
  x.beginPath(); x.moveTo(-step, floor); x.lineTo(pts[0][0], pts[0][1]);

  for (let i=0;i<pts.length;i++) i ? x.lineTo(pts[i][0], pts[i][1]+2) : x.moveTo(pts[i][0], pts[i][1]+2);
  x.stroke();
  x.restore();
}
function pine(x, px, py, s, tone, fogRgb, fa){
  x.save(); x.translate(px, py); x.scale(s, s);
  x.strokeStyle = tone; x.lineWidth = 2.2; x.lineCap = 'round';
  x.beginPath(); x.moveTo(0, 0); x.lineTo(0.5, -22); x.stroke();
  x.fillStyle = tone;
  for (let i=0;i<4;i++){ const yy = -8 - i*7, w = 13 - i*2.6; x.beginPath(); x.moveTo(-w, yy+5); x.quadraticCurveTo(-w*.4, yy-3, 0, yy-8); x.quadraticCurveTo(w*.4, yy-3, w, yy+5); x.quadraticCurveTo(0, yy+2, -w, yy+5); x.fill(); }
  x.restore();
}
function brushStrokes(x, R, n, y0, y1, dark, light, len){
  for (let i=0;i<n;i++){
    const px = R()*VW, py = y0 + R()*(y1-y0), l = len*(.4+R()), th = .6 + R()*1.8, dk = R() < .55;
    x.strokeStyle = dk ? dark.replace('A', (.04 + R()*.1).toFixed(3)) : light.replace('A', (.05 + R()*.1).toFixed(3));
    x.lineWidth = th; x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px + l*.5, py + (R()-.5)*3, px + l, py + (R()-.5)*2); x.stroke();
  }
}
function drawWall(x, left, h, tod){
  const w = 168, X0 = left ? -14 : VW - w + 14, baseY = GY0 + 34, top = baseY - h;
  const stone = mix(tod.near, '#c9b894', .42), dk = mix(stone, '#000000', .45);
  x.save();
  // 성벽 몸체
  let g = x.createLinearGradient(0, top, 0, baseY); g.addColorStop(0, mix(stone,'#ffffff',.18)); g.addColorStop(1, mix(stone,'#000000',.25));
  x.fillStyle = g; x.strokeStyle = INK; x.lineWidth = 2;
  x.beginPath(); x.rect(X0, top, w, h); x.fill(); x.stroke();
  // 성가퀴
  const tw = 14, n = Math.floor(w/ (tw*1.6));
  for (let i=0;i<n;i++){ const cx = X0 + 6 + i*tw*1.6; x.fillStyle = mix(stone,'#ffffff',.1); x.beginPath(); x.rect(cx, top-9, tw, 9); x.fill(); x.stroke(); }
  // 벽돌 줄눈
  x.strokeStyle = 'rgba(30,20,12,.28)'; x.lineWidth = 1;
  for (let yy=top+10; yy<baseY; yy+=11){ x.beginPath(); x.moveTo(X0, yy); x.lineTo(X0+w, yy); x.stroke(); for (let xx=X0 + ((yy/11|0)%2?10:0); xx<X0+w; xx+=20){ x.beginPath(); x.moveTo(xx, yy); x.lineTo(xx, yy+11); x.stroke(); } }
  // 성문 (안쪽 끝)
  const gx = left ? X0 + w - 62 : X0 + 14, gw = 48, gh = Math.min(48, h*.62);

  x.strokeStyle = '#7a5a2a'; x.lineWidth = 1.5; for (let i=1;i<4;i++){ x.beginPath(); x.moveTo(gx+gw*i/4, baseY-gh+10); x.lineTo(gx+gw*i/4, baseY); x.stroke(); }

  x.fillStyle = mix(stone,'#7a2a1a',.35); x.strokeStyle = INK; x.beginPath(); x.rect(tx-30, ty-34, 60, 34); x.fill(); x.stroke();
  x.fillStyle = '#2a1a10'; x.fillRect(tx-5, ty-26, 10, 14);

  x.fillStyle = mix(stone,'#7a2a1a',.35); x.beginPath(); x.rect(tx-18, ty-62, 36, 24); x.fill(); x.stroke();

  // 깃대
  x.strokeStyle = INK; x.lineWidth = 2; x.beginPath(); x.moveTo(tx, ty-82); x.lineTo(tx, ty-108); x.stroke();

}
function inkBg(A){
  const key = [A.terr, A.castle||'-', A.castle ? Math.round((A.wall||0)/10) : 0, A.kind, todOf(A)===TOD.night?'n':todOf(A)===TOD.dusk?'u':todOf(A)===TOD.dawn?'a':'d', A.seed].join('|');

  // 먹 번진 구름

  ridge(x, R, HZ-22, 26*big, 44, tod.mid2, tod.fog, .5, HZ+60);

    for (let i=0;i<38;i++){ const px = R()*VW, py = y0+4+R()*(y1-y0-8), l = 14 + R()*34; x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px+l/2, py-1.5, px+l, py); x.stroke(); }
    x.strokeStyle = INK; x.lineWidth = 1.5; x.globalAlpha = .5; x.beginPath(); x.moveTo(0, y1+3); for (let px=0; px<=VW; px+=32) x.lineTo(px, y1 + Math.sin(px/48+1)*3 + 2); x.stroke(); x.globalAlpha = 1;
    for (let i=0;i<26;i++){ const px = R()*VW, py = y1 + 2 + R()*4; x.strokeStyle = mix(tod.near, '#3a4a30', .5); x.lineWidth = 1.3; x.beginPath(); x.moveTo(px, py); x.quadraticCurveTo(px+2, py-8, px+4+R()*4, py-14-R()*8); x.stroke(); }
  }

  g = x.createLinearGradient(0, HZ-14, 0, HZ+54); g.addColorStop(0, rgba(tod.fog,0)); g.addColorStop(.35, rgba(tod.fog, tod.moon ? .2 : .5)); g.addColorStop(1, rgba(tod.fog,0));

  if (terr==='mountain'){
    for (let side=0; side<2; side++) for (let i=0;i<5;i++){
