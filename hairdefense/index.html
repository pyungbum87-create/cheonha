<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#201a36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="마지막 7가닥을 지켜라! 새·바람·야근 서류로부터 머리카락을 지키며 중국어·한국어·영어 단어까지 배우는 코믹 디펜스 게임.">
<meta property="og:title" content="머리카락 사수 대작전 · 头发保卫战">
<meta property="og:description" content="마지막 7가닥을 지켜라! 너는 몇 가닥 남길 수 있어?">
<meta property="og:image" content="assets/og.jpg">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<title>머리카락 사수 대작전 | 头发保卫战</title>
<link rel="stylesheet" href="style.css?v=1114-2220">
</head>
<body>
<div id="app"><div id="gameWrap">
<canvas id="game" aria-label="머리카락을 지키는 터치 게임"></canvas>

<div class="hud" id="hud">
 <div class="pill">💈 <span data-i="hair">머리카락</span><b id="hairCount">7 / 7</b></div>
 <div class="pill">⏱️ <span data-i="time">남은 시간</span><b id="timeCount">75</b></div>
 <div class="pill mini">⭐ <span data-i="score">점수</span><b id="scoreCount">0</b></div>
 <button id="soundBtn" aria-label="소리">🔊</button>
 <button id="pauseBtn" aria-label="일시정지">Ⅱ</button>
</div>
<div id="toast"></div>
<div id="reaction" class="reaction hidden" aria-live="polite"><img id="reactionArt" alt=""><div class="reactionWords"><b id="reactionTitle"></b><span id="reactionSub"></span></div></div>
<div id="heroBanner" class="heroBanner" aria-live="polite"></div>
<div class="bottomBar" id="bottomBar"><button id="quizBtn" class="ability">📚 <span data-i="quiz">언어 반격</span> <span id="energyCount">0/2</span></button><div class="hint" id="hint"></div></div>
<button id="helpBtn" aria-label="도움말">?</button>

<!-- 로딩 -->
<div class="screen" id="loadingScreen"><div class="loadBox">
 <div class="loadLogo">💈</div>
 <div class="loadTitle">머리카락 사수 대작전<br><small>头发保卫战</small></div>
 <div class="loadTrack"><div class="loadBar" id="loadBar"></div></div>
 <div class="loadText" id="loadText">0%</div>
</div></div>

<!-- 시작 -->
<div class="screen hidden" id="startScreen"><div class="panel startPanel">
 <div class="topRow">
  <div class="coinPill">🪙 <b id="coinCount">0</b></div>
  <div class="topBtns">
   <button class="miniBtn" id="rewardBtn" type="button"><span id="rewardLabel">🎁 매일 보상</span><i id="rewardDot" class="redDot hidden"></i></button>
   <button class="iconBtn" id="settingsBtn" type="button" aria-label="설정">⚙️</button>
  </div>
 </div>
 <div class="title" id="startTitle">💈 머리카락 사수 대작전!</div>
 <div class="subtitle" id="startSub">头发保卫战 · Last Hair Standing</div>
 <div class="heroStage" id="heroStage">
  <button class="heroArrow" id="heroPrev" type="button" aria-label="이전">‹</button>
  <img id="heroPreviewImage" src="assets/hero_boss.webp?v=1114-2220" alt="">
  <div class="heroInfo"><b id="heroName"></b><span id="heroSkill"></span><span id="heroLv" class="heroLv"></span></div>
  <button class="heroArrow right" id="heroNext" type="button" aria-label="다음">›</button>
 </div>
 <div id="avatarRow" class="avatarRow"></div>
 <div class="formRow">
  <div class="field"><label id="ageLabel">난이도</label><select id="ageSelect"><option value="0">🌱 입문</option><option value="1" selected>🎒 초급</option><option value="2">📗 중급</option><option value="3">📘 고급</option><option value="4">🎓 전문</option><option value="5">🏆 도전</option></select></div>
  <div class="field"><label id="studyLabel">학습 언어</label><select id="studySelect"><option value="mix">🌐 中·한·EN</option><option value="zh">中文</option><option value="ko">한국어</option><option value="en">English</option></select></div>
 </div>
 <div class="levelDesc" id="levelDesc"></div>
 <button class="boostBtn" id="boostBtn" type="button"></button>
 <button class="cta big" id="startBtn">▶ 게임 시작!</button>
 <div id="collection" class="collectLine"></div>
 <div id="healthNote" class="health hidden"></div>
</div></div>

<!-- 설정 -->
<div class="screen hidden" id="settingsScreen"><div class="panel">
 <div class="title" id="setTitle">⚙️ 설정</div>
 <div class="setList">
  <label class="setRow"><span id="setMusic">🎵 배경음악</span><input type="checkbox" id="optMusic"><i class="sw"></i></label>
  <label class="setRow"><span id="setSfx">🔔 효과음</span><input type="checkbox" id="optSfx"><i class="sw"></i></label>
  <label class="setRow"><span id="setVoice">🗣️ 발음 듣기</span><input type="checkbox" id="voiceEnabled"><i class="sw"></i></label>
  <label class="setRow"><span id="setVib">📳 진동</span><input type="checkbox" id="optVib"><i class="sw"></i></label>
  <div class="setRow"><span id="uiLabel">🌐 언어</span><select id="uiSelect"><option value="ko">한국어</option><option value="zh">简体中文</option><option value="en">English</option></select></div>
  <div class="voiceInfo" id="voiceInfo"></div>
  <button class="voiceBtn" id="voiceTest" type="button"></button>
 </div>
 <button class="linkBtn" id="privacyBtn" type="button"></button>
 <button class="linkBtn danger" id="resetBtn" type="button"></button>
 <button class="cta" id="settingsClose" type="button"></button>
</div></div>

<div class="screen hidden" id="quizScreen"><div class="panel quizPanel"><div id="quizStamp" class="stamp hidden"></div><div class="title" id="quizTitle">언어 반격!</div><div class="subtitle" id="quizType"></div><div class="qTime hidden" id="qTime"><i id="qTimeBar"></i></div><div class="quizPrompt" id="quizPrompt"></div><div class="voiceTools"><button class="voiceBtn" id="hearPrompt" type="button">🔊 듣기</button><button class="voiceBtn" id="hearSlow" type="button">🐢 천천히</button></div><div class="voiceNote" id="voiceNote" aria-live="polite"></div><div class="voiceTools hidden" id="reviewVoices"><button class="voiceBtn" data-voice="zh" type="button">中文 🔊</button><button class="voiceBtn" data-voice="ko" type="button">한국어 🔊</button><button class="voiceBtn" data-voice="en" type="button">English 🔊</button></div><div class="quizOptions" id="quizOptions"></div><div class="qReview hidden" id="quizReview"></div><button class="voiceBtn" id="hintBtn" type="button"></button><div class="small" id="quizFeedback"></div><button class="cta secondary" id="skipQuiz">↩</button></div></div>
<div class="screen hidden" id="pauseScreen"><div class="panel"><div style="font-size:52px">⏸️</div><div class="title" id="pauseTitle">일시정지</div><button class="cta" id="resumeBtn">▶</button><button class="cta secondary" id="pauseSettings" type="button">⚙️</button><button class="cta secondary" id="quitBtn">🏠</button></div></div>
<div class="screen hidden" id="helpScreen"><div class="panel"><div class="title" id="helpTitle"></div><p style="line-height:1.9;text-align:left" id="helpText"></p><button class="cta" id="closeHelp"></button></div></div>
<div class="screen hidden" id="resultScreen"><div class="panel"><div class="brand" id="resultTop"></div><img id="resultHero" class="resultHero" alt=""><div class="resultEmoji" id="resultEmoji"></div><div class="ranking" id="ranking"></div><div class="subtitle" id="rankingZh"></div><div class="stat" id="resultStats"></div><div class="small" id="recordText"></div><div id="resultAchievement" class="achievement"></div><div class="coinGain" id="coinGain"></div><button class="cta ad" id="doubleBtn" type="button"></button><button class="cta" id="retryBtn"></button><div class="btnRow"><button class="cta secondary" id="shareBtn" type="button"></button><button class="cta secondary" id="homeBtn"></button></div><div id="resultProgress" class="collectLine"></div><div class="banner" id="resultTip"></div></div></div>
<div class="screen hidden" id="reviveScreen"><div class="panel"><div style="font-size:52px">🥹</div><div class="title" id="reviveTitle"></div><div class="subtitle" id="reviveSub"></div><button class="cta ad" id="reviveAdBtn" type="button"></button><button class="cta secondary" id="reviveSkipBtn" type="button"></button></div></div>
<div class="screen hidden" id="rewardScreen"><div class="panel"><div class="title" id="rewardTitle"></div><div class="coinPill" style="display:inline-block">🪙 <b id="coinCount2">0</b></div><div id="rewardBody"></div><button class="cta secondary" id="rewardClose" type="button"></button></div></div>
<div class="screen hidden" id="privacyScreen"><div class="panel"><div class="title" id="privacyTitle"></div><div class="privacyText" id="privacyText"></div><button class="cta" id="privacyClose" type="button"></button></div></div>
<div id="adLayer" class="adLayer hidden"><div class="adBox"><div class="brand" style="color:#aaa">TEST AD</div><div id="adTitle" style="font-weight:900;margin:8px 0"></div><div id="adCount">2</div><div class="small" id="adNote" style="color:#bbb"></div></div></div>
<div class="footer" id="version">HAIR DEFENSE</div>
</div></div>
<script src="words.js?v=1114-2220"></script>
<script src="game.js?v=1114-2220"></script>
</body>
</html>
