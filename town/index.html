<title>团团小镇闹哄哄</title>
<style>html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one phone screen. Goal and countdown on top, the scene as a framed stage, friends in a tray, the shutter as the single big action. */
:root{--paper:#fbefdc;--ink:#5b3520;--soft:#8a6448;--red:#d8473a;--redd:#a8332a;--gold:#f2b52c;--goldd:#bd8a1a;--cream:#fff8ec;--line:#e7cfa9;--tray:#f3dcb8;
 --zh:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;--body:"PingFang SC","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
html,body{height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{background:var(--paper);color:var(--ink);font-family:var(--body)}
.screen{height:100%;display:flex;flex-direction:column;gap:7px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;align-items:center}
#hud{width:100%;max-width:440px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1px 8px}
.mini{border:0;border-radius:10px;background:var(--tray);color:var(--ink);font:400 14px/1 var(--zh);padding:7px 9px;cursor:pointer}
#goal{font:400 21px/1.1 var(--zh);color:var(--red);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#prog{font:400 15px/1.2 var(--zh);text-align:right}
#timer{grid-column:2/3;font:400 14px/1.2 var(--zh);font-variant-numeric:tabular-nums}
#timer.low{color:var(--red)}
#hintBtn{grid-row:2;grid-column:3}
#wrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-start}
#cv{display:block;touch-action:none;max-width:100%}
#foot{width:100%;max-width:440px;display:flex;gap:8px}
#shoot{flex:1;border:0;border-radius:18px;padding:11px 8px 10px;background:var(--red);color:#fff;font:400 22px/1 var(--zh);box-shadow:0 5px 0 var(--redd);cursor:pointer}
#shoot small{display:block;font:500 11px/1.3 var(--body);margin-top:3px;opacity:.92}
#shoot:active{transform:translateY(3px);box-shadow:0 2px 0 var(--redd)}
#comp{border:0;border-radius:18px;width:78px;background:var(--gold);color:var(--ink);font:400 17px/1.1 var(--zh);box-shadow:0 5px 0 var(--goldd);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.over{position:fixed;inset:0;background:rgba(70,38,20,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5;box-sizing:border-box}
#polaroid{background:var(--cream);padding:10px 10px 12px;border-radius:6px;box-shadow:0 10px 26px rgba(0,0,0,.35);transform:rotate(-1.6deg);width:min(82vw,320px);max-width:100%;box-sizing:border-box}
#polaroid canvas{width:100%;height:auto;border-radius:3px;display:block}
#pTitle{font:400 20px/1.2 var(--zh);text-align:center;margin-top:8px;color:var(--ink);text-wrap:balance}
#pKo{font-size:12px;text-align:center;margin-top:3px;color:var(--soft)}
#pTag{font-size:12px;color:var(--cream);text-align:center;min-height:16px}
.row{display:flex;gap:8px;width:min(86vw,340px)}
.row button{flex:1;border:0;border-radius:14px;padding:11px 4px;font:400 16px/1 var(--zh);background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--goldd);cursor:pointer}
.row button.alt{background:var(--cream);box-shadow:0 4px 0 var(--line)}
#pv{background:rgba(70,38,20,.45);z-index:4}
#pvBox{background:var(--cream);padding:8px 8px 10px;border-radius:6px;width:min(70vw,280px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
#pvBig{width:100%;height:auto;display:block}
#pvCap{font:400 18px/1.2 var(--zh);text-align:center;margin-top:8px}
#pvKo{font-size:11px;text-align:center;color:var(--soft);margin-top:2px}
.box{background:var(--cream);border-radius:14px;padding:13px;width:min(92vw,400px);max-height:76%;overflow:auto;box-sizing:border-box;touch-action:pan-y}
.box h2{font:400 21px/1.1 var(--zh);margin:0 0 3px;color:var(--red)}
.box p{margin:0 0 8px;font-size:12px;color:var(--soft)}
#albumList{display:grid;gap:5px}
.al{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 8px;border-radius:8px;background:var(--paper);font:400 15px/1.25 var(--zh);text-wrap:balance}
.al span{font:500 11px var(--body);color:var(--soft);align-self:center}
#wall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#wall div{background:var(--paper);border-radius:4px;padding:3px;font:400 11px/1.1 var(--zh);text-align:center;overflow:hidden}
#wall canvas{width:100%;height:auto;display:block;border-radius:2px;margin-bottom:2px}
#home{gap:8px}
#homeHead{width:100%;max-width:440px}
#homeHead h1{margin:0;font:400 27px/1.1 var(--zh);color:var(--red)}
#homeHead p{margin:2px 0 0;font-size:12px;color:var(--soft)}
#list{flex:1;min-height:0;width:100%;max-width:440px;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;align-content:start;touch-action:pan-y;padding-bottom:6px}
.lv{border:0;background:var(--cream);border-radius:10px;padding:5px 5px 7px;text-align:left;color:var(--ink);cursor:pointer;box-shadow:0 2px 0 var(--line);min-width:0}
.lv i{display:block;aspect-ratio:1/.62;background-size:cover;background-position:center;border-radius:6px}
.lv b{display:block;font:400 15px/1.2 var(--zh);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv span{display:block;font-size:11px;color:var(--soft);margin-top:1px}
.lv.lock{filter:grayscale(.8);opacity:.6}
#homeBar{width:100%;max-width:440px;display:grid;grid-template-columns:1fr 92px;gap:8px}
#homeBar button{border:0;border-radius:14px;padding:12px;font:400 18px/1 var(--zh);background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--goldd);cursor:pointer}
@media (prefers-reduced-motion:reduce){#polaroid{transform:none}}
</style>

<div id="album" class="over" hidden><div class="box"><h2 id="albumHead">相册</h2><p id="albumSub"></p><div id="albumList"></div></div><div class="row"><button id="albumBack" type="button">返回</button></div></div>
