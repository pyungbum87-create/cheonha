<body>

<style>
/* Layout: one phone screen. Goal and countdown on top, the scene as a framed stage, friends in a tray, the shutter as the single big action. */
:root{--paper:#fbefdc;--ink:#5b3520;--soft:#8a6448;--red:#d8473a;--redd:#a8332a;--gold:#f2b52c;--goldd:#bd8a1a;--cream:#fff8ec;--line:#e7cfa9;--tray:#f3dcb8;
 --zh:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;--body:"PingFang SC","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
html,body{height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{color:var(--ink);font-family:var(--body);background-color:var(--paper);background-image:radial-gradient(circle at 18px 18px,rgba(216,71,58,.055) 0 7px,transparent 8px),radial-gradient(circle at 54px 54px,rgba(242,181,44,.07) 0 5px,transparent 6px);background-size:72px 72px}
.screen{height:100%;display:flex;flex-direction:column;gap:7px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;align-items:center}
#hud{width:100%;max-width:440px;display:grid;grid-template-columns:40px 1fr 54px;align-items:center;gap:8px}
.mini{border:0;border-radius:13px;background:var(--cream);color:var(--ink);font:400 14px/1 var(--zh);height:42px;box-shadow:0 3px 0 var(--line);cursor:pointer;position:relative}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#back{font-size:24px;line-height:38px}
#ribbon{min-width:0;background:linear-gradient(#e2574a,#c93c30);color:#fff;border-radius:13px;padding:5px 12px 6px;box-shadow:0 3px 0 var(--redd),inset 0 1px 0 rgba(255,255,255,.28);display:grid;grid-template-columns:1fr auto;gap:0 8px;align-items:center}
#goal{font:400 18px/1.15 var(--zh);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#pips{display:flex;gap:2px;grid-row:1/3;grid-column:2}
#pips i{width:8px;height:12px;border-radius:50%/44%;background:rgba(255,255,255,.26);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);transition:background .25s,transform .25s}
#pips i.on{background:#ffd76a;box-shadow:0 0 6px #ffd76a;transform:scale(1.12)}
#timer{font:400 13px/1.2 var(--zh);font-variant-numeric:tabular-nums;opacity:.95}
#timer.low{color:#ffe29a}
#prog{display:none}
#hintBtn em{position:absolute;top:-5px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--ink);font:400 12px/18px var(--zh);box-shadow:0 1px 0 var(--goldd)}
#hintBtn.none{opacity:.5}
#wrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-start}
#cv{display:block;touch-action:none;max-width:100%}
#foot{width:100%;max-width:440px;display:flex;gap:8px}
#shoot{flex:1;border:0;border-radius:20px;padding:10px 8px 9px;background:linear-gradient(#e85c4e,#cf3f33);color:#fff;font:400 22px/1 var(--zh);box-shadow:0 6px 0 var(--redd),inset 0 1px 0 rgba(255,255,255,.3);cursor:pointer;display:grid;grid-template-columns:auto auto;justify-content:center;align-items:center;gap:0 9px}
#shoot svg{grid-row:1/3;width:34px;height:30px}
#shoot small{display:block;font:500 10.5px/1.3 var(--body);margin-top:3px;opacity:.92}
#shoot:active{transform:translateY(4px);box-shadow:0 2px 0 var(--redd)}
#plus{border:0;border-radius:18px;width:66px;background:var(--cream);color:var(--ink);font:400 16px/1.1 var(--zh);box-shadow:0 5px 0 var(--line);cursor:pointer}
#plus small{display:block;font:500 10px/1.2 var(--body);color:var(--soft)}
#offer{width:min(86vw,340px);background:rgba(255,248,236,.96);border-radius:12px;padding:8px}
#offer p{margin:0 0 7px;font:400 14px/1.3 var(--zh);text-align:center;text-wrap:balance}
#offer .row{width:100%}
#offer button{font-size:14px;padding:9px 3px}
#items{width:100%;max-width:440px;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
#items button{position:relative;border:0;border-radius:12px;background:var(--cream);box-shadow:0 3px 0 var(--line);height:46px;display:grid;grid-template-columns:34px 1fr;align-items:center;padding:0 5px;cursor:pointer;color:var(--ink);font:400 13px/1 var(--zh)}
#items button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
#items img{width:32px;height:32px;object-fit:contain}
#items em{position:absolute;top:-5px;right:-3px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font:400 12px/19px var(--zh);font-style:normal}
#items button.off{filter:grayscale(.85);opacity:.55}
#intro{z-index:9;background:rgba(70,38,20,.88)}
#inBox{width:min(88vw,350px);background:var(--cream);border-radius:16px;padding:14px;box-sizing:border-box;text-align:center;box-shadow:0 0 0 3px var(--gold)}
#inPic{height:150px;display:flex;justify-content:center;align-items:flex-end;gap:2px;margin-bottom:8px}
#inPic img{min-width:0;height:auto;max-height:138px;flex:0 1 auto;width:30%;object-fit:contain;animation:bob 2.6s ease-in-out infinite}
#inPic img:nth-child(even){animation-delay:.5s}
#inT{font:400 24px/1.15 var(--zh);margin:0;color:var(--red)}
#inZh{font:400 16px/1.4 var(--zh);margin:7px 0 3px}
#inKo{font-size:12px;line-height:1.45;color:var(--soft);margin:0 0 8px}
#inDots{display:flex;gap:6px;justify-content:center;margin-bottom:9px}
#inDots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
#inDots i.on{background:var(--red)}
#adAsk,#adMock{z-index:8}
#askYes::before,#offerAd::before{content:'';display:inline-block;width:0;height:0;border-left:11px solid var(--red);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-right:6px;vertical-align:-1px}
#comp{border:0;border-radius:18px;width:78px;background:var(--gold);color:var(--ink);font:400 17px/1.1 var(--zh);box-shadow:0 5px 0 var(--goldd);cursor:pointer}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.over{position:fixed;inset:0;background:rgba(70,38,20,.72);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5;box-sizing:border-box}
#polaroid{position:relative;animation:drop .55s cubic-bezier(.2,1.3,.4,1) both;background:var(--cream);padding:10px 10px 12px;border-radius:6px;box-shadow:0 10px 26px rgba(0,0,0,.35);transform:rotate(-1.6deg);width:min(82vw,320px);max-width:100%;box-sizing:border-box}
#polaroid canvas{width:100%;height:auto;border-radius:3px;display:block}
@keyframes drop{from{opacity:0;transform:translateY(-70px) rotate(5deg) scale(.9)}to{opacity:1;transform:rotate(-1.6deg)}}
@keyframes press{0%{opacity:0;transform:rotate(-14deg) scale(1.9)}70%{opacity:1;transform:rotate(-14deg) scale(.94)}100%{opacity:1;transform:rotate(-14deg) scale(1)}}
@keyframes cardIn{0%{opacity:0;transform:scale(.8)}18%{opacity:1;transform:scale(1.04)}26%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#stamp{position:absolute;right:6px;top:6px;width:72px;height:72px;border-radius:50%;border:3px solid var(--red);color:var(--red);background:rgba(255,248,236,.86);display:grid;place-content:center;text-align:center;font:400 15px/1.12 var(--zh);animation:press .4s .45s both}
#stamp b{font:400 20px/1 var(--zh)}
#card{position:fixed;inset:0;display:grid;place-content:center;pointer-events:none;z-index:3}
#cardIn{background:var(--cream);border-radius:16px;padding:16px 30px 15px;text-align:center;box-shadow:0 8px 0 var(--line),0 14px 30px rgba(90,50,20,.25);animation:cardIn 1.5s both}
#cardIn span{display:block;font:400 15px/1 var(--zh);color:var(--soft)}
#cardIn b{display:block;font:400 28px/1.2 var(--zh);color:var(--red);margin-top:5px}
#cardIn small{display:block;font-size:12px;color:var(--soft);margin-top:3px}
#polaroid{overflow:hidden}
#polaroid.t0{background:#ece4d6}
#polaroid.t2{background:#fff3d6}
#polaroid.t3{background:linear-gradient(135deg,#ffe9a6,#f7c64a 45%,#fff0b8);box-shadow:0 0 0 3px #f2b52c,0 0 34px rgba(255,214,90,.75)}
#shine{position:absolute;inset:0;pointer-events:none;display:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);animation:shine 1.3s .55s 2 both}
#polaroid.t3 #shine{display:block}
@keyframes shine{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
#pAfter{width:min(86vw,340px);background:rgba(255,248,236,.96);border-radius:12px;padding:8px 10px;text-align:center;font:400 15px/1.3 var(--zh);box-sizing:border-box}
#reStory{margin-top:6px;border:0;border-radius:10px;background:var(--gold);color:var(--ink);font:400 14px/1 var(--zh);padding:8px 14px;box-shadow:0 2px 0 var(--goldd);cursor:pointer}
#pAfter small{display:block;font:500 11px/1.3 var(--body);color:var(--soft);margin-top:2px}
#pAfter b{display:block;font:400 13px/1.2 var(--zh);color:var(--red);margin-bottom:2px}
.conf{position:fixed;top:-14px;width:9px;height:14px;z-index:6;pointer-events:none;animation:fall 1.8s linear both}
@keyframes fall{to{transform:translateY(106vh) rotate(540deg)}}
#story{z-index:7;background:rgba(70,38,20,.86)}
#stBox{width:min(88vw,350px);background:var(--cream);border-radius:14px;padding:9px;box-sizing:border-box;box-shadow:0 0 0 3px var(--gold)}
#stC{width:100%;height:auto;display:block;border-radius:9px}
#stTalk{min-height:92px;padding:8px 5px 2px;animation:fadeLine .25s both}
@keyframes fadeLine{from{opacity:0;transform:translateY(5px)}}
#stWho{display:inline-block;background:var(--red);color:#fff;border-radius:9px;padding:2px 9px;font:400 13px/1.3 var(--zh)}
#stZh{margin:5px 0 2px;font:400 19px/1.3 var(--zh)}
#stKo{display:block;font-size:12px;color:var(--soft)}
#stNav{display:grid;grid-template-columns:1fr 70px 96px;gap:7px;align-items:center}
#stStep{font:400 13px var(--zh);color:var(--soft)}
#stNav button{border:0;border-radius:11px;padding:9px 4px;font:400 15px/1 var(--zh);cursor:pointer;background:var(--paper);color:var(--ink)}
#stNext{background:var(--gold)!important;box-shadow:0 3px 0 var(--goldd)}
#diary div{cursor:pointer}
#diary .off{cursor:default}
#diary{display:grid;gap:5px}
#diary div{background:var(--paper);border-radius:8px;padding:6px 8px;font:400 14px/1.3 var(--zh)}
#diary small{display:block;font:500 11px/1.3 var(--body);color:var(--soft)}
#diary .off{color:#bda98c}
.lv.gold{box-shadow:0 0 0 2px var(--gold),0 3px 0 var(--goldd)}
.lv mark{background:none;color:var(--gold);letter-spacing:1px}
.lv b.dim{display:inline;margin:0;font:inherit;color:var(--line);letter-spacing:1px}
#pTitle{font:400 20px/1.2 var(--zh);text-align:center;margin-top:8px;color:var(--ink);text-wrap:balance}
#pKo{font-size:12px;text-align:center;margin-top:3px;color:var(--soft)}
#pTag{font-size:12px;color:var(--cream);text-align:center;min-height:16px}
.row{display:flex;gap:8px;width:min(86vw,340px)}
.row button{flex:1;border:0;border-radius:14px;padding:12px 4px;font:400 16px/1 var(--zh);background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--goldd);cursor:pointer}
.row button.alt{background:var(--cream);box-shadow:0 4px 0 var(--line)}
.row button.main{flex:1.6;font-size:19px}
.row button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--goldd)}
#pv{background:rgba(70,38,20,.45);z-index:4}
#pvBox{background:var(--cream);padding:8px 8px 10px;border-radius:6px;width:min(70vw,280px);box-shadow:0 8px 20px rgba(0,0,0,.3)}
#pvBig{width:100%;height:auto;display:block}
#pvCap{font:400 18px/1.2 var(--zh);text-align:center;margin-top:8px}
#pvKo{font-size:11px;text-align:center;color:var(--soft);margin-top:2px}
.box{background:var(--cream);border-radius:14px;padding:13px;width:min(92vw,400px);max-height:76%;overflow:auto;box-sizing:border-box;touch-action:pan-y}
.box h2{font:400 21px/1.1 var(--zh);margin:0 0 3px;color:var(--red)}
.box p{margin:0 0 8px;font-size:12px;color:var(--soft)}
#albumList{display:grid;gap:5px}
.al{display:grid;grid-template-columns:1fr auto;gap:8px;padding:6px 8px;border-radius:8px;background:var(--paper);font:400 15px/1.25 var(--zh);text-wrap:balance}
.al span{font:500 11px var(--body);color:var(--soft);align-self:center}
#wall{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#wall div{background:var(--paper);border-radius:4px;padding:3px;font:400 11px/1.1 var(--zh);text-align:center;overflow:hidden}
#wall canvas{width:100%;height:auto;display:block;border-radius:2px;margin-bottom:2px}
#home{gap:8px}
#homeHead{width:100%;max-width:440px;display:grid;grid-template-columns:62px 1fr;gap:9px;align-items:center}
#homeHead img{width:62px;height:auto;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
#homeHead h1{margin:0;font:400 27px/1.1 var(--zh);color:var(--red)}
#homeHead p{margin:3px 0 0;font-size:12px;color:var(--soft)}
#list{flex:1;min-height:0;width:100%;max-width:440px;overflow:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start;touch-action:pan-y;padding:2px 2px 8px;box-sizing:border-box}
.lv{position:relative;border:0;background:var(--cream);border-radius:13px;padding:5px 5px 8px;text-align:left;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--line);min-width:0}
.lv:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.lv i{display:block;aspect-ratio:1/.6;background-size:cover;background-position:center;border-radius:9px}
.lv em{position:absolute;left:0;top:0;min-width:28px;height:28px;border-radius:50%;background:linear-gradient(#e2574a,#c93c30);color:#fff;font:400 15px/28px var(--zh);text-align:center;box-shadow:0 2px 0 var(--redd)}
.lv b{display:block;font:400 15px/1.2 var(--zh);margin:5px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv span{display:block;font-size:11px;color:var(--soft);margin:1px 3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv u{display:block;height:5px;border-radius:3px;background:var(--line);margin:5px 3px 0;overflow:hidden;text-decoration:none}
.lv u s{display:block;height:100%;background:var(--gold);border-radius:3px}
.lv.lock{filter:grayscale(.8);opacity:.6}
#homeBar{width:100%;max-width:440px;display:grid;grid-template-columns:1fr 70px 88px;gap:7px}
#homeBar button{border:0;border-radius:14px;padding:12px;font:400 18px/1 var(--zh);background:var(--gold);color:var(--ink);box-shadow:0 4px 0 var(--goldd);cursor:pointer}
@media (prefers-reduced-motion:reduce){#polaroid{transform:none}}
</style>
