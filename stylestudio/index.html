<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f1ff">
<title>변신 스튜디오 · 스타일 체크 프로토타입</title>
<style>
  :root{
    --bg:#f6f1ff; --card:#ffffff; --ink:#26213a; --sub:#6e6886; --line:#e6def7;
    --accent:#6c4cf1; --accent2:#ff7aa8; --ok:#18a36b; --gold:#ffb703;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .hidden{display:none!important}

  /* ---------- 시작 화면 ---------- */
  #start{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:32px 22px calc(32px + env(safe-area-inset-bottom));text-align:center;gap:18px}
  .logo{font-size:64px;line-height:1}
  h1{margin:0;font-size:30px;letter-spacing:-.5px}
  h1 span{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{margin:0;color:var(--sub);font-size:15px;line-height:1.6}
  .bigbtn{width:100%;max-width:340px;padding:17px 18px;border-radius:18px;font-size:17px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 18px rgba(108,76,241,.18)}
  .bigbtn.primary{background:linear-gradient(135deg,var(--accent),#8f6bff);color:#fff}
  .bigbtn.secondary{background:#fff;border:2px solid var(--line)}
  .privacy{font-size:13px;color:var(--sub);background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 14px;max-width:340px;line-height:1.5}
  #modelStatus{font-size:12.5px;color:var(--sub);min-height:18px}
  .stars{font-size:14px;font-weight:700;color:#b07800;background:#fff6d9;border-radius:99px;padding:6px 12px}

  /* ---------- 편집 화면 ---------- */
  #editor{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 6px}
  .topbar .t{font-weight:800;font-size:17px}
  .iconbtn{padding:8px 12px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:600}

  .mission{margin:4px 14px 8px;background:#fff;border-radius:16px;border:1px solid var(--line);padding:10px 12px}
  .mission .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .mission .mt{font-weight:800;font-size:15px}
  .mission .re{font-size:12.5px;color:var(--accent);font-weight:700;padding:4px 8px;border-radius:8px;background:#f1ecff}
  .conds{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .cond{font-size:12.5px;padding:5px 9px;border-radius:99px;background:#f4f2f8;color:var(--sub);transition:.2s}
  .cond.on{background:#e3f7ee;color:var(--ok);font-weight:700}
  .cond.on::before{content:"✓ "}

  .stage{position:relative;flex:1;min-height:0;margin:0 14px;border-radius:20px;overflow:hidden;background:#ece6fb;
    display:flex;align-items:center;justify-content:center}
  .stage canvas{max-width:100%;max-height:100%;display:block}
  #origCanvas{position:absolute;inset:0;margin:auto}
  .badge{position:absolute;left:10px;top:10px;font-size:12px;font-weight:700;background:rgba(38,33,58,.72);color:#fff;padding:5px 9px;border-radius:99px}
  #busy{position:absolute;inset:0;background:rgba(246,241,255,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font-weight:700;text-align:center;padding:20px}
  .spin{width:38px;height:38px;border-radius:50%;border:4px solid #d9cffa;border-top-color:var(--accent);animation:sp 0.9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .actions{display:flex;gap:8px;padding:10px 14px 6px}
  .actions button{flex:1;padding:11px 6px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;user-select:none;-webkit-user-select:none;touch-action:none}
  .actions .save{background:linear-gradient(135deg,var(--accent2),#ff9a7a);color:#fff;border:0}

  .panel{background:#fff;border-top-left-radius:22px;border-top-right-radius:22px;padding:10px 0 calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(60,40,120,.07)}
  .tabs{display:flex;gap:4px;padding:0 12px 8px}
  .tab{flex:1;padding:9px 4px;border-radius:12px;font-weight:700;font-size:14px;color:var(--sub)}
  .tab.on{background:#f1ecff;color:var(--accent)}
  .opts{display:flex;gap:10px;overflow-x:auto;padding:4px 14px 6px;scrollbar-width:none}
  .opts::-webkit-scrollbar{display:none}
  .opt{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;width:66px}
  .opt .sw{width:50px;height:50px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;background:#f6f4fb}
  .opt.on .sw{box-shadow:0 0 0 3px var(--accent)}
  .opt span{font-size:11.5px;color:var(--sub);text-align:center;line-height:1.25;word-break:keep-all}
  .opt.on span{color:var(--ink);font-weight:700}
  .slider{display:flex;align-items:center;gap:10px;padding:6px 18px 0;font-size:12.5px;color:var(--sub)}
  .slider input{flex:1;accent-color:var(--accent)}
  .note{font-size:12.5px;color:var(--sub);padding:8px 18px 2px;line-height:1.5}

  /* ---------- 토스트 / 모달 ---------- */
  #toast{position:fixed;left:50%;top:18%;transform:translate(-50%,-10px);opacity:0;pointer-events:none;
    background:#26213a;color:#fff;padding:12px 18px;border-radius:16px;font-weight:800;font-size:16px;transition:.3s;z-index:20;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  #modal{position:fixed;inset:0;background:rgba(20,16,35,.7);display:flex;align-items:center;justify-content:center;z-index:30;padding:18px}
  .mbox{background:#fff;border-radius:22px;padding:14px;max-width:440px;width:100%;max-height:92vh;overflow:auto;text-align:center}
  .mbox img{width:100%;border-radius:14px;display:block}
  .mbox p{font-size:13px;color:var(--sub);margin:10px 0}
  .mrow{display:flex;gap:8px}
  .mrow button,.mrow a{flex:1;padding:13px;border-radius:14px;font-weight:700;text-decoration:none;text-align:center}
  .mrow .a1{background:var(--accent);color:#fff}
  .mrow .a2{background:#f1ecff;color:var(--accent)}
</style>
</head>
<body>

<!-- 시작 화면 -->
<section id="start">
  <div class="logo">💇‍♀️👗</div>
  <h1><span>변신 스튜디오</span></h1>
  <p class="lead">내 사진 그대로, 얼굴은 바꾸지 않고<br>염색 · 앞머리 · 옷 색 · 소품을 바꿔보는<br>스타일 미션 게임 (프로토타입)</p>
  <div class="stars" id="starsStart">⭐ 0</div>
  <button class="bigbtn primary" id="btnCam">📸 셀카 찍기</button>
  <button class="bigbtn secondary" id="btnAlbum">🖼️ 앨범에서 고르기</button>
  <div class="privacy">🔒 사진은 <b>휴대폰 안에서만</b> 처리돼요.<br>서버로 보내지 않고, 저장도 하지 않아요.</div>
  <div class="privacy" style="font-size:12.5px">💡 잘 나오는 사진: 정면 · 밝은 곳 · 얼굴과 머리 전체 · 상반신까지</div>
  <div id="modelStatus"></div>
  <input type="file" id="fileCam" accept="image/*" capture="user" hidden>
  <input type="file" id="fileAlbum" accept="image/*" hidden>
</section>

<!-- 편집 화면 -->
<section id="editor" class="hidden">
  <div class="topbar">
    <button class="iconbtn" id="btnBack">← 다시 찍기</button>
    <div class="t">변신 스튜디오</div>
    <div class="stars" id="starsTop">⭐ 0</div>
  </div>

  <div class="mission">
    <div class="row">
      <div class="mt" id="mTitle">미션</div>
      <button class="re" id="btnNextMission">다른 미션 ↻</button>
    </div>
    <div class="conds" id="mConds"></div>
  </div>

  <div class="stage" id="stage">
    <canvas id="viewCanvas"></canvas>
    <canvas id="origCanvas" class="hidden"></canvas>
    <div class="badge hidden" id="origBadge">기존 사진</div>
    <div id="busy"><div class="spin"></div><div id="busyText">AI가 머리카락과 옷을 찾는 중…</div></div>
  </div>

  <div class="actions">
    <button id="btnHold">👀 꾹 눌러 원본</button>
    <button id="btnReset">↺ 초기화</button>
    <button class="save" id="btnCard">✨ 변신 카드</button>
  </div>

  <div class="panel">
    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="hair">염색</button>
      <button class="tab" data-tab="bangs">앞머리</button>
      <button class="tab" data-tab="cloth">옷 색</button>
      <button class="tab" data-tab="items">소품</button>
    </div>
    <div class="opts" id="opts"></div>
    <div class="slider" id="sliderRow"><span>자연스럽게</span><input type="range" id="intensity" min="40" max="100" value="85"><span>진하게</span></div>
    <div class="note hidden" id="tabNote"></div>
  </div>
</section>

<div id="toast"></div>
<div id="modal" class="hidden">
  <div class="mbox">
    <img id="cardImg" alt="변신 카드">
    <p>이미지를 길게 눌러도 저장할 수 있어요.</p>
    <div class="mrow">
      <a class="a1" id="btnDownload" download="변신카드.png">💾 저장하기</a>
      <button class="a2" id="btnShare">공유</button>
      <button class="a2" id="btnClose">닫기</button>
    </div>
  </div>
</div>

<script type="module">
/* =========================================================
   변신 스튜디오 – 프로토타입
   - 사진 전체를 AI가 다시 그리지 않는다.
   - MediaPipe(구글, 기기 안에서 실행)로
       · 머리카락 / 얼굴 피부 / 옷 영역을 찾고 (멀티클래스 분할)
       · 얼굴 위치 점 478개를 찾은 뒤 (얼굴 랜드마크)
     바꿀 영역에만 색을 입히거나 그림을 얹는다 → 얼굴 픽셀은 원본 그대로.
   ========================================================= */

const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
const SEG_URL = "https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite";
const FACE_URL = "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task";
const MAXD = 1024;            // 처리 해상도(긴 변)
const MOCK = new URLSearchParams(location.search).has("mock");

/* ---------- 옵션 데이터 ---------- */
const HAIR = [
  {k:null,     n:"원래 색",      c:null},
  {k:"ash",    n:"애쉬브라운",   c:"#86766a"},
  {k:"choco",  n:"초콜릿브라운", c:"#5b3826"},
  {k:"khaki",  n:"카키브라운",   c:"#6f6447"},
  {k:"milk",   n:"밀크브라운",   c:"#a8835e"},
  {k:"black",  n:"블루블랙",     c:"#1c1d26"},
  {k:"wine",   n:"와인",         c:"#6e2233"},
  {k:"pink",   n:"핑크브라운",   c:"#a5646a"},
  {k:"blue",   n:"애쉬블루",     c:"#4f5c74"},
  {k:"blond",  n:"블론드",       c:"#cfa96e"},
];
const BANGS = [
  {k:null,    n:"그대로",   e:"🙂"},
  {k:"see",   n:"시스루뱅", e:"🌫️"},
  {k:"full",  n:"풀뱅",     e:"🟫"},
  {k:"curtain",n:"커튼뱅",  e:"🎭"},
];
const CLOTH = [
  {k:null,     n:"원래 색", c:null},
  {k:"black",  n:"블랙",    c:"#25252b"},
  {k:"white",  n:"화이트",  c:"#f1efea"},
  {k:"navy",   n:"네이비",  c:"#26355c"},
  {k:"beige",  n:"베이지",  c:"#d6c2a3"},
  {k:"khaki",  n:"카키",    c:"#6c6a45"},
  {k:"red",    n:"레드",    c:"#b3262f"},
  {k:"sky",    n:"스카이",  c:"#8fb8e3"},
  {k:"lavender",n:"라벤더", c:"#b6a3dc"},
];
const ITEMS = [
  {k:"beret",  n:"베레모",     e:"🧢"},
  {k:"round",  n:"동그란 안경", e:"👓"},
  {k:"sun",    n:"선글라스",   e:"🕶️"},
  {k:"ribbon", n:"리본 핀",    e:"🎀"},
];
const MISSIONS = [
  {t:"🍂 가을 데이트 룩", c:[
    ["브라운 계열 염색", s=>["ash","choco","khaki","milk"].includes(s.hair)],
    ["앞머리 연출",     s=>!!s.bangs],
    ["베레모 쓰기",     s=>s.items.has("beret")]]},
  {t:"🎸 페스티벌 룩", c:[
    ["비비드 컬러 염색", s=>["pink","wine","blue","blond"].includes(s.hair)],
    ["선글라스",         s=>s.items.has("sun")],
    ["옷 색 바꾸기",     s=>!!s.cloth]]},
  {t:"💼 면접 프리패스", c:[
    ["단정한 블루블랙·초코", s=>["black","choco"].includes(s.hair)],
    ["네이비·블랙 옷",       s=>["navy","black"].includes(s.cloth)],
    ["소품 없이 깔끔하게",   s=>s.items.size===0 && !!s.hair]]},
  {t:"🌸 캠퍼스 새내기", c:[
    ["시스루뱅",               s=>s.bangs==="see"],
    ["밝은 옷 (화이트·베이지·라벤더)", s=>["white","beige","lavender"].includes(s.cloth)],
    ["리본 핀",                s=>s.items.has("ribbon")]]},
  {t:"📚 도서관 지성 룩", c:[
    ["동그란 안경",          s=>s.items.has("round")],
    ["차분한 애쉬·카키 염색", s=>["ash","khaki"].includes(s.hair)],
    ["베이지·카키 옷",        s=>["beige","khaki"].includes(s.cloth)]]},
  {t:"🎬 커튼뱅 주인공", c:[
    ["커튼뱅",         s=>s.bangs==="curtain"],
    ["밀크·블론드 염색", s=>["milk","blond"].includes(s.hair)],
    ["옷 색 바꾸기",    s=>!!s.cloth]]},
];

/* ---------- 상태 ---------- */
const state = {hair:null, bangs:null, cloth:null, items:new Set(), intensity:0.85, tab:"hair"};
let W=0, H=0, orig=null;            // 원본 ImageData
let hairM=null, clothM=null;        // Float32 마스크(0~1)
let hairAvg=null, clothAvg=null;    // 영역 평균 {r,g,b,L}
let F=null;                          // 얼굴 좌표계
let missionIdx = Math.floor(Math.random()*MISSIONS.length), missionDone=false;
let stars = 0;
try{ stars = +localStorage.getItem("bs_stars")||0 }catch(e){}

const $ = id => document.getElementById(id);
const view = $("viewCanvas"), vctx = view.getContext("2d", {willReadFrequently:true});
const origC = $("origCanvas");
const work = document.createElement("canvas"), wctx = work.getContext("2d", {willReadFrequently:true});
const bangC = document.createElement("canvas"), bctx = bangC.getContext("2d", {willReadFrequently:true});
const hasFilter = typeof vctx.filter === "string";

/* ---------- 모델 로딩 (사진 고르는 동안 미리) ---------- */
let segmenter=null, faceLm=null, toCPU=null;
const modelsReady = (async()=>{
  if (MOCK) return;
  $("modelStatus").textContent = "AI 모델 준비 중… (처음 한 번만, 약 20MB)";
  const vis = await import(MP + "/vision_bundle.mjs");
  const fs = await vis.FilesetResolver.forVisionTasks(MP + "/wasm");
  const make = async (Cls, opts, only) => {
    for (const delegate of (only ? [only] : ["GPU","CPU"])) {
      try { return await Cls.createFromOptions(fs, {...opts, baseOptions:{...opts.baseOptions, delegate}}); }
      catch(e){ console.warn(delegate+" 실패", e); }
    }
    throw new Error("모델 생성 실패");
  };
  const segOpts = {baseOptions:{modelAssetPath:SEG_URL}, runningMode:"IMAGE", outputCategoryMask:false, outputConfidenceMasks:true};
  const faceOpts = {baseOptions:{modelAssetPath:FACE_URL}, runningMode:"IMAGE", numFaces:1};
  segmenter = await make(vis.ImageSegmenter, segOpts);
  faceLm    = await make(vis.FaceLandmarker, faceOpts);
  // 일부 휴대폰에서 GPU 실행 중 오류가 나면 CPU로 다시 만든다
  toCPU = async()=>{
    segmenter = await make(vis.ImageSegmenter, segOpts, "CPU");
    faceLm    = await make(vis.FaceLandmarker, faceOpts, "CPU");
  };
  $("modelStatus").textContent = "✅ AI 준비 완료";
})().catch(e=>{
  console.error(e);
  $("modelStatus").textContent = "⚠️ AI 모델을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침 해주세요.";
});

/* ---------- 시작 화면 ---------- */
function updateStars(){ $("starsStart").textContent = $("starsTop").textContent = "⭐ " + stars; }
updateStars();
$("btnCam").onclick = ()=>$("fileCam").click();
$("btnAlbum").onclick = ()=>$("fileAlbum").click();
$("fileCam").onchange = e=>{ if(e.target.files[0]) openPhoto(e.target.files[0]); e.target.value=""; };
$("fileAlbum").onchange = e=>{ if(e.target.files[0]) openPhoto(e.target.files[0]); e.target.value=""; };
$("btnBack").onclick = ()=>{ $("editor").classList.add("hidden"); $("start").classList.remove("hidden"); };

async function openPhoto(file){
  $("start").classList.add("hidden"); $("editor").classList.remove("hidden");
  setBusy("사진 불러오는 중…");
  try{
    const img = new Image();
    img.src = URL.createObjectURL(file);
    await img.decode();
    await loadImage(img);
    URL.revokeObjectURL(img.src);
  }catch(e){
    console.error(e); setBusy("⚠️ 사진을 처리하지 못했어요.<br>다른 사진으로 다시 시도해 주세요.", true);
  }
}

async function loadImage(img){
  const sc = Math.min(1, MAXD/Math.max(img.naturalWidth||img.width, img.naturalHeight||img.height));
  W = Math.round((img.naturalWidth||img.width)*sc); H = Math.round((img.naturalHeight||img.height)*sc);
  for (const c of [view, origC, work, bangC]) { c.width=W; c.height=H; }
  wctx.drawImage(img,0,0,W,H);
  orig = wctx.getImageData(0,0,W,H);
  origC.getContext("2d").putImageData(orig,0,0);
  vctx.putImageData(orig,0,0);
  fitCanvases();

  setBusy("AI가 머리카락과 옷을 찾는 중…");
  await modelsReady;
  let faceM;
  if (MOCK) { ({hairM, faceM, clothM, F} = mockAnalyze()); }
  else {
    if (!segmenter) { setBusy("⚠️ AI 모델을 불러오지 못했어요.<br>새로고침 후 다시 시도해 주세요.", true); return; }
    await new Promise(r=>setTimeout(r,30));
    const analyze = ()=>{
      const res = segmenter.segment(work);
      const cm = res.confidenceMasks;  // 0 배경 1 머리카락 2 몸피부 3 얼굴피부 4 옷 5 기타
      hairM = maskToArr(cm[1]); faceM = maskToArr(cm[3]); clothM = maskToArr(cm[4]);
      res.close && res.close();
      const fr = faceLm.detect(work);
      F = (fr.faceLandmarks && fr.faceLandmarks[0]) ? buildFrame(fr.faceLandmarks[0]) : null;
    };
    try { analyze(); }
    catch(e){ console.warn("GPU 분석 실패 → CPU 재시도", e); setBusy("조금만 더 기다려 주세요…"); await toCPU(); analyze(); }
  }
  // 머리카락 마스크에서 얼굴 피부는 확실히 제외 → 얼굴은 절대 물들지 않게
  for (let i=0;i<hairM.length;i++) hairM[i] = smooth(hairM[i]) * (1 - smooth(faceM[i]));
  for (let i=0;i<clothM.length;i++) clothM[i] = smooth(clothM[i]);
  const r = Math.max(1, Math.round(Math.max(W,H)/350));
  boxBlur(hairM, W, H, r); boxBlur(clothM, W, H, r);
  hairAvg = regionAvg(hairM); clothAvg = regionAvg(clothM);

  resetState(false);
  hideBusy();
  if (!F) toast("얼굴을 찾지 못해 앞머리·소품은 꺼져 있어요");
}

function maskToArr(m){
  const a = m.getAsFloat32Array();
  if (m.width===W && m.height===H) return new Float32Array(a);
  // 크기가 다르면 리샘플
  const out = new Float32Array(W*H), mw=m.width, mh=m.height;
  for (let y=0;y<H;y++){ const sy=Math.min(mh-1, (y*mh/H)|0);
    for (let x=0;x<W;x++){ out[y*W+x] = a[sy*mw + Math.min(mw-1,(x*mw/W)|0)]; } }
  return out;
}
const smooth = v => { let t=(v-0.25)/0.6; t=t<0?0:t>1?1:t; return t*t*(3-2*t); };

function boxBlur(a, w, h, r){
  const tmp = new Float32Array(a.length), d = 2*r+1;
  for (let y=0;y<h;y++){ let s=0, row=y*w;
    for (let x=-r;x<=r;x++) s += a[row+Math.min(w-1,Math.max(0,x))];
    for (let x=0;x<w;x++){ tmp[row+x]=s/d;
      s += a[row+Math.min(w-1,x+r+1)] - a[row+Math.max(0,x-r)]; } }
  for (let x=0;x<w;x++){ let s=0;
    for (let y=-r;y<=r;y++) s += tmp[Math.min(h-1,Math.max(0,y))*w+x];
    for (let y=0;y<h;y++){ a[y*w+x]=s/d;
      s += tmp[Math.min(h-1,y+r+1)*w+x] - tmp[Math.max(0,y-r)*w+x]; } }
}

function regionAvg(m){
  const d = orig.data; let r=0,g=0,b=0,n=0;
  for (let i=0;i<m.length;i++) if (m[i]>0.8){ r+=d[i*4]; g+=d[i*4+1]; b+=d[i*4+2]; n++; }
  if (n < 300) return null;
  r/=n; g/=n; b/=n;
  return {r,g,b, L:Math.max(0.04,(0.299*r+0.587*g+0.114*b)/255), n};
}

/* ---------- 얼굴 좌표계: 얼굴이 기울어도 소품이 따라 기울게 ---------- */
function buildFrame(lm){
  const P = i => ({x:lm[i].x*W, y:lm[i].y*H});
  const e1=P(33), e2=P(263);
  const c = {x:(e1.x+e2.x)/2, y:(e1.y+e2.y)/2};
  let ux = {x:e2.x-e1.x, y:e2.y-e1.y}; const len=Math.hypot(ux.x,ux.y); ux={x:ux.x/len,y:ux.y/len};
  const uy = {x:-ux.y, y:ux.x};
  const loc = p => ({x:(p.x-c.x)*ux.x+(p.y-c.y)*ux.y, y:(p.x-c.x)*uy.x+(p.y-c.y)*uy.y});
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
  const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  const Wf = dist(P(234),P(454));
  return {
    c, ux, uy, Wf, faceH: dist(P(10),P(152)),
    y10: loc(P(10)).y,
    browY: (loc(P(105)).y + loc(P(334)).y)/2,
    halfW: Math.max(Math.abs(loc(P(54)).x), Math.abs(loc(P(284)).x)) * 1.1,
    eyeL: loc(mid(P(33),P(133))), eyeR: loc(mid(P(362),P(263))),
  };
}
const setFrame = g => g.setTransform(F.ux.x, F.ux.y, F.uy.x, F.uy.y, F.c.x, F.c.y);

/* ---------- 렌더링 ---------- */
function hex(h){ return {r:parseInt(h.slice(1,3),16)/255, g:parseInt(h.slice(3,5),16)/255, b:parseInt(h.slice(5,7),16)/255}; }

function render(){
  if (!orig) return;
  // 1) 원본 + (앞머리 그림자 → 앞머리)
  wctx.setTransform(1,0,0,1,0,0);
  wctx.putImageData(orig,0,0);
  let bangA = null;
  if (state.bangs && F && hairAvg){
    drawBangs(bctx, state.bangs);
    drawBangShadow(wctx, state.bangs);
    wctx.setTransform(1,0,0,1,0,0);
    wctx.drawImage(bangC,0,0);
    const bd = bctx.getImageData(0,0,W,H).data;
    bangA = new Float32Array(W*H);
    for (let i=0;i<bangA.length;i++) bangA[i]=bd[i*4+3]/255;
  }
  const img = wctx.getImageData(0,0,W,H), d = img.data;

  // 2) 머리카락/옷 영역에만 색 입히기 (명암·결은 원본 유지)
  const hc = state.hair && hairAvg ? hex(HAIR.find(o=>o.k===state.hair).c) : null;
  const cc = state.cloth && clothAvg ? hex(CLOTH.find(o=>o.k===state.cloth).c) : null;
  const k = state.intensity;
  if (hc || cc){
    for (let i=0, p=0; i<hairM.length; i++, p+=4){
      if (hc){
        let a = hairM[i]; if (bangA && bangA[i]>a) a = bangA[i];
        if (a>0.01) tint(d, p, hc, hairAvg.L, a*k, 0.9);
      }
      if (cc){
        const a = clothM[i];
        if (a>0.01) tint(d, p, cc, clothAvg.L, a*Math.min(1,k+0.1), 0.8);
      }
    }
  }
  vctx.setTransform(1,0,0,1,0,0);
  vctx.putImageData(img,0,0);

  // 3) 소품 얹기
  if (F){
    if (state.items.has("ribbon")) drawRibbon(vctx);
    if (state.items.has("beret"))  drawBeret(vctx);
    if (state.items.has("round"))  drawRoundGlasses(vctx);
    if (state.items.has("sun"))    drawSunglasses(vctx);
    vctx.setTransform(1,0,0,1,0,0);
  }
  checkMission();
}

// 픽셀 하나 색 바꾸기: 영역 평균 밝기를 목표색으로 맞추고, 원본의 밝고 어두운 결은 유지
function tint(d, p, t, avgL, a, contrast){
  const r=d[p], g=d[p+1], b=d[p+2];
  const L = (0.299*r+0.587*g+0.114*b)/255;
  let s = 1 + (L/avgL - 1)*contrast; if (s<0) s=0; if (s>2.2) s=2.2;
  let nr,ng,nb;
  if (s<=1){ nr=t.r*s; ng=t.g*s; nb=t.b*s; }
  else { const q=Math.min(1,(s-1)*0.85); nr=t.r+(1-t.r)*q; ng=t.g+(1-t.g)*q; nb=t.b+(1-t.b)*q; }
  if (a>1) a=1;
  d[p]   = r + (nr*255 - r)*a;
  d[p+1] = g + (ng*255 - g)*a;
  d[p+2] = b + (nb*255 - b)*a;
}

/* ---------- 앞머리 (얼굴 위치에 맞춰 머리카락 결을 한 올씩 그림) ---------- */
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shadeCol(f, alpha){ const c=hairAvg; return `rgba(${Math.min(255,c.r*f)|0},${Math.min(255,c.g*f)|0},${Math.min(255,c.b*f)|0},${alpha})`; }
function strand(g, x0,y0, cx,cy, x1,y1, w){
  g.beginPath();
  g.moveTo(x0-w,y0);
  g.quadraticCurveTo(cx-w*0.55,cy, x1,y1);
  g.quadraticCurveTo(cx+w*0.55,cy, x0+w,y0);
  g.closePath(); g.fill();
}
function bangGeom(){
  const {Wf, y10, browY, halfW} = F;
  const top = y10 - 0.12*Wf;
  return { Wf, halfW, browY, y10, top, topY: x => top + 0.22*Wf*(x/halfW)**2 };
}
function drawBangs(g, type){
  g.setTransform(1,0,0,1,0,0); g.clearRect(0,0,W,H);
  setFrame(g);
  const G = bangGeom(), {Wf, halfW, browY, topY} = G;
  const R = rng(type==="see"?11:type==="full"?23:37);
  if (hasFilter) g.filter = `blur(${Math.max(0.4, Wf/420)}px)`;

  if (type==="full" || type==="see"){
    const full = type==="full";
    const bot = browY + (full ? 0.025 : 0.045)*Wf;
    const botY = x => bot + 0.06*Wf*(x/halfW)**2;
    if (full){
      // 바탕 덩어리
      g.fillStyle = shadeCol(0.82, 0.96);
      g.beginPath();
      for (let i=0;i<=24;i++){ const x=-halfW+2*halfW*i/24; g.lineTo(x, topY(x)); }
      for (let i=24;i>=0;i--){ const x=-halfW+2*halfW*i/24; g.lineTo(x, botY(x) - (i%2?0.035:0.005)*Wf*(0.5+R())); }
      g.closePath(); g.fill();
    }
    const N = full ? 170 : 110;
    const clusters = 9;
    for (let i=0;i<N;i++){
      let x0;
      if (full) x0 = -halfW + 2*halfW*R();
      else { const ci = Math.floor(R()*clusters); x0 = -halfW*0.92 + (2*halfW*0.92)*(ci+0.5)/clusters + (R()-0.5)*halfW*0.09; }
      const x1 = x0*1.04 + (R()-0.5)*0.03*Wf;
      const y0 = topY(x0) - 0.02*Wf;
      const y1 = botY(x1) + (R()-0.5)*(full?0.025:0.05)*Wf - (full?0:R()*0.03*Wf);
      const cx = (x0+x1)/2 + (R()-0.5)*0.04*Wf, cy = y0 + (y1-y0)*0.5;
      const w = Wf*(full? 0.006+R()*0.012 : 0.004+R()*0.008);
      g.fillStyle = shadeCol(0.68 + R()*0.55, full?0.95:0.82);
      strand(g, x0,y0, cx,cy, x1,y1, w);
    }
    // 하이라이트 몇 가닥
    for (let i=0;i<(full?26:16);i++){
      const x0 = -halfW*0.8 + 1.6*halfW*R(), y0 = topY(x0);
      const y1 = y0 + (botY(x0)-y0)*(0.45+R()*0.3);
      g.fillStyle = shadeCol(1.35+R()*0.3, 0.35);
      strand(g, x0,y0, x0+(R()-0.5)*0.02*Wf,(y0+y1)/2, x0*1.03,y1, Wf*0.003);
    }
  } else if (type==="curtain"){
    for (const s of [-1,1]){
      const P0 = {x:s*0.02*Wf, y:topY(0)};
      const C  = {x:s*halfW*0.28, y:browY - 0.03*Wf};
      const P1 = {x:s*halfW*0.8,  y:browY + 0.15*Wf};
      // 바탕 덩어리
      g.fillStyle = shadeCol(0.82, 0.95);
      g.beginPath(); g.moveTo(P0.x,P0.y);
      g.quadraticCurveTo(C.x,C.y,P1.x,P1.y);
      g.lineTo(s*halfW*1.12, browY + 0.33*Wf);
      g.lineTo(s*halfW*1.1, topY(halfW));
      for (let i=12;i>=0;i--){ const x=s*halfW*1.05*i/12; g.lineTo(x, topY(x)); }
      g.closePath(); g.fill();
      // 결
      for (let i=0;i<95;i++){
        const u = R();
        const x0 = s*halfW*(0.03+0.75*u), y0 = topY(x0) - 0.02*Wf;
        const x1 = s*halfW*(0.8+0.32*u) + (R()-0.5)*0.03*Wf;
        const y1 = browY + Wf*(0.15+0.18*u) + (R()-0.5)*0.03*Wf;
        const cx = s*halfW*(0.28+0.62*u), cy = browY - 0.03*Wf + 0.07*Wf*u;
        g.fillStyle = shadeCol(0.68+R()*0.55, 0.92);
        strand(g, x0,y0, cx,cy, x1,y1, Wf*(0.005+R()*0.01));
      }
      for (let i=0;i<14;i++){
        const u = R();
        g.fillStyle = shadeCol(1.35+R()*0.3, 0.35);
        strand(g, s*halfW*(0.05+0.6*u), topY(0), s*halfW*(0.3+0.6*u), browY, s*halfW*(0.7+0.3*u), browY+0.12*Wf, Wf*0.003);
      }
    }
  }
  g.filter = "none";
  g.setTransform(1,0,0,1,0,0);
}
function drawBangShadow(g, type){
  const G = bangGeom(), {Wf, halfW, browY} = G;
  setFrame(g);
  g.save();
  if (hasFilter) g.filter = `blur(${Math.max(1.5, Wf/60)}px)`;
  g.strokeStyle = "rgba(70,40,30,0.28)"; g.lineWidth = 0.05*Wf; g.lineCap="round";
  g.beginPath();
  if (type==="curtain"){
    for (const s of [-1,1]){ g.moveTo(s*0.03*Wf, G.topY(0)+0.04*Wf); g.quadraticCurveTo(s*halfW*0.3, browY+0.0*Wf, s*halfW*0.82, browY+0.19*Wf); }
  } else {
    const bot = browY + (type==="full"?0.055:0.07)*Wf;
    for (let i=0;i<=20;i++){ const x=-halfW*0.95+1.9*halfW*i/20; g.lineTo(x, bot + 0.06*Wf*(x/halfW)**2); }
  }
  g.stroke(); g.restore(); g.filter="none";
}

/* ---------- 소품 ---------- */
function drawRoundGlasses(g){
  setFrame(g);
  const {eyeL, eyeR, Wf, halfW} = F, r = (eyeR.x-eyeL.x)*0.36, ey=(eyeL.y+eyeR.y)/2;
  g.lineWidth = Wf*0.018; g.strokeStyle = "#2a2522";
  g.fillStyle = "rgba(220,235,255,0.12)";
  for (const e of [eyeL, eyeR]){ g.beginPath(); g.arc(e.x, ey+0.02*Wf, r, 0, Math.PI*2); g.fill(); g.stroke(); }
  g.beginPath(); g.moveTo(eyeL.x+r*0.95, ey-0.1*r); g.quadraticCurveTo(0, ey-0.45*r, eyeR.x-r*0.95, ey-0.1*r); g.stroke();
  g.lineWidth = Wf*0.014;
  g.beginPath(); g.moveTo(eyeL.x-r, ey-0.15*r); g.lineTo(-halfW*1.02, ey-0.35*r);
  g.moveTo(eyeR.x+r, ey-0.15*r); g.lineTo(halfW*1.02, ey-0.35*r); g.stroke();
  // 반사광
  g.strokeStyle="rgba(255,255,255,0.45)"; g.lineWidth=Wf*0.006;
  for (const e of [eyeL, eyeR]){ g.beginPath(); g.arc(e.x, ey+0.02*Wf, r*0.72, Math.PI*1.1, Math.PI*1.45); g.stroke(); }
}
function rrect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function drawSunglasses(g){
  setFrame(g);
  const {eyeL, eyeR, Wf, halfW} = F, r=(eyeR.x-eyeL.x)*0.4, ey=(eyeL.y+eyeR.y)/2;
  const lw=r*2.15, lh=r*1.6;
  for (const e of [eyeL, eyeR]){
    const grd = g.createLinearGradient(0, ey-lh/2, 0, ey+lh/2);
    grd.addColorStop(0,"rgba(25,22,30,0.93)"); grd.addColorStop(1,"rgba(80,62,70,0.88)");
    g.fillStyle=grd; rrect(g, e.x-lw/2, ey-lh*0.45, lw, lh, lh*0.42); g.fill();
    g.lineWidth=Wf*0.016; g.strokeStyle="#111"; g.stroke();
    g.strokeStyle="rgba(255,255,255,0.28)"; g.lineWidth=Wf*0.008;
    g.beginPath(); g.moveTo(e.x-lw*0.3, ey-lh*0.2); g.lineTo(e.x-lw*0.05, ey-lh*0.32); g.stroke();
  }
  g.strokeStyle="#111"; g.lineWidth=Wf*0.016;
  g.beginPath(); g.moveTo(eyeL.x+lw/2, ey-lh*0.25); g.quadraticCurveTo(0, ey-lh*0.45, eyeR.x-lw/2, ey-lh*0.25);
  g.moveTo(eyeL.x-lw/2, ey-lh*0.3); g.lineTo(-halfW*1.02, ey-lh*0.4);
  g.moveTo(eyeR.x+lw/2, ey-lh*0.3); g.lineTo(halfW*1.02, ey-lh*0.4); g.stroke();
}
function drawBeret(g){
  setFrame(g);
  const {Wf, faceH, y10} = F;
  const top = y10 - 0.24*faceH;
  g.save(); g.translate(0.06*Wf, top + 0.06*Wf); g.rotate(-0.13);
  const rx = 0.66*Wf, ry = 0.24*Wf;
  // 그림자
  if (hasFilter) g.filter = `blur(${Wf/40}px)`;
  g.fillStyle="rgba(40,20,20,0.3)"; g.beginPath(); g.ellipse(0, ry*0.55, rx*0.85, ry*0.45, 0, 0, Math.PI*2); g.fill();
  g.filter="none";
  const grd = g.createRadialGradient(-rx*0.25,-ry*0.5, ry*0.2, 0,0, rx);
  grd.addColorStop(0,"#c44a52"); grd.addColorStop(0.7,"#8e2430"); grd.addColorStop(1,"#5d1520");
  g.fillStyle=grd; g.beginPath(); g.ellipse(0,0,rx,ry,0,0,Math.PI*2); g.fill();
  // 밴드
  g.fillStyle="#5a1520"; g.beginPath(); g.ellipse(0, ry*0.62, rx*0.74, ry*0.3, 0, 0, Math.PI); g.fill();
  // 꼭지
  g.fillStyle="#6d1a25"; g.beginPath(); g.ellipse(-rx*0.05, -ry*1.0, Wf*0.022, Wf*0.04, -0.2, 0, Math.PI*2); g.fill();
  // 질감
  g.strokeStyle="rgba(255,255,255,0.06)"; g.lineWidth=1;
  for (let i=0;i<14;i++){ g.beginPath(); g.ellipse(0,0,rx*(0.2+i*0.055),ry*(0.2+i*0.055),0,Math.PI*1.1,Math.PI*1.7); g.stroke(); }
  g.restore();
}
function drawRibbon(g){
  setFrame(g);
  const {Wf, halfW, y10} = F, s = 0.17*Wf;
  g.save(); g.translate(-halfW*0.82, y10 + 0.02*Wf); g.rotate(-0.45);
  const col1="#ff7aa8", col2="#d94c80";
  const loop = dir => { g.beginPath(); g.moveTo(0,0);
    g.bezierCurveTo(dir*s*0.9,-s*0.75, dir*s*1.25,s*0.1, dir*s*0.95,s*0.5);
    g.bezierCurveTo(dir*s*0.6,s*0.35, dir*s*0.25,s*0.15, 0,0); g.closePath();
    const grd=g.createLinearGradient(0,-s*0.6,0,s*0.5); grd.addColorStop(0,col1); grd.addColorStop(1,col2); g.fillStyle=grd; g.fill(); };
  g.fillStyle=col2;
  g.beginPath(); g.moveTo(-s*0.08,s*0.05); g.lineTo(-s*0.35,s*0.85); g.lineTo(-s*0.15,s*0.75); g.lineTo(0,s*0.1); g.fill();
  g.beginPath(); g.moveTo(s*0.08,s*0.05); g.lineTo(s*0.32,s*0.88); g.lineTo(s*0.12,s*0.78); g.lineTo(0,s*0.1); g.fill();
  loop(-1); loop(1);
  g.fillStyle="#c23c70"; g.beginPath(); g.ellipse(0,s*0.02,s*0.17,s*0.2,0,0,Math.PI*2); g.fill();
  g.fillStyle="rgba(255,255,255,0.35)"; g.beginPath(); g.ellipse(-s*0.5,-s*0.15,s*0.12,s*0.05,-0.6,0,Math.PI*2); g.fill();
  g.restore();
}

/* ---------- UI: 탭 / 옵션 ---------- */
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; buildOptions(); });

function buildOptions(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.tab===state.tab));
  const box=$("opts"); box.innerHTML="";
  const note=$("tabNote"); note.classList.add("hidden");
  $("sliderRow").classList.toggle("hidden", state.tab!=="hair");
  const t = state.tab;
  const needFace = (t==="bangs"||t==="items") && !F;
  const noHair = t==="hair" && !hairAvg, noCloth = t==="cloth" && !clothAvg;
  if (needFace || noHair || noCloth){
    note.textContent = needFace ? "얼굴을 찾지 못해서 이 기능은 쓸 수 없어요. 정면에서 얼굴이 잘 보이게 다시 찍어주세요."
      : noHair ? "머리카락 영역을 찾지 못했어요. 머리 전체가 보이게 찍어주세요."
      : "옷 영역을 찾지 못했어요. 상반신까지 나오게 찍어주세요.";
    note.classList.remove("hidden"); return;
  }
  const list = t==="hair"?HAIR : t==="bangs"?BANGS : t==="cloth"?CLOTH : ITEMS;
  for (const o of list){
    const el=document.createElement("button"); el.className="opt";
    const on = t==="items" ? state.items.has(o.k) : state[t]===o.k;
    if (on) el.classList.add("on");
    const sw = o.c ? `<div class="sw" style="background:${o.c}"></div>`
             : `<div class="sw">${o.e || "🚫"}</div>`;
    el.innerHTML = sw + `<span>${o.n}</span>`;
    el.onclick = ()=>{
      if (t==="items"){
        if (state.items.has(o.k)) state.items.delete(o.k);
        else { state.items.add(o.k); if (o.k==="sun") state.items.delete("round"); if (o.k==="round") state.items.delete("sun"); }
      } else state[t]=o.k;
      buildOptions(); scheduleRender();
    };
    box.appendChild(el);
  }
}
$("intensity").oninput = e=>{ state.intensity = e.target.value/100; scheduleRender(); };

let raf=0;
function scheduleRender(){ cancelAnimationFrame(raf); raf=requestAnimationFrame(render); }

function resetState(keepTab=true){
  state.hair=null; state.bangs=null; state.cloth=null; state.items.clear();
  if (!keepTab) state.tab="hair";
  buildOptions(); renderMission(); render();
}
$("btnReset").onclick = ()=>resetState(true);

/* 꾹 눌러 원본 보기 */
const hold = $("btnHold");
const showOrig = on => { origC.classList.toggle("hidden",!on); $("origBadge").classList.toggle("hidden",!on); };
hold.addEventListener("pointerdown", e=>{ e.preventDefault(); showOrig(true); });
["pointerup","pointerleave","pointercancel"].forEach(ev=>hold.addEventListener(ev, ()=>showOrig(false)));
hold.addEventListener("contextmenu", e=>e.preventDefault());

function fitCanvases(){
  const st=$("stage"), sw=st.clientWidth, sh=st.clientHeight;
  if (!W||!sw||!sh) return;
  const s=Math.min(sw/W, sh/H);
  for (const c of [view, origC]){ c.style.width=(W*s)+"px"; c.style.height=(H*s)+"px"; }
}
addEventListener("resize", fitCanvases);

/* ---------- 미션 ---------- */
function renderMission(){
  missionDone=false;
  const m=MISSIONS[missionIdx];
  $("mTitle").textContent = m.t;
  $("mConds").innerHTML = m.c.map(c=>`<span class="cond">${c[0]}</span>`).join("");
}
function checkMission(){
  const m=MISSIONS[missionIdx]; const els=$("mConds").children; let all=true;
  m.c.forEach((c,i)=>{ const ok=!!c[1](state); els[i]&&els[i].classList.toggle("on",ok); all=all&&ok; });
  if (all && !missionDone){
    missionDone=true; stars++; try{localStorage.setItem("bs_stars",stars)}catch(e){}
    updateStars(); toast("🎉 미션 성공! ⭐ +1<br><small>변신 카드로 저장해 보세요</small>");
  }
}
$("btnNextMission").onclick = ()=>{ missionIdx=(missionIdx+1)%MISSIONS.length; renderMission(); checkMission(); };

/* ---------- 변신 카드 ---------- */
$("btnCard").onclick = makeCard;
function label(){
  const parts=[];
  if (state.hair) parts.push("염색 "+HAIR.find(o=>o.k===state.hair).n);
  if (state.bangs) parts.push(BANGS.find(o=>o.k===state.bangs).n);
  if (state.cloth) parts.push("옷 "+CLOTH.find(o=>o.k===state.cloth).n);
  for (const k of state.items) parts.push(ITEMS.find(o=>o.k===k).n);
  return parts.length?parts.join(" · "):"아직 변신 전";
}
function makeCard(){
  const CW=1080, pad=48, gap=24, colW=(CW-pad*2-gap)/2;
  const ph = Math.min(colW*H/W, colW*1.45);
  const CH = Math.round(210 + ph + 230);
  const c=document.createElement("canvas"); c.width=CW; c.height=CH; const g=c.getContext("2d");
  const bg=g.createLinearGradient(0,0,CW,CH); bg.addColorStop(0,"#f3edff"); bg.addColorStop(1,"#ffeef4");
  g.fillStyle=bg; g.fillRect(0,0,CW,CH);
  g.fillStyle="#26213a"; g.font="800 60px -apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"; g.textAlign="center";
  g.fillText("✨ 나의 변신 카드", CW/2, 100);
  g.font="600 34px -apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"; g.fillStyle="#6c4cf1";
  g.fillText(MISSIONS[missionIdx].t + (missionDone?"  ·  미션 성공 ⭐":""), CW/2, 160);
  const drawPhoto=(src,x,lab)=>{
    const y=200; g.save(); rrect(g,x,y,colW,ph,28); g.clip();
    // cover 크롭
    const s=Math.max(colW/W, ph/H), dw=W*s, dh=H*s;
    g.drawImage(src, x+(colW-dw)/2, y+(ph-dh)/2, dw, dh); g.restore();
    g.fillStyle="rgba(38,33,58,.78)"; rrect(g,x+18,y+18,150,52,26); g.fill();
    g.fillStyle="#fff"; g.font="700 28px -apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif"; g.fillText(lab, x+93, y+54);
  };
  g.textAlign="center";
  drawPhoto(origC, pad, "기존");
  drawPhoto(view, pad+colW+gap, "변신 후");
  g.fillStyle="#26213a"; g.font="700 36px -apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif";
  wrapText(g, label(), CW/2, 200+ph+75, CW-pad*2, 46);
  g.fillStyle="#8a84a0"; g.font="500 25px -apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif";
  g.fillText("가상 미리보기예요. 실제 시술·착용 결과와 다를 수 있어요.", CW/2, CH-70);
  g.fillText("변신 스튜디오 · 얼굴은 원본 그대로", CW/2, CH-32);
  const url=c.toDataURL("image/png");
  $("cardImg").src=url; $("btnDownload").href=url; $("modal").classList.remove("hidden");
  $("btnShare").onclick = async()=>{
    try{
      const blob = await (await fetch(url)).blob();
      const file = new File([blob],"변신카드.png",{type:"image/png"});
      if (navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file], title:"나의 변신 카드"});
      else toast("이 브라우저는 공유를 지원하지 않아요. 저장하기를 눌러주세요");
    }catch(e){}
  };
}
function wrapText(g, text, x, y, maxW, lh){
  const words=text.split(" "); let line="";
  for (const w of words){ const t=line?line+" "+w:w; if (g.measureText(t).width>maxW && line){ g.fillText(line,x,y); y+=lh; line=w; } else line=t; }
  g.fillText(line,x,y);
}
$("btnClose").onclick = ()=>$("modal").classList.add("hidden");

/* ---------- 공통 ---------- */
function setBusy(html, err){ $("busy").classList.remove("hidden"); $("busyText").innerHTML=html; $("busy").querySelector(".spin").classList.toggle("hidden",!!err); }
function hideBusy(){ $("busy").classList.add("hidden"); fitCanvases(); }
let tt=0;
function toast(html){ const t=$("toast"); t.innerHTML=html; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2200); }

/* ---------- 테스트용 가짜 데이터 (?mock) ---------- */
function mockAnalyze(){
  // 테스트 그림에서 색으로 영역을 판별
  const d=orig.data, n=W*H, hair=new Float32Array(n), face=new Float32Array(n), cloth=new Float32Array(n);
  for (let i=0;i<n;i++){ const r=d[i*4],g=d[i*4+1],b=d[i*4+2];
    if (r<90&&g<70&&b<60) hair[i]=1; else if (r>200&&g>150&&b>120&&r>b) face[i]=1; else if (b>150&&r<120) cloth[i]=1; }
  const fx=W/2, fy=H*0.42, fw=W*0.36, fh=fw*1.3;
  const lm = Array.from({length:478},()=>({x:fx/W,y:fy/H,z:0}));
  const set=(i,x,y)=>lm[i]={x:x/W,y:y/H,z:0};
  set(33,fx-fw*0.3,fy); set(133,fx-fw*0.1,fy); set(362,fx+fw*0.1,fy); set(263,fx+fw*0.3,fy);
  set(234,fx-fw*0.5,fy+fw*0.05); set(454,fx+fw*0.5,fy+fw*0.05);
  set(10,fx,fy-fh*0.42); set(152,fx,fy+fh*0.55);
  set(105,fx-fw*0.2,fy-fh*0.13); set(334,fx+fw*0.2,fy-fh*0.13);
  set(54,fx-fw*0.38,fy-fh*0.33); set(284,fx+fw*0.38,fy-fh*0.33);
  return {hairM:hair, faceM:face, clothM:cloth, F:buildFrame(lm)};
}
if (MOCK){
  window.__mock = async(src)=>{
    $("start").classList.add("hidden"); $("editor").classList.remove("hidden");
    const img=new Image(); img.src=src; await img.decode(); await loadImage(img);
  };
  window.__state = state; window.__render = render; window.__build = buildOptions; window.__card = makeCard;
  // 자동 테스트: ?mock&hair=ash&bangs=full&cloth=navy&items=beret,round&card
  (async()=>{
    const q=new URLSearchParams(location.search);
    const c=document.createElement("canvas"); c.width=600; c.height=800; const g=c.getContext("2d");
    g.fillStyle="#e9e4f5"; g.fillRect(0,0,600,800);
    g.fillStyle="#4a3020"; g.beginPath(); g.ellipse(300,330,170,215,0,0,Math.PI*2); g.fill(); g.fillRect(130,330,340,260);
    g.fillStyle="#2f5fd0"; g.beginPath(); g.ellipse(300,800,280,190,0,0,Math.PI*2); g.fill();
    g.fillStyle="#f2c9a8"; g.fillRect(265,520,70,110);
    g.beginPath(); g.ellipse(300,370,108,140,0,0,Math.PI*2); g.fill();
    g.fillStyle="#3a2a20"; g.beginPath(); g.ellipse(265,337,10,6,0,0,Math.PI*2); g.ellipse(335,337,10,6,0,0,Math.PI*2); g.fill();
    g.fillStyle="#c76a6a"; g.beginPath(); g.ellipse(300,440,22,8,0,0,Math.PI*2); g.fill();
    await window.__mock(c.toDataURL());
    if (q.get("hair")) state.hair=q.get("hair");
    if (q.get("bangs")) state.bangs=q.get("bangs");
    if (q.get("cloth")) state.cloth=q.get("cloth");
    if (q.get("items")) q.get("items").split(",").forEach(k=>state.items.add(k));
    buildOptions(); render();
    if (q.has("card")) makeCard();
  })();
}
