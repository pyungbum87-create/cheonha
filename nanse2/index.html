,'제갈량이 죽자 위연이 잔도를 불태우고 맞선다. "누가 감히 나를 베랴" 외치는 순간 뒤에 있던 마대가 벤다.',["madai","weiyan"],[["madai","weiyan","마대가 뒤에서 벰"]],["weiyan","madai"],"event","madai","weiyan"]],il={b184_daxing:{lines:[[null,"184년 봄, 탁현. 황건의 무리 5만이 대흥산 아래로 몰려든다."],["liubei","의병은 오백뿐이오. 허나 백성을 지키려는 마음은 저들의 열 배요."],["zhangfei","형님, 말은 그만하시오! 창끝이 근질근질하오!"],["guanyu","적장 정원지는 내가 맡겠소. 형님은 깃발만 높이 드시오."],[null,"세 의형제의 첫 싸움이 시작된다."]]},e189_shichangshi:{bg:"bg_palace",lines:[[null,"189년 8월, 낙양 궁궐."],["hejin","환관 놈들을 쓸어버릴 때가 왔다. 내가 직접 궁에 들어가겠다."],["cao","대장군, 함정입니다. 홀로 들어가시면 안 됩니다."],["hejin","내시 몇 놈이 무엇을 하겠는가!"],[null,"하진은 궁문 안에서 십상시의 칼에 쓰러진다. 그 혼란 속에 동탁이 낙양으로 들어온다."]]},e189_dingyuan:{bg:"bg_camp",lines:[[null,"동탁이 적토마와 황금을 정원의 양자에게 보낸다."],["liru","여포 한 사람만 얻으면 천하에 두려울 것이 없습니다."],["lvbu","의부라… 사내가 남의 밑에서 늙을 수는 없지."],[null,"그날 밤 여포는 정원의 목을 들고 동탁에게 절한다."]]},e190_qixing:{bg:"bg_palace",lines:[[null,"조조가 왕윤에게서 일곱 개의 별이 박힌 보도를 빌린다."],["cao","역적의 목은 이 조맹덕이 베겠습니다."],["dongzhuo","맹덕, 거울에 칼날이 비치는구나. 무엇을 하려는 게냐?"],["cao","…승상께 바칠 보도를 고르던 참이었습니다."],[null,"조조는 그 길로 낙양을 빠져나가 고향에서 의병을 모은다."]]},b190_sishui:{lines:[[null,"사수관. 동탁의 맹장 화웅이 연합군 장수를 잇달아 벤다."],["huaxiong","제후들의 군대가 고작 이 정도냐!"],["yuanshao","내 상장들이 여기 있었더라면…"],["guanyu","제가 나가 화웅의 목을 가져오겠습니다."],["cao","이 술이 식기 전에 돌아오시오."],[null,"술잔이 식기도 전에, 관우가 화웅의 목을 들고 돌아온다."]]},b190_hulao:{lines:[[null,"호뢰관. 붉은 말을 탄 여포가 극을 비껴들고 나온다."],["lvbu","덤빌 자가 없느냐! 제후 열여덟이 모두 겁쟁이로구나."],["zhangfei","성을 세 번 바꾼 종놈아, 장익덕이 여기 있다!"],["guanyu","익덕, 혼자서는 버겁다. 내가 돕겠다."],["liubei","두 아우만 싸우게 둘 수는 없지!"],[null,"세 형제와 여포가 수십 합을 겨룬다. 여포는 끝내 말을 돌려 관 안으로 물러난다."]]},e190_yuxi:{lines:[[null,"불타 버린 낙양, 무너진 우물 속에서 오색 빛이 새어 나온다."],["sunjian","이것은… 나라의 옥새가 아닌가."],["sunjian","하늘이 내게 무엇을 바라는 것인가."],[null,"손견은 옥새를 숨긴 채 강동으로 돌아간다. 이 일이 훗날 그의 운명을 재촉한다."]]},e192_lianhuan:{bg:"bg_house",lines:[[null,"192년, 장안. 왕윤의 집 뒤뜰, 달빛 아래."],["wangyun","나라를 위해 네게 너무 큰 짐을 지우는구나."],["diaochan","대인께 받은 은혜, 이 몸으로 갚겠습니다."],["lvbu","초선을 빼앗아 간 늙은 도적…! 이제 더는 참지 않겠다."],["dongzhuo","봉선, 네가 감히…!"],[null,"여포의 극이 동탁을 꿰뚫는다. 장안의 백성들이 거리로 나와 춤을 춘다."]]},b194_xuzhou:{lines:[[null,"아버지가 서주 땅에서 살해당했다는 소식이 조조에게 닿는다."],["cao","도겸의 땅을 피로 씻어 아버님의 원수를 갚으리라!"],["taoqian","내 부하의 죄를 백성에게 묻지 마시오…"],[null,"조조의 대군이 서주를 휩쓴다. 그때 연주에서 여포가 일어났다는 급보가 날아든다."]]},b194_puyang:{lines:[[null,"복양성의 성문이 활짝 열린다. 성 안의 부호가 내응을 약속한 것이다."],["chengong","조조가 들어오거든 사방에 불을 놓아라."],["cao","…함정이다! 물러나라!"],["dianwei","주공, 제 등 뒤로 오십시오!"],[null,"불길 속에서 전위가 길을 연다. 조조는 수염을 그을린 채 간신히 빠져나온다."]]},b195_shenting:{lines:[[null,"신정의 고개 위. 단 두 기가 마주 선다."],["taishici","손책이냐! 동래의 태사자가 왔다!"],["sunce","좋다, 사내라면 이렇게 만나야지!"],[null,"두 사람은 백 합을 넘게 싸우며 서로의 투구와 창을 빼앗는다. 훗날 태사자는 손책의 사람이 된다."]]},e196_yuanmen:{bg:"bg_camp",lines:[[null,"소패 밖. 원술의 장수 기령이 대군을 끌고 왔다."],["lvbu","내가 저 진문의 극을 화살 한 대로 맞히면, 둘 다 군사를 물려라."],["jiling","백오십 보 밖이오. 어림없는 소리!"],["lvbu","하늘이 정할 일이다."],[null,"화살이 극의 작은 날을 정확히 꿰뚫는다. 양쪽 진영이 숨을 삼킨다."]]},b197_wancheng:{lines:[[null,"완성. 항복했던 장수가 밤중에 반란을 일으킨다."],["jiaxu","전위만 막으면 조조는 독 안의 쥐요. 그의 무기부터 빼돌리시오."],["dianwei","주공은 어서 가십시오! 이 문은 아무도 못 지나갑니다!"],["cao","전위…!"],[null,"전위는 맨손으로 적을 막다 문 앞에 선 채로 숨을 거둔다. 조조의 맏아들도 이날 전사한다."]]},b198_xiapi:{lines:[[null,"198년 겨울, 하비. 두 강의 물이 성을 삼킨다."],["lvbu","나를 묶은 줄이 너무 조이는구나. 좀 풀어 주시오, 조공."],["cao","현덕, 이 범을 어찌하면 좋겠소?"],["liubei","정원과 동탁의 일을 잊으셨습니까."],["lvbu","귀 큰 놈아, 가장 믿을 수 없는 건 바로 너다!"],["chengong","늙은 어머니와 처자를 부탁하오."],[null,"하비의 누각에서 천하제일의 무장이 생을 마친다."]]},e199_yidai:{bg:"bg_palace",lines:[[null,"황제가 몰래 내린 옷띠 속에 피로 쓴 밀서가 있었다."],["xiandi","조조의 횡포를 더는 견딜 수 없소. 충신들이여, 짐을 구하라."],["dongcheng","신, 목숨을 걸고 받들겠습니다."],["liubei","이 유비도 이름을 올리겠소."],[null,"그러나 계획은 새어 나가고, 이름을 올린 자들은 차례로 화를 입는다."]]},b200_baima:{lines:[[null,"백마. 원소의 맹장 안량이 조조의 장수들을 연달아 꺾는다."],["cao","운장, 저 장수를 아시오?"],["guanyu","제 목을 팔려고 내놓은 자처럼 보이는군요."],[null,"관우는 붉은 말을 달려 만군 속을 꿰뚫고, 단칼에 안량의 목을 벤다."]]},e200_wuguan:{lines:[[null,"관우가 조조에게 받은 금과 비단을 모두 봉해 두고 길을 떠난다."],["cao","운장의 마음은 끝내 내 것이 되지 않는구나."],["guanyu","승상의 은혜는 백마에서 갚았습니다. 이제 형님께 갑니다."],[null,"다섯 관문, 여섯 장수. 언월도가 지나간 길에 이름이 하나씩 쓰러진다."]]},e200_gucheng:{lines:[[null,"고성. 장비가 성문 위에서 관우를 노려본다."],["zhangfei","조조에게 항복한 배신자가 무슨 낯으로 왔소!"],["guanyu","익덕, 뒤에 쫓아오는 조조군이 보이지 않느냐."],[null,"관우는 북이 세 번 울리기 전에 추격해 온 장수의 목을 벤다. 장비가 울며 형 앞에 엎드린다."],["liubei","다시 셋이 모였구나. 하늘이 우리를 버리지 않았다."]]},e200_sunce_death:{bg:"bg_house",lines:[[null,"사냥길에 자객의 화살을 맞은 손책이 자리에 누웠다."],["sunce","중모야, 군사를 몰아 천하를 다투는 건 네가 나만 못하다."],["sunce","허나 인재를 아껴 강동을 지키는 건 내가 너만 못하다."],["sunquan","형님…!"],[null,"스물여섯의 젊은 패왕이 눈을 감는다. 열아홉 살 손권이 강동을 잇는다."]]},b200_guandu:{lines:[[null,"관도. 조조의 군량은 바닥을 보이고, 원소의 군세는 열 배다."],["xuyou","맹덕, 오소의 군량 창고가 허술하오. 내가 길을 알려 주겠소."],["cao","자원! 그대가 와 주니 대사가 이루어졌소!"],["yuanshao","오소가 불탄다고…? 장합과 고람은 어디 있느냐!"],[null,"오소의 불길이 하북의 운명을 태운다."]]},e207_sangu:{lines:[[null,"207년 겨울, 융중. 눈보라 속 초가 한 채."],["zhangfei","형님, 이번이 세 번째요. 또 없으면 저 집에 불을 지르겠소!"],["liubei","익덕, 말을 삼가라. 천하를 얻으려면 이만한 정성은 들여야 한다."],["zhugeliang","장군께서 세 번이나 오셨으니, 이 몸이 어찌 더 숨겠습니까."],["zhugeliang","북쪽은 하늘의 때를 얻은 조조에게, 동쪽은 땅의 이로움을 얻은 손권에게 맡기십시오. 장군은 사람의 화합으로 서천을 얻으십시오."],[null,"천하를 셋으로 나누는 계책이 이날 세상에 나온다."]]},b208_changban:{lines:[[null,"장판. 피난민 십만이 조조의 철기에 짓밟힌다."],["zhaoyun","주공의 아드님을 찾기 전에는 돌아가지 않겠다!"],["cao","저 백마의 장수는 누구냐? 죽이지 말고 산 채로 잡아라!"],["zhangfei","장익덕이 여기 있다! 누가 감히 나와 생사를 겨루겠느냐!"],[null,"장비의 고함이 다리 위를 울리고, 조운은 품에 아이를 안은 채 포위를 뚫는다."]]},e208_caimao:{bg:"bg_camp",lines:[[null,"주유의 막사에 옛 친구가 찾아와 술잔을 나눈다."],["zhouyu","오늘 밤은 군사 이야기는 하지 마세. 취해 보세나!"],[null,"취한 척 잠든 주유의 책상 위에는 채모와 장윤의 이름이 적힌 거짓 편지가 놓여 있었다."],["cao","채모, 장윤 이놈들이 나를 팔려 했단 말이냐! 목을 베라!"],["cao","…아차, 주유의 계략에 걸렸구나."]]},b208_chibi:{lines:[[null,"208년 겨울, 적벽. 쇠사슬로 묶인 배들이 강을 메운다."],["zhugeliang","동남풍은 내가 불러오겠소."],["huanggai","항복하는 배요! 길을 여시오!"],["cao","어째서 바람이 동남쪽에서 부는가…!"],["zhouyu","지금이다! 불을 놓아라!"],[null,"강 위의 배들이 한꺼번에 타오른다. 백만 대군이 불길 속에 무너진다."]]},e208_huarong:{bg:"bg_field",lines:[[null,"화용도. 적벽을 빠져나온 패잔병이 진흙길을 기어간다."],["cao","하하, 주유와 제갈량도 별것 아니구나. 여기 군사 한 무리만 숨겨 두었더라면…"],["guanyu","승상, 오랜만이오."],["cao","운장… 옛날 다섯 관문의 일을 기억하시오?"],[null,"관우는 말없이 말머리를 돌린다. 조조가 그 옆을 지나간다."]]},b209_changsha:{lines:[[null,"장사. 백발의 노장이 활을 들고 성을 나선다."],["huangzhong","늙었다고 얕보지 마라. 내 화살은 아직 과녁을 벗어난 적이 없다."],["guanyu","말이 넘어졌을 때 베지 않았으니, 나도 그대를 쏘지 않겠소."],[null,"두 노장이 서로의 목숨을 살려 준다. 장사는 곧 유비의 땅이 된다."]]},b211_tongguan:{lines:[[null,"동관. 아버지의 원수를 갚으러 서량의 기병이 몰려온다."],["machao","붉은 옷을 입은 자가 조조다! 놓치지 마라!"],["cao","…옷을 벗어라! 수염을 잘라라!"],["xuchu","승상, 배에 오르십시오! 화살은 제가 막겠습니다!"],[null,"조조는 겨우 강을 건넌다. 이후 이간계로 마초와 한수 사이를 갈라놓는다."]]},b214_luofeng:{lines:[[null,"낙봉파. 좁은 골짜기, 하얀 말을 탄 사람이 앞장선다."],["pangtong","이곳의 이름이 무엇이냐? …봉황이 떨어진다는 땅이라."],["zhangren","백마를 탄 자가 유비다! 쏘아라!"],[null,"화살비가 쏟아진다. 봉추가 서른여섯에 떨어진다."]]},b215_hefei:{lines:[[null,"합비 소요진. 손권의 십만 대군 앞에 팔백 기가 선다."],["zhangliao","장문원이 여기 있다! 손권은 나와라!"],["sunquan","다리가 끊겼다…! 말을 뛰어넘게 하라!"],["ganning","주공을 지켜라! 한 놈도 다가오지 못하게!"],[null,"이날 이후 강동에서는 장료의 이름만 들어도 우는 아이가 울음을 그쳤다."]]},b219_dingjun:{lines:[[null,"219년 봄, 정군산."],["fazheng","노장군, 적이 지쳤습니다. 지금 깃발을 흔들겠습니다!"],["huangzhong","일흔의 늙은이라 얕보지 마라!"],["xiahouyuan","저 늙은 장수가 산 위에서…!"],[null,"황충의 칼이 하후연을 벤다. 한중의 문이 열린다."]]},b219_fancheng:{lines:[[null,"219년 가을, 번성. 열흘 넘게 비가 쏟아진다."],["guanyu","강둑을 터라. 하늘이 물로 적을 치라 하신다."],["yujin","물이…! 진영이 잠긴다!"],["pangde","관을 짊어지고 왔다. 무릎을 꿇느니 죽겠다!"],[null,"일곱 군이 물에 잠기고, 관우의 이름이 중원을 뒤흔든다."]]},b220_maicheng:{lines:[[null,"220년 겨울, 맥성. 형주는 이미 오의 손에 넘어갔다."],["guanping","아버님, 남은 군사가 삼백도 되지 않습니다."],["guanyu","옥은 부서져도 흰빛을 잃지 않고, 대나무는 타도 마디를 굽히지 않는다."],[null,"관우 부자는 북문을 나서 서천으로 향한다. 그 길 위에 오군의 밧줄이 숨어 있었다."]]},e221_zhangfei:{bg:"bg_camp",lines:[[null,"221년, 낭중. 장비는 사흘 안에 흰 상복을 지으라 명한다."],["zhangfei","못 하겠다고? 내일까지 못 하면 네 목을 걸어라!"],[null,"그날 밤, 매를 맞은 두 부장이 술에 취해 잠든 장비의 막사로 숨어든다."]]},b222_yiling:{lines:[[null,"이릉. 유비의 진영이 숲을 따라 칠백 리에 늘어서 있다."],["liubei","글만 읽던 서생이 대장이라니. 오에는 사람이 없구나."],["luxun","적이 지치고 날이 더워졌다. 바람이 숲을 향할 때를 기다렸다."],["luxun","모든 진영에 불을 놓아라!"],[null,"칠백 리가 하룻밤에 탄다. 유비는 백제성으로 달아난다."]]},e223_baidi:{bg:"bg_house",lines:[[null,"223년 봄, 백제성. 유비가 마지막 숨을 고른다."],["liubei","승상의 재주는 조비의 열 배요. 아들이 도울 만하면 돕고, 아니면 그대가 스스로 취하시오."],["zhugeliang","신이 어찌 감히… 죽을 때까지 충절을 다하겠습니다."],[null,"제갈량이 이마를 바닥에 대고 운다. 촉한의 짐이 그의 어깨에 얹힌다."]]},b225_nanman:{lines:[[null,"남중. 맹획이 또다시 묶여 끌려온다."],["menghuo","이번엔 운이 나빴을 뿐이오! 다시 싸우면 이길 수 있소!"],["zhugeliang","풀어 주어라. 몇 번이든 기다리겠다."],[null,"일곱 번 잡혔다 일곱 번 풀려난 끝에, 맹획이 무릎을 꿇는다."],["menghuo","승상의 위엄은 하늘과 같소. 남인은 다시는 배반하지 않겠소."]]},b228_tianshui:{lines:[[null,"천수. 젊은 장수 하나가 촉군의 계략을 번번이 꿰뚫는다."],["zhugeliang","저 사람이 누구냐? 내 평생 배운 것을 전할 이를 찾았구나."],["jiangwei","승상의 뜻이 한실 부흥에 있다면, 이 몸이 따르겠습니다."]]},b228_jieting:{lines:[[null,"가정. 촉군의 생명줄이 걸린 길목."],["wangping","장군, 산 위에 진을 치면 물길이 끊깁니다!"],["masu","높은 곳에 오르면 아래를 굽어볼 수 있다. 병법도 모르는가."],["zhanghe","저 산의 물길만 끊으면 끝이다."],[null,"가정이 무너지고 북벌은 실패한다. 제갈량은 눈물을 흘리며 마속의 목을 벤다."]]},e234_wuzhang:{bg:"bg_camp",lines:[[null,"234년 가을, 오장원. 가을바람이 군막을 흔든다."],["zhugeliang","다시는 적을 치러 나갈 수 없겠구나… 하늘도 무심하다."],["jiangwei","승상!"],[null,"큰 별이 떨어진다. 촉군은 나무로 깎은 승상의 상을 수레에 태우고 물러난다."],["simayi","공명이 살아 있었다고…? 아니, 나무 인형이었단 말인가."]]},e234_weiyan:{bg:"bg_field",lines:[[null,"제갈량의 장례 행렬 앞을 위연이 막아선다."],["weiyan","누가 감히 나를 죽일 수 있겠느냐!"],["madai","여기 있다!"],[null,"마대의 칼이 위연의 목을 벤다. 제갈량이 남긴 비단 주머니의 계책이었다."]]}},sl={hejin:"yasim",zhangrang:"gyohwal",lushi:"uiri",huangfusong:"sinjung",zhujun:"yongjang",wangyun:"uiri",caiyong:"onhwa",dongcheng:"uiri",yangbiao:"sinjung",dingyuan:"yongjang",liuyu:"onhwa",zhongyao:"sinjung",diaochan:"uiri",caiyan:"onhwa",zhangjiao:"yasim",zhangbao_hj:"yasim",zhangliang_hj:"yasim",chengyuanzhi:"yongjang",dengmao:"yongjang",hanzhong:"yongjang",sunzhong:"yongjang",zhaohong:"yongjang",peiyuanshao:"uiri",zhoucang:"uiri",liaohua:"uiri",liubi:"uiri",gongdu:"yongjang",guanhai:"yongjang",heyi:"yongjang",huangshao:"yongjang",heman:"yongjang",zhangyan:"gyohwal",dongzhuo:"yasim",liru:"gyohwal",huaxiong:"yongjang",lijue:"yasim",guosi:"yasim",zhangji:"sinjung",fanchou:"yongjang",xurong:"sinjung",huzhen:"yongjang",lisu:"gyohwal",niufu:"yasim",dongmin:"yasim",jiaxu:"sinjung",lvbu:"yasim",chengong:"uiri",gaoshun:"uiri",zhangliao:"sinjung",zangba:"uiri",haomeng:"yasim",caoxing:"yongjang",chenglian:"yongjang",weixu:"gyohwal",songxian:"gyohwal",houcheng:"gyohwal",chenggui:"gyohwal",chendeng:"gyohwa   ${n("전쟁: 군단·행군·공성","<p>적 성을 누르고 <b>출진</b>을 고르면 작전 화면이 열린다. 인접한 우리 성마다 <b>장수</b>(첫 번째가 대장, 최대 3명)와 <b>병력 비율</b>을 고르고, <b>군량</b> 개월 수를 정한다.</p><p>여러 성에서 동시에 보내면 <b>합동 공격</b>이 된다. 부장의 능력이 더해지고 사기가 오른다.</p><p>군단은 1~2개월 행군한 뒤 성을 <b>포위</b>한다. 그 뒤 달마다 공성전이 벌어진다. 성벽은 포위할수록 깎이고, 화공과 공성 병기로 더 빨리 무너뜨릴 수 있다.</p><p>군량이 떨어지면 사기가 무너져 물러나야 한다. 군단 화면에서 <b>군량 보급</b>이나 <b>퇴각</b>을 명할 수 있다. 적도 원군을 보내니 주변 성을 살피자.</p>",!0)}
  ${n("전투","<p>그대가 이끄는 군단이나 그대가 있는 성이 싸우면 직접 지휘한다. 먼저 <b>병종</b>을 고르고, 3합 동안 매 합 <b>전술</b>을 고른다.</p><p>병종 상성: <b>창병 › 기병 › 궁병 › 창병</b>. 수군은 강에서만 강하다. 기병은 평지, 궁병은 산지·관문, 창병은 관문에서 강하다.</p><p>전술 상성: <b>돌격 › 화공 › 방진 › 기습 › 돌격</b>. 기병+돌격, 궁병+화공, 창병+방진, 수군+화공은 시너지가 있다.</p><p><b>일기토</b>로 적의 사기를 꺾거나 적장을 사로잡을 수 있다. 바쁠 때는 <b>맡긴다</b>로 자동 전투를 한다.</p>")}
  ${n("정찰·계략·매복","<p>우리 땅과 맞닿지 않은 적 성은 병력이 <b>?</b>로 가려진다. <b>정찰</b>하면 6개월 동안 보인다.</p><p>적 성에 <b>계략</b>: 유언비어(병사 이탈·사기 저하), 화계(병력·성벽 피해), 이간(적장 빼내기), 내응(3개월 안에 치면 적 사기 붕괴).</p><p>다가오는 <b>적 군단</b>에도 유언비어와 진영 화계를 걸 수 있다. 우리 성에 <b>매복</b>을 걸면 쳐들어오는 적의 사기가 꺾인다.</p>")}
  ${n("장수로 살 때","<p>주공이 <b>임무</b>를 준다. 성 공략 임무에는 <b>지원군과 부장</b>이 붙고 군량도 대 준다. 기한 안에 해내면 승진, 못 하면 신뢰가 떨어진다.</p><p>임무가 없어도 <b>알현</b>이나 출진 화면의 <b>지원 요청</b>으로 공략 허가를 받을 수 있다.</p><p>편장군 이상이면 태수가 되고, 장군이 되면 그 성에서 <b>독립</b>할 수 있다. 옆 성의 다른 세력으로 <b>망명</b>도 가능하다.</p>")}
  ${n("군주로 살 때","<p>성마다 <b>장정</b>이 달마다 조금씩 늘어난다. 징병은 장정 수만큼만 할 수 있다.</p><p>장수를 성에 <b>배치</b>하고 <b>태수</b>로 임명하면 그 성의 병력과 개발이 저절로 늘어난다. 인물 화면의 <b>빈 성에 자동 배치</b>도 쓸 수 있다.</p><p>출진은 그 성에 있는 장수만 지휘할 수 있으니, 공격할 성 옆에 강한 장수를 모아두자.</p>")}
  ${n("재야로 살 때","<p>성의 주인에게 <b>사관</b>하면 장수가 된다. 아니면 <b>의병</b>을 모아 주인 없는 성이나 약한 성을 치는 <b>거병</b>으로 스스로 군주가 된다.</p>")}
  ${n("인연·가문","<p>인물 화면에서 술자리·담론·무예 겨루기·선물로 인연을 쌓는다. 인연 60 이상인 장수는 전투를 돕고, 80 이상이면 의형제를 맺을 수 있다.</p><p>혼인하면 아이가 태어난다. 15세가 넘은 자식을 <b>후계</b>로 정해두면, 그대가 죽은 뒤 그 자식으로 이어서 플레이한다.</p>")}
  ${n("모드와 점수","<p><b>현실 모드</b>는 장수들이 역사 속 사망 연도 즈음에 떠나고, <b>가상 모드</b>는 전사하지 않으면 천수를 누린다. 47성 중 36성을 차지하면 천하통일. 280년이 되면 시대가 끝난다.</p>")}
