ao_magic",184,8,"장보의 요술","ye","장보가 요술로 바람과 우레를 부르자, 유비가 짐승의 피로 요술을 깨뜨린다.",["liubei","guanyu","zhangfei","zhujun","zhangbao_hj"]],["b184_wancheng",184,10,"완성 탈환","wn","손견이 맨 먼저 성벽에 올라 조홍(趙弘)을 베고, 한충과 손중도 전사한다.",["zhujun","liubei","sunjian","hanzhong","zhaohong","sunzhong"]],["e189_shichangshi",189,8,"십상시의 난","ly","하진이 십상시에게 살해되고, 원소·조조가 궁에 들어가 환관을 몰살한다. 동탁이 황제를 손에 넣는다.",[]],["e189_dingyuan",189,9,"여포의 배신","ly","이숙이 적토마와 황금으로 여포를 꾀어, 여포가 의부 정원을 죽이고 동탁의 수양아들이 된다.",[]],["e190_qixing",190,1,"칠성보도 암살 미수","ly","조조가 왕윤의 칠성보도로 동탁을 찌르려다 들켜 칼을 바치는 척하고 달아난다. 도중에 여백사 일가를 죽인다.",[]],["b190_sishui",190,2,"사수관 전투","ly","화웅이 포충·유섭·반봉을 베고 손견을 패주시켜 조무가 전사한다. 관우가 데운 술이 식기 전에 화웅을 벤다.",["sunjian","baozhong","guanyu","huaxiong","lisu","huzhen"]],["b190_hulao",190,3,"호뢰관 전투","ly","여포가 방열·목순을 베고 무안국의 팔을 자르며 공손찬을 쫓는다. 장비·관우·유비가 셋이서 여포와 싸워 물리친다.",["yuanshao","gongsunzan","liubei","guanyu","zhangfei","lvbu"]],["b190_xingyang",190,4,"형양 추격전","ly","장안으로 떠나는 동탁을 조조가 홀로 쫓다가 서영의 매복에 크게 진다. 조홍이 말을 내주어 조조가 산다.",["cao","xiahoudun","caohong","xurong"]],["e190_yuxi",190,4,"전국옥새","ly","불탄 낙양의 우물에서 손견이 전국옥새를 얻고 몰래 강동으로 돌아간다. 원소와 사이가 틀어진다.",[]],["b191_jieqiao",191,10,"반하 전투","py","문추에게 쫓기던 공손찬을 조운이 구하며 처음 등장한다. 국의가 엄강을 벤다. 유비가 와서 싸움을 멈춘다.",["yuanshao","wenchou","quyi","gongsunzan","yangang_gs","zhaoyun"]],["b191_xianshan",191,11,"현산 전투","xy","손견이 황조를 깨뜨리고 양양을 포위하지만, 괴량의 계책으로 여공이 현산에 매복해 손견이 돌과 화살에 맞아 전사한다.",["sunjian","sunce","chengpu","huanggai","hantang","huangzu","kuailiang","lvgong","chensheng","zhanghu"]],["e192_lianhuan",192,4,"연환계","ca","왕윤이 초선을 이용해 동탁과 여포 사이를 갈라놓고, 여포가 동탁을 죽인다.",[]],["b192_changan",192,6,"장안 함락","ca","가후의 권유로 이각·곽사가 장안을 공격한다. 여포는 패주하고 왕윤은 죽는다.",["lijue","guosi","zhangji","fanchou","lvbu","wangyun"]],["b194_changping",194,3,"장평관 전투","ca","열일곱 살 마초가 왕방을 베고 이몽을 사로잡지만, 장안 내응이 들통나 서량군이 물러난다.",["mateng","hansui","machao","wangfang","limeng"]],["b194_xuzhou",194,4,"서주 침공","xp","도겸의 부하 장개가 조조의 아버지 조숭을 죽이자 조조가 서주를 친다. 유비가 구원 오고, 여포가 연주를 습격해 조조가 물러난다.",["cao","xiahoudun","yujin","dianwei","taoqian","caobao","liubei","guanyu","zhangfei"]],["b194_beihai",194,5,"북해 구원","bh","포위된 공융을 위해 태사자가 홀로 포위를 뚫고 유비에게 구원을 청한다. 관우가 관해를 벤다.",["kongrong","taishici","liubei","guanyu","guanhai"]],["b194_puyang",194,8,"복양 전투","pu","진궁이 복양 부호 전씨를 시켜 거짓 내응을 약속한다. 성에 들어간 조조가 화공에 갇혀 크게 다치고 전위가 구해낸다.",["cao","dianwei","xiahoudun","yuejin","lidian","lvbu","chengong","gaoshun","zhangliao","zangba"]],["b195_dingtao",195,4,"정도 전투","pu","조조가 둑 뒤에 병사를 숨기고 부녀자를 내세워 여포를 꾀어낸 뒤 크게 이긴다. 여포는 연주를 잃고 유비에게 간다.",["cao","dianwei","xuchu","lvbu","chengong"]],["b195_xuchu",195,2,"허저 등용","rn","황건 잔당 하의·황소를 쫓던 중 조홍이 하만을 베고 이전이 황소를 사로잡는다. 하의를 붙잡은 허저와 전위가 겨루어 승부가 나지 않자 조조가 함정으로 허저를 잡아 등용한다.",["cao","dianwei","xuchu"]],["b195_shenting",195,6,"신정 일기토","jy","손책과 태사자가 신정에서 단둘이 맞붙어 서로 투구와 단극을 빼앗는다. 뒤에 손책이 태사자를 사로잡아 마음을 얻는다.",["sunce","chengpu","huanggai","hantang","taishici","liuyao"]],["b195_jiangdong",195,8,"강동 평정","wx","손책이 유요·착융·설례를 차례로 깨고, 엄백호와 왕랑을 몰아내 강동을 차지한다. 주태가 몸에 열두 군데 상처를 입고 손권을 구하고, 화타가 치료한다.",["sunce","zhouyu","zhoutai","jiangqin","chenwu","liuyao","zerong","xueli","yanbaihu","wanglang"]],["e195_xiandi_east",195,7,"헌제 동천","ly","이각·곽사가 서로 싸우는 틈에 양봉·한섬·동승이 헌제를 모시고 낙양으로 간다. 서황이 허저와 겨룬다(14회).",[]],["e196_xudu",196,8,"허도 천도","xc","조조가 헌제를 허도로 모셔 천자를 끼고 제후를 호령한다. 서황이 만총의 설득으로 조조에게 간다.",[]],["b196_xuyi",196,6,"우이 대치와 서주 상실","xp","유비가 원술군과 맞서는 동안, 서주를 지키던 장비가 술에 취해 조표를 때리고 조표가 여포를 끌어들여 서주를 잃는다.",["liubei","guanyu","jiling"]],["e196_yuanmen",196,9,"원문사극","xb","여포가 멀리 세운 극을 활로 맞히고 기령과 유비를 화해시킨다.",[]],["b197_wancheng",197,1,"완성 전투","wn","항복한 장수가, 조조가 숙부의 미망인 추씨를 취한 데 분노한다. 가후의 계책으로 호거아가 전위의 극을 훔치고 야습해 전위·조앙·조안민이 죽는다.",["zhangxiu","jiaxu","huchenger","cao","dianwei","caoang","caoanmin","yujin"]],["b197_sevenroutes",197,5,"원술 칠로군","xp","황제를 칭한 원술이 일곱 갈래로 서주를 친다. 진규·진등 부자가 한섬·양봉을 이간해 배반시키고 여포가 크게 이긴다.",["zhangxun","qiaorui","chenji_ys","leibo","chenlan","hanxian","yangfeng","lvbu","gaoshun","zhangliao","chengong","chendeng"]],["b197_shouchun",197,9,"수춘 토벌","sc","조조가 군량 부족을 감추려 군량관 왕후를 베어 사기를 다잡고 수춘을 함락한다. 원술은 회수를 건너 달아난다.",["cao","liubei","lvbu","sunce","lifeng","yuejiu","lianggang","chenji_ys"]],["b198_rangcheng",198,3,"양성 추격전","wn","가후는 처음엔 추격을 말리고, 장수가 지자 다시 추격하라 한다. 두 번째 추격은 크게 이긴다.",["zhangxiu","jiaxu","cao","xuchu"]],["b198_xiaopei",198,9,"소패 전투","xb","고순과 싸우던 하후돈이 조성의 화살에 왼눈을 맞자, 화살을 뽑아 눈알을 삼키고 조성을 벤다.",["gaoshun","caoxing","xiahoudun","liubei"]],["b198_xiapi",198,12,"하비 수공","xp","곽가·순유의 계책으로 사수와 기수를 터뜨려 하비를 물에 잠근다. 후성·송헌·위속이 여포를 묶어 바치고, 여포·진궁·고순은 백문루에서 처형된다. 장료는 항복한다.",["cao","liubei","guanyu","zhangfei","xiahoudun","guojia","xunyou","lvbu","chengong","gaoshun","zhangliao","houcheng","songxian","weixu"]],["e199_yidai",199,3,"의대조","xc","허전 사냥 뒤, 헌제가 옥대 속 밀서로 동승에게 조조 토벌을 명한다. 유비·마등이 서명한다.",[]],["b199_yijing",199,3,"역경 전투","bp","원소가 땅굴을 파 역경루를 무너뜨리고, 공손찬은 처자를 죽이고 스스로 불에 뛰어든다.",["yuanshao","yanliang","wenchou","zhanghe","gaolan","gongsunzan","gongsunxu","tiankai"]],["b199_yuanshu_end",199,6,"원술 최후","xp","원소에게 가려던 원술을 유비가 막는다. 장비가 기령을 베고, 원술은 꿀물 한 그릇을 찾다 피를 토하고 죽는다.",["liubei","guanyu","zhangfei","yuanshu","jiling"]],["b199_chezhou",199,8,"서주 탈취","xp","조조가 차주에게 유비를 죽이라 하지만 진등이 알리고, 관우가 차주를 벤다. 유비가 서주를 차지한다.",["liubei","guanyu","chendeng","chezhou"]],["b199_liudai",199,10,"유대·왕충 격파","xp","관우가 왕충을, 장비가 꾀를 써서 유대를 사로잡는다. 유비는 둘을 놓아준다.",["guanyu","zhangfei","liudai_cao","wangzhong"]],["b200_xuzhou",200,1,"서주 함락","xp","유비의 야습이 간파되어 크게 지고 삼형제가 흩어진다. 하비를 지키던 관우는 토산에서 세 가지 약속을 받고 조조에게 몸을 맡긴다.",["cao","zhangliao","xuhuang","xiahoudun","liubei","guanyu","zhangfei"]],["b200_baima",200,4,"백마 전투","pu","안량이 송헌·위속을 베고 서황을 물리친다. 관우가 적토마를 달려 만군 속에서 안량을 베고 머리를 가져온다.",["yanliang","cao","songxian","weixu","xuhuang","guanyu","zhangliao"]],["b200_yanjin",200,4,"연진 전투","pu","조조가 군량과 말을 미끼로 버려 문추군을 어지럽힌다. 문추가 장료·서황을 물리치지만 관우에게 베인다.",["wenchou","liubei","cao","zhangliao","xuhuang","guanyu"]],["e200_wuguan",200,6,"오관참육장","ly","유비의 소식을 들은 관우가 두 형수를 모시고 다섯 관문을 지나며 여섯 장수를 벤다.",[]],["e200_gucheng",200,7,"고성 재회","rn","장비가 관우를 의심하자, 관우가 쫓아온 채양을 북이 세 번 울리기 전에 벤다. 주창·관평이 합류하고 조운도 돌아온다.",[]],["e200_su   ${e("전투","<p>그대가 이끄는 군단이나 그대가 있는 성이 싸우면 직접 지휘한다. 먼저 <b>병종</b>을 고르고, 3합 동안 매 합 <b>전술</b>을 고른다.</p><p>병종 상성: <b>창병 › 기병 › 궁병 › 창병</b>. 수군은 강에서만 강하다. 기병은 평지, 궁병은 산지·관문, 창병은 관문에서 강하다.</p><p>전술 상성: <b>돌격 › 화공 › 방진 › 기습 › 돌격</b>. 기병+돌격, 궁병+화공, 창병+방진, 수군+화공은 시너지가 있다.</p><p><b>일기토</b>로 적의 사기를 꺾거나 적장을 사로잡을 수 있다. 바쁠 때는 <b>맡긴다</b>로 자동 전투를 한다.</p>")}
  ${e("정찰·계략·매복","<p>우리 땅과 맞닿지 않은 적 성은 병력이 <b>?</b>로 가려진다. <b>정찰</b>하면 6개월 동안 보인다.</p><p>적 성에 <b>계략</b>: 유언비어(병사 이탈·사기 저하), 화계(병력·성벽 피해), 이간(적장 빼내기), 내응(3개월 안에 치면 적 사기 붕괴).</p><p>다가오는 <b>적 군단</b>에도 유언비어와 진영 화계를 걸 수 있다. 우리 성에 <b>매복</b>을 걸면 쳐들어오는 적의 사기가 꺾인다.</p>")}
  ${e("장수로 살 때","<p>주공이 <b>임무</b>를 준다. 성 공략 임무에는 <b>지원군과 부장</b>이 붙고 군량도 대 준다. 기한 안에 해내면 승진, 못 하면 신뢰가 떨어진다.</p><p>임무가 없어도 <b>알현</b>이나 출진 화면의 <b>지원 요청</b>으로 공략 허가를 받을 수 있다.</p><p>편장군 이상이면 태수가 되고, 장군이 되면 그 성에서 <b>독립</b>할 수 있다. 옆 성의 다른 세력으로 <b>망명</b>도 가능하다.</p>")}
  ${e("군주로 살 때","<p>성마다 <b>장정</b>이 달마다 조금씩 늘어난다. 징병은 장정 수만큼만 할 수 있다.</p><p>장수를 성에 <b>배치</b>하고 <b>태수</b>로 임명하면 그 성의 병력과 개발이 저절로 늘어난다. 인물 화면의 <b>빈 성에 자동 배치</b>도 쓸 수 있다.</p><p>출진은 그 성에 있는 장수만 지휘할 수 있으니, 공격할 성 옆에 강한 장수를 모아두자.</p>")}
  ${e("재야로 살 때","<p>성의 주인에게 <b>사관</b>하면 장수가 된다. 아니면 <b>의병</b>을 모아 주인 없는 성이나 약한 성을 치는 <b>거병</b>으로 스스로 군주가 된다.</p>")}
  ${e("인연·가문","<p>인물 화면에서 술자리·담론·무예 겨루기·선물로 인연을 쌓는다. 인연 60 이상인 장수는 전투를 돕고, 80 이상이면 의형제를 맺을 수 있다.</p><p>혼인하면 아이가 태어난다. 15세가 넘은 자식을 <b>후계</b>로 정해두면, 그대가 죽은 뒤 그 자식으로 이어서 플레이한다.</p>")}
  ${e("모드와 점수","<p><b>현실 모드</b>는 장수들이 역사 속 사망 연도 즈음에 떠나고, <b>가상 모드</b>는 전사하지 않으면 천수를 누린다. 47성 중 36성을 차지하면 천하통일. 280년이 되면 시대가 끝난다.</p>")}
