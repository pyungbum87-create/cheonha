이 적토마와 황금으로 여포를 꾀어, 여포가 의부 정원을 죽이고 동탁의 수양아들이 된다.",[],[]],["e190_qixing",190,1,"칠성보도 암살 미수","ly","조조가 왕윤의 칠성보도로 동탁을 찌르려다 들켜 칼을 바치는 척하고 달아난다. 도중에 여백사 일가를 죽인다.",[],[]],["b190_sishui",190,2,"사수관 전투","ly","화웅이 포충·유섭·반봉을 베고 손견을 패주시켜 조무가 전사한다. 관우가 데운 술이 식기 전에 화웅을 벤다.",["sunjian","baozhong","guanyu","huaxiong","lisu","huzhen"],[["baozhong","huaxiong","포충 전사"],["yushe","huaxiong","유섭 전사"],["panfeng","huaxiong","반봉 전사"],["guanyu","huaxiong","관우 승리, 화웅 전사"]]],["b190_hulao",190,3,"호뢰관 전투","ly","여포가 방열·목순을 베고 무안국의 팔을 자르며 공손찬을 쫓는다. 장비·관우·유비가 셋이서 여포와 싸워 물리친다.",["yuanshao","gongsunzan","liubei","guanyu","zhangfei","lvbu"],[["fangyue","lvbu","방열 전사"],["mushun","lvbu","목순 전사"],["wuanguo","lvbu","무안국 팔 잘림"],["gongsunzan","lvbu","공손찬 도주"],["zhangfei","lvbu","장비·관우·유비 협공, 여포 퇴각"]]],["b190_xingyang",190,4,"형양 추격전","ly","장안으로 떠나는 동탁을 조조가 홀로 쫓다가 서영의 매복에 크게 진다. 조홍이 말을 내주어 조조가 산다.",["cao","xiahoudun","caohong","xurong"],[["xiahoudun","xurong","하후돈 승리, 서영 전사"]]],["e190_yuxi",190,4,"전국옥새","ly","불탄 낙양의 우물에서 손견이 전국옥새를 얻고 몰래 강동으로 돌아간다. 원소와 사이가 틀어진다.",[],[]],["b191_jieqiao",191,10,"반하 전투","py","문추에게 쫓기던 공손찬을 조운이 구하며 처음 등장한다. 국의가 엄강을 벤다. 유비가 와서 싸움을 멈춘다.",["yuanshao","wenchou","quyi","gongsunzan","yangang_gs","zhaoyun"],[["zhaoyun","wenchou","50~60합, 승부 없음"],["quyi","yangang_gs","국의 승리, 엄강 전사"]]],["b191_xianshan",191,11,"현산 전투","xy","손견이 황조를 깨뜨리고 양양을 포위하지만, 괴량의 계책으로 여공이 현산에 매복해 손견이 돌과 화살에 맞아 전사한다.",["sunjian","sunce","chengpu","huanggai","hantang","huangzu","kuailiang","lvgong","chensheng","zhanghu"],[["hantang","zhanghu","한당 승리, 장호 전사"],["sunce","chensheng","손책이 활로 진생을 쏨"]]],["e192_lianhuan",192,4,"연환계","ca","왕윤이 초선을 이용해 동탁과 여포 사이를 갈라놓고, 여포가 동탁을 죽인다.",[],[]],["b192_changan",192,6,"장안 함락","ca","가후의 권유로 이각·곽사가 장안을 공격한다. 여포는 패주하고 왕윤은 죽는다.",["lijue","guosi","zhangji","fanchou","lvbu","wangyun"],[]],["b194_changping",194,3,"장평관 전투","ca","열일곱 살 마초가 왕방을 베고 이몽을 사로잡지만, 장안 내응이 들통나 서량군이 물러난다.",["mateng","hansui","machao","wangfang","limeng"],[["machao","wangfang","마초 승리, 왕방 전사"],["machao","limeng","마초가 이몽 생포"
