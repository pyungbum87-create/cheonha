<title>团团小镇闹哄哄</title>
<style>
:root{--ink:#5b3520;--chili:#e8524a;--jade:#4fae6a;--gold:#f2b52c;--dough:#fff7e8;--ui:'PingFang SC','Hiragino Sans GB','Noto Sans SC','Microsoft YaHei',sans-serif;color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#fbefdc;color:var(--ink);font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#cv{position:fixed;left:0;top:0;touch-action:none}
#insProbe{position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font-family:var(--ui);cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--chili);outline-offset:2px}
.btn{font-size:19px;font-weight:900;padding:13px 24px;border-radius:999px;border:3px solid var(--ink);background:var(--dough);box-shadow:0 5px 0 var(--ink)}
.btn.red{background:linear-gradient(#ff6f5f,#e8524a);color:#fff;box-shadow:0 5px 0 #b8352e,0 5px 0 2px var(--ink)}
.btn.blue{background:linear-gradient(#6fb5ff,#3b86e0);color:#fff;box-shadow:0 5px 0 #2a5ea0,0 5px 0 2px var(--ink)}
.btn:active,.ab:active,.lv:active{transform:translateY(3px)}
/* home */
#home{position:fixed;inset:0;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 20px);box-sizing:border-box;
  background:radial-gradient(circle at 50% 0,#fff3dd,#f7dfbd)}
.logo{text-align:center;margin:10px 0 18px}
.logo img{height:110px;animation:bob 2.4s ease-in-out infinite}
.logo h1{margin:4px 0 0;font-size:clamp(32px,9vw,42px);font-weight:900;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);letter-spacing:.04em}
.logo p{margin:6px 0 0;font-weight:800;font-size:14px}
@keyframes bob{50%{transform:translateY(-6px)}}
#lvList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:440px;margin:0 auto}
.lv{display:flex;flex-direction:column;gap:6px;padding:8px 8px 10px;border-radius:16px;border:3px solid var(--ink);background:#fff;box-shadow:0 4px 0 var(--ink);text-align:center}
.lv .th{aspect-ratio:1;border-radius:10px;background:#efd9b8 center/cover;display:grid;place-items:center}
.lv.lock .th{background-image:none!important;background:repeating-linear-gradient(45deg,#efd9b8 0 10px,#f6e6cc 10px 20px)}
.lv .th span{font-weight:900;font-size:13px;background:#fff;border-radius:999px;padding:3px 10px}
.lv b{font-size:15px}
.ss{display:flex;justify-content:center;gap:4px}.ss em,.st{display:block;width:18px;height:18px;background:#e6d3b6;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.ss em.on,.st.on{background:var(--gold)}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#bSnd{position:absolute;right:14px;top:calc(env(safe-area-inset-top,0px) + 12px);width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:#fff;font-size:18px;font-weight:900}
#bSnd.off{opacity:.45}
/* play */
#playUI{position:fixed;inset:0;pointer-events:none}
#playUI>*{pointer-events:auto}
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;display:flex;align-items:center;gap:10px}
#bBack{width:42px;height:42px;border-radius:12px;border:3px solid var(--ink);background:linear-gradient(#ffd86b,#f2b52c);font-size:20px;font-weight:900;box-shadow:0 3px 0 var(--ink)}
.mt{flex:1;min-width:0;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:5px 10px}
#mTitle{font-weight:900;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;align-items:center;gap:8px;margin-top:4px}
#mBar{flex:1;height:10px;border-radius:5px;background:#eee;border:2px solid var(--ink);overflow:hidden}
#mBar::after{content:"";display:block;height:100%;width:var(--p,0%);background:var(--gold);transition:width .3s}
#mProg{font-weight:900;font-size:13px;color:var(--chili);font-variant-numeric:tabular-nums}
#mTime{min-width:52px;text-align:center;font-weight:900;font-size:18px;color:#fff;background:var(--jade);border:3px solid var(--ink);border-radius:999px;padding:6px 4px;font-variant-numeric:tabular-nums}
#mTime.low{background:var(--chili);animation:sh .5s infinite}
#chips{position:absolute;left:12px;right:12px;top:calc(var(--sceneBot,500px) + 10px);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;pointer-events:none}
.chip{font-size:13px;font-weight:900;padding:5px 10px;border-radius:999px;background:#fff;border:2px dashed #d7b68f;color:#b49272}
.chip.q{min-width:12px;padding:4px 8px;text-align:center;border-radius:14px 14px 10px 10px;background:#fff7e8}
@media (max-height:700px){.chip{font-size:12px;padding:3px 8px}.chip.q{padding:3px 7px}}
.chip.ok{background:#e5f4e4;border:2px solid var(--jade);color:#2f7a45}
.chip.ok::before{content:"✓ "}
/* bottom: three bamboo steamers on the shop counter (our own look) */
.bar{position:absolute;left:0;right:0;bottom:0;height:calc(env(safe-area-inset-bottom,0px) + 98px);display:flex;justify-content:center;align-items:flex-start;gap:clamp(14px,6vw,34px);padding-top:12px;box-sizing:border-box;
  background:linear-gradient(#c98a4e 0 8px,#a8693a 8px 11px,#e7b27a 11px,#d99a5e)}
.bar::before{content:"";position:absolute;left:0;right:0;top:-6px;height:8px;background:repeating-linear-gradient(90deg,#e8524a 0 22px,#f2b52c 22px 30px);border-top:2px solid var(--ink)}
.ab{position:relative;width:78px;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.ab .st2{position:relative;width:66px;height:52px}
.ab .lidd{position:absolute;left:4px;right:4px;top:0;height:24px;border:3px solid var(--ink);border-radius:40px 40px 10px 10px;
  background:repeating-linear-gradient(90deg,#f6d79a 0 5px,#e9c27e 5px 7px);box-shadow:inset 0 -4px 0 #d9a960}
.ab .lidd::before{content:"";position:absolute;left:50%;top:-8px;width:16px;height:8px;margin-left:-8px;border:3px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;background:#f6d79a}
.ab .base{position:absolute;left:0;right:0;bottom:0;height:30px;border:3px solid var(--ink);border-radius:10px 10px 16px 16px;
  background:repeating-linear-gradient(0deg,#e9c27e 0 5px,#f6d79a 5px 9px);display:grid;place-items:center;box-shadow:0 4px 0 var(--ink)}
.ab svg{width:24px;height:24px}
.ab .nm{margin-top:6px;font-size:12px;font-weight:900;color:#fff;background:var(--chili);border:2px solid var(--ink);border-radius:8px;padding:2px 8px;white-space:nowrap}
.ab small{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;padding:0 4px;box-sizing:border-box;border-radius:999px;border:2px solid var(--ink);background:#fff;color:var(--chili);font-size:11px;font-weight:900;display:grid;place-items:center;transform:rotate(8deg)}
.ab:active .lidd{transform:translateY(-7px) rotate(-6deg)}
.ab .puff{position:absolute;left:50%;top:-14px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#fff;opacity:0}
.ab.ready .puff{animation:puff 1.6s ease-out infinite}
@keyframes puff{0%{opacity:.85;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-22px) scale(2.4)}}
/* sheets */
.sheet{position:fixed;inset:0;background:rgba(60,32,16,.5);display:flex;align-items:center;justify-content:center;z-index:5;padding:16px;box-sizing:border-box}
.card{width:min(340px,100%);background:var(--dough);border:3px solid var(--ink);border-radius:26px;padding:20px 18px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;text-align:center;animation:pop .25s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:.3}}
.card h2{margin:0;font-size:24px;font-weight:900}.card img{width:110px;align-self:center;margin-top:-70px}
.sub{font-size:14px;color:#8a5a3a;margin:0}
#wStars{display:flex;justify-content:center;gap:10px}#wStars .st{width:46px;height:46px;transform:scale(0);animation:stin .4s forwards}
@keyframes stin{to{transform:scale(1)}}
#ad .card{background:#2b2b38;color:#fff;border-color:#000}#adN{font-size:48px;font-weight:900}
@media (prefers-reduced-motion:reduce){.logo img,.card,#mTime.low{animation:none}#wStars .st{transform:none;animation:none}}
</style>
<div id="insProbe"></div>
<canvas id="cv" aria-label="团团小镇闹哄哄"></canvas>
<main id="home"><button id="bSnd" aria-label="声音">♪</button>
  <div class="logo"><img src="art/tuantuan.webp" alt=""><h1>团团小镇闹哄哄</h1><p>帮小镇的朋友们解决麻烦吧!</p></div>
  <div id="lvList"></div></main>
<section id="playUI" hidden>
  <div class="top"><button id="bBack" aria-label="返回">←</button><div class="mt"><div id="mTitle"></div><div class="pr"><div id="mBar"></div><span id="mProg">0/6</span></div></div><div id="mTime">180s</div></div>
  <div id="chips"></div>
  <div class="bar"><button class="ab" id="bTime" aria-label="加时"><span class="st2"><i class="lidd"></i><i class="base"><svg viewBox="0 0 32 32" fill="none" stroke="#5b3520" stroke-width="2.6" stroke-linecap="round"><path d="M9 26c-3-4 3-6 0-10s3-6 0-10"/><path d="M16 26c-3-4 3-6 0-10s3-6 0-10"/><path d="M23 26c-3-4 3-6 0-10s3-6 0-10"/></svg></i><i class="puff"></i></span><b class="nm">多蒸一会</b><small>▶</small></button><button class="ab ready" id="bHint" aria-label="提示"><span class="st2"><i class="lidd"></i><i class="base"><svg viewBox="0 0 32 32" fill="none" stroke-linecap="round"><path d="M6 27L25 5" stroke="#5b3520" stroke-width="3.2"/><path d="M11 29L29 10" stroke="#5b3520" stroke-width="3.2"/><circle cx="24" cy="7" r="3.2" fill="#e8524a" stroke="#5b3520" stroke-width="1.6"/></svg></i><i class="puff"></i></span><b class="nm">筷子指路</b><small>3</small></button><button class="ab" id="bSkip" aria-label="跳过"><span class="st2"><i class="lidd"></i><i class="base"><svg viewBox="0 0 32 32" fill="none" stroke="#5b3520" stroke-width="2.4" stroke-linejoin="round"><path d="M7 13h18l-3 14H10z" fill="#fff"/><path d="M7 13l4-5h10l4 5" fill="#fff"/><path d="M12 8c0-4 8-4 8 0"/><path d="M13 19h6" stroke="#e8524a"/></svg></i><i class="puff"></i></span><b class="nm">打包带走</b><small>▶</small></button></div>
</section>
<section class="sheet" id="timeup" hidden><div class="card"><img src="art/tuantuan.webp" alt=""><h2>时间到啦</h2><p class="sub">已经完成 <b id="tuN">0/6</b>，再给一点时间吧?</p>
  <button class="btn blue" id="tuMore">▶ 看广告 +60 秒</button><button class="btn" id="tuRetry">重新开始</button><button class="btn" id="tuHome">回到首页</button></div></section>
<section class="sheet" id="win" hidden><div class="card"><img src="art/tt_cheer.webp" alt=""><h2>完成啦!</h2><div id="wStars"></div><p class="sub">用时 <b id="wTime">0s</b></p>
  <button class="btn red" id="wNext">下一关</button><button class="btn" id="wHome">回到首页</button></div></section>
<section class="sheet" id="ad" hidden><div class="card"><p id="adLabel">广告</p><div id="adN">3</div><p class="sub" style="color:#aaa">广告位 · 正式上线后接入平台广告</p></div></section>
