<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>html,body{margin:0;height:100%;background:#141c26;overflow:hidden;touch-action:none;overscroll-behavior:none;display:flex;align-items:center;justify-content:center;font-family:sans-serif}
canvas{display:block;height:min(100dvh,177.78vw);width:min(100vw,56.25dvh);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}</style>
<title>실험 B · 이어서 터뜨리는 수비</title></head><body><canvas id="c" width="450" height="800"></canvas><script>
/* 회색 박스 실험 B: 같은 색 적을 손가락으로 이어서 한꺼번에 터뜨리는 수비. 도형만 사용. */
const c=document.getElementById('c'),g=c.getContext('2d'),W=450,H=800,WALL=704,GAP=72,R=29;
const COLS=['#ff6b6b','#4dabf7','#ffd43b','#69db7c','#b197fc'];let S,uid=1;
function reset(){S={t:0,en:[],rowY:0,wall:12,score:0,chain:[],down:false,px:0,py:0,fx:[],over:false,best:+(localStorage.labB||0),maxChain:0,msg:null};spawnRow(-40);spawnRow(-40-GAP);spawnRow(-40-GAP*2);}
const speed=()=>Math.min(48,15+S.t*.16);
function spawnRow(y){const nc=S.t>100?5:S.t>35?4:3;for(let i=0;i<6;i++){if(Math.random()<.12)continue;const stone=S.t>45&&Math.random()<.1;S.en.push({id:uid++,x:45+i*GAP,y,col:stone?-1:Math.random()*nc|0,pop:0});}}
function step(dt){
  if(S.over)return;S.t+=dt;const v=speed()*(S.down?.45:1)*dt;   // 손가락을 대고 있는 동안은 느려져서 생각할 틈이 생긴다
  let top=1e9;for(const e of S.en){e.y+=v;top=Math.min(top,e.y);if(e.y>=WALL-R&&!e.dead){e.dead=true;S.wall--;S.fx.push({x:e.x,y:WALL,t:0,col:'#fff',r:40});S.chain=S.chain.filter(q=>q!==e);}}
  S.en=S.en.filter(e=>!e.dead);if(top>-40+GAP||!S.en.length)spawnRow(Math.min(-40,top-GAP));
  for(const f of S.fx)f.t+=dt;S.fx=S.fx.filter(f=>f.t<.35);if(S.msg&&(S.msg.t-=dt)<=0)S.msg=null;
  if(S.wall<=0){S.over=true;S.overAt=performance.now();if(S.score>S.best){S.best=S.score;try{localStorage.labB=S.score;}catch(e){}}}
}
const near=(a,b)=>(a.x-b.x)**2+(a.y-b.y)**2<(GAP*1.5)**2;
function at(x,y){let b=null,bd=38*38;for(const e of S.en){const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;b=e;}}return b;}
function touch(x,y){S.px=x;S.py=y;const e=at(x,y);if(!e||e.col<0)return;const ch=S.chain;
  if(!ch.length){ch.push(e);return;}const last=ch[ch.length-1];if(e===last)return;
  if(ch.length>1&&e===ch[ch.length-2]){ch.pop();return;}                      // 되돌아가면 취소
  if(ch.includes(e)||e.col!==ch[0].col||!near(e,last))return;ch.push(e);}
function release(){const ch=S.chain;S.chain=[];S.down=false;if(ch.length<2)return;
  let kill=new Set(ch);const col=ch[0].col;
  if(ch.length>=5){for(const e of S.en)if(e.col===col)kill.add(e);S.msg={s:ch.length+'연결! 같은 색 전부 번개',t:1.2};}                // 5개 이상: 화면의 같은 색 전부
  for(const e of [...kill])for(const o of S.en)if(o.col<0&&near(o,e)&&(o.x-e.x)**2+(o.y-e.y)**2<(GAP*1.2)**2)kill.add(o);   // 옆의 돌도 같이 부서진다
  for(const e of kill){e.dead=true;S.fx.push({x:e.x,y:e.y,t:0,col:e.col<0?'#adb5bd':COLS[e.col],r:R+14});}
  S.score+=kill.size*kill.size;S.maxChain=Math.max(S.maxChain,ch.length);S.en=S.en.filter(e=>!e.dead);}
function T(s,x,y,sz,col,al){g.font='bold '+sz+'px sans-serif';g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=col||'#fff';g.fillText(s,x,y);}
function draw(){
  g.fillStyle='#22303f';g.fillRect(0,0,W,H);g.fillStyle='#3d5068';g.fillRect(0,WALL,W,H-WALL);g.fillStyle='#c9a15f';g.fillRect(0,WALL,W,14);
  const ch=S.chain;
  for(const e of S.en){const inC=ch.includes(e);g.fillStyle=e.col<0?'#868e96':COLS[e.col];g.beginPath();g.arc(e.x,e.y,inC?R+4:R,0,7);g.fill();if(inC){g.strokeStyle='#fff';g.lineWidth=5;g.stroke();}
    g.fillStyle='rgba(0,0,0,.55)';if(e.col>=0){g.beginPath();g.arc(e.x-9,e.y-4,4,0,7);g.arc(e.x+9,e.y-4,4,0,7);g.fill();}else T('돌',e.x,e.y,16,'rgba(0,0,0,.5)');}
  if(ch.length){g.strokeStyle='#fff';g.lineWidth=8;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(ch[0].x,ch[0].y);for(const e of ch)g.lineTo(e.x,e.y);g.lineTo(S.px,S.py);g.stroke();
    T(ch.length,S.px,S.py-52,ch.length>=5?46:34,ch.length>=5?'#ffd43b':ch.length>=2?'#fff':'#868e96');}
  for(const f of S.fx){g.globalAlpha=1-f.t/.35;g.strokeStyle=f.col;g.lineWidth=5;g.beginPath();g.arc(f.x,f.y,f.r*(.5+f.t*2),0,7);g.stroke();g.globalAlpha=1;}
  for(let i=0;i<12;i++){g.fillStyle=i<S.wall?'#ff6b6b':'#44566b';g.fillRect(14+i*19,736,15,20);}T('방파제',14,774,14,'#9fb3c8','left');
  T(S.score,436,744,30,'#fff','right');T('최고 '+S.best+' · 최장 '+S.maxChain+'연결',436,776,14,'#9fb3c8','right');
  if(S.t<9){T('같은 색을 손가락으로 이어요 (2개부터)',225,560,19);T('길게 이을수록 점수가 크고, 5개면 같은 색 전부!',225,590,16,'#cfe0f0');T('대각선도 이어져요 · 누르고 있으면 느려져요',225,616,16,'#cfe0f0');}
  if(S.msg)T(S.msg.s,225,300,26,'#ffd43b');
  if(S.over){g.fillStyle='rgba(0,0,0,.72)';g.fillRect(0,0,W,H);T('방파제가 무너졌어요',225,320,32);T('점수 '+S.score+' · 최고 '+S.best,225,372,20,'#ffd43b');T('화면을 누르면 다시',225,430,20,'#9fb3c8');}
}
function P(e){const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
c.addEventListener('pointerdown',e=>{e.preventDefault();if(S.over){if(performance.now()-S.overAt>700)reset();return;}const p=P(e);S.down=true;S.chain=[];touch(p.x,p.y);});
addEventListener('pointermove',e=>{if(S.down&&!S.over){const p=P(e);touch(p.x,p.y);}});addEventListener('pointerup',()=>{if(S.down)release();});addEventListener('pointercancel',()=>{S.chain=[];S.down=false;});
let last=0,acc=0;function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;acc+=dt;while(acc>=1/60){step(1/60);acc-=1/60;}draw();requestAnimationFrame(loop);}
reset();requestAnimationFrame(loop);window.__lab={get S(){return S;},touch,release,step,reset};
</script></body></html>
