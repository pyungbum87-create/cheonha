()*.4,r:(1+R()*2)*Math.max(.5,s)})}\n\n/* ================= UPDATE ================= */\nfunction update(dt){\n G.t+=dt;\n if(G.slowT>0){G.slowT-=dt}\n if(G.whip>0)G.whip=Math.max(0,G.whip-dt*3);\n switch(G.state){\n  case 'charge':{const hh=hotAt(castDist(G.charge),G.aim);if(hh&&hh!==G.aimHot){buzz(10);SFX.click()}G.aimHot=hh}G.charge+=dt*.8*G.cdir;if(G.charge>=1){G.charge=1;G.cdir=-1}if(G.charge<=0){G.charge=0;G.cdir=1}break;\n  case 'flight':G.fl+=dt/G.flDur;if(G.fl>=1)landFloat();break;\n  case 'wait':\n   G.wait+=dt;\n   if(G.nibs.length&&G.wait>=G.nibs[0]){G.nibs.shift();G.dip=1;const p=proj(G.floatD,G.lat);ring(p.x,p.y,p.s,.5);SFX.nib();buzz(8)}\n   if(G.fakes.length&&G.wait>=G.fakes[0]){G.fakes.shift();G.dip=2.6;const p=proj(G.floatD,G.lat);ring(p.x,p.y,p.s,1);SFX.nib();SFX.nib();buzz(25)}\n   if(G.wait>=G.biteAt){G.win=G.winMax=DF().win*flo()[1]/100;setState('bite');useBait();const p=proj(G.floatD,G.lat);ring(p.x,p.y,p.s,1.6);SFX.plop();buzz(70);G.shake=2;if((S.tips.bite||0)<3){callout('지금!','',600);S.tips.bite=(S.tips.bite||0)+1}}\n   break;\n  case 'bite':G.win-=dt;if(G.win<=0){toast('놓쳤어요. 찌가 다시 떠올랐어요');G.wait=0;G.fish=pickFish();G.biteAt=2+R()*5;schedNibs();setState('wait')}break;\n  case 'fight':updateFight(dt);break;\n  case 'land':G.land+=dt;if(G.land<1.3&&R()<dt*(18+(G.lv|0)*10)){const P=landPose();G.drops.push({x:P.x+(R()-.5)*P.Lp*.22,y:P.y+P.Lp*(.25+R()*.75),vx:(R()-.5)*30,vy:30+R()*50,life:0,max:.7+R()*.4,r:(1+R()*2)*K})}if(G.land>(G.landDur||1.6))showResult();break;\n  case 'fail':G.failT+=dt;if(G.failT>1.6)setState('idle');break;\n  case 'retrieve':G.floatD-=dt*14;G.lat*=Math.pow(.2,dt);G.reelAng+=dt*8;G.clk+=dt*16;while(G.clk>=1){G.clk--;SFX.click()}if(G.floatD<2.5){setState('idle')}break;\n }\n G.dip=Math.max(0,G.dip-dt*(G.dip>1.2?3:4));\n G.flash=Math.max(0,G.flash-dt*4);G.zoom=Math.max(0,G.zoom-dt*.25);\n for(const b of G.bub){b.life+=dt;b.y-=dt*8;b.x+=Math.sin(b.life*9)*.3}G.bub=G.bub.filter(b=>b.life<b.max);\n if(G.wx==='rain'){for(const end.y-tip.y,l=Math.hypot(dx,dy)||1,len=Math.hypot(G.base.x-G.rest.x,G.base.y-G.rest.y);tip.x+=dx/l*len*.2*T-len*.05*T;tip.y+=dy/l*len*.19*T+len*.22*T}\n if(G.state==='fight'){const k=Math.max(0,G.F.T-.45)*9;tip.x+=(R()-.5)*k;tip.y+=(R()-.5)*k;if(G.F.mode==='run')tip.y+=Math.sin(G.t*9)*4}\n if(!G.tv)G.tv={x:0,y:0};if(!G.tip.x){G.tip.x=tip.x;G.tip.y=tip.y}{const kk=200,cc=14;G.tv.x+=((tip.x-G.tip.x)*kk-G.tv.x*cc)*dt;G.tv.y+=((tip.y-G.tip.y)*kk-G.tv.y*cc)*dt;G.tip.x+=G.tv.x*dt;G.tip.y+=G.tv.y*dt}\n}\nfunction lineEnd(){\n const s=G.state;\n if(s==='flight'){const q=G.fl;return{x:lerp(G.flFrom.x,G.flTo.x,q),y:lerp(G.flFrom.y,G.flTo.y,q)-Math.sin(q*Math.PI)*H*.28,s:lerp(1,proj(G.castD,0).s,q),air:1}}\n if(s==='wait'||s==='bite'||s==='retrieve'){const p=proj(G.floatD,G.lat);return p}\n if(s==='fight'){const p=proj(G.F.D,G.F.x);if(G.F.mode==='jump'){const q=clamp((G.F.jp-.08)/.8,0,1);p.y-=Math.sin(q*Math.PI)*H*.18*Math.max(.35,p.s)}return p}\n if(s==='land'){const P=landPose();return{x:P.x,y:P.y,s:1}}\n return null;\n}\n\n/* ================= RENDER ================= */\nfunction drawWater(t){\n const hy=G.hzY,wh=H-hy,s=SP;\n ctx.save();ctx.lineCap='round';\n for(let i=0;i<5;i++){const ph=(t*.03+i/5)%1,z=ph*ph,y=hy+z*wh,hh=5+z*wh*.2,a=.085*Math.sin(ph*Math.PI);const g=ctx.createLinearGradient(0,y,0,y+hh);g.addColorStop(0,`rgba(${s.shim},0)`);g.addColorStop(.45,`rgba(${s.shim},${a})`);g.addColorStop(.55,`rgba(0,0,0,${a*.7})`);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,y,W,hh)}\n for(let i=0;i<46;i++){const k=i/46,z=Math.pow(k,1.8),y=hy+3+z*wh,a=.05+.15*k,lw=.6+1.9*k,n=3+(i*7)%4,sp=(W+240)/n,seg=[];\n  for(let j=0;j<n;j++){let x=(j*sp+i*97+t*(6+16*k)*(i%2?1:-1))%(W+240);if(x<0)x+=W+240;x-=120;const len=(18+78*k)*(.55+.45*Math.sin(t*1.1+i*1.3+j)),yy=y+Math.sin(t*1.8+x*.02+i)*k*2.5;seg.push(x,yy,len)}\n  ctx.lineWidth=lw;ctx.strokeStyle=`rgba(0,8,16,${a*.75})`;ctx.beginPath();for(let q=0;q<seg.length;q+=3){const x=seg[q],yy=seg[q+1]+lw*1.1,l=seg[q+2];ctx.moveTo(x+l*.1,yy);ctx.quadraticCurveTo(x+l*.55,yy+lw*1.2,x+l*1.05,yy)}ctx.stroke();\n  ctx.strokeStyle=`rgba(${s.shim},${a})`;ctx.beginPath();for(let q=0;q<seg.length;q+=3){const x=seg[q],yy=seg[q+1],l=seg[q+2];ctx.moveTo(x,yy);ctx.quadraticCurveTo(x+l*.5,yy-lw*1.3,x+l,yy)}ctx.stroke()}\n // sun / moon glitter path\n const su=s.sun;ctx.globalCompositeOperation='lighter';\n const sx=su.x*W;for(let i=0;i<40;i++){const k=i/40,z=Math.pow(k,1.4),y=hy+2+z*wh*.88,fl=Math.abs(Math.sin(t*2.2+i*1.9)),w=(6+96*z)*(.3+.7*fl),hh=1+2.6*z;ctx.fillStyle=`rgba(${su.g},${(.34*(1-k)+.05)*(su.moon?.8:1)})`;ctx.beginPath();ctx.ellipse(sx+Math.sin(t*.9+i)*5*z,y,w/2,hh/2+.4,0,0,7);ctx.fill();\n  if(i%5===2&&fl>.82){const gx=sx+Math.sin(i*7.3+Math.floor(t*1.5))*w*.5,q=(2+5*z)*(fl-.82)*5.5;ctx.fillStyle=`rgba(255,255,255,${.7*(1-k*.5)})`;ctx.fillRect(gx-q,y-.4,q*2,.8);ctx.fillRect(gx-.4,y-q,.8,q*2)}}\n if(s.amb==='lamps'){const g=ctx.createRadialGradient(W*.5,H*1.05,0,W*.5,H*1.05,H*.55);const fl=.85+.15*Math.sin(t*9)*Math.sin(t*3.1);g.addColorStop(0,`rgba(90,255,180,${.3*fl})`);g.addColorStop(1,'rgba(90,255,180,0)');ctx.fillStyle=g;ctx.fillRect(0,hy,W,wh)}\n if(s.amb==='glint'){for(let i=0;i<14;i++){const ph=(t*.7+i*.37)%1;const r=mul(i*31+Math.floor(t*.7+i*.37));const p=proj(3+r()*40,(r()-.5)*1.6);const a=Math.sin(ph*Math.PI);ctx.fillStyle=`rgba(255,255,240,${a*.8})`;const z=1+2*p.s;ctx.fillRect(p.x-z*3,p.y,z*6,.8);ctx.fillRect(p.x-.4,p.y-z*2,.8,z*4)}}\n ctx.restore();\n}\nfunction drawMist(t){\n if(SP.amb!=='mist')return;ctx.save();\n for(let i=0;i<4;i++){const y=G.hzY+H*(.0+i*.035),x=((t*(6+i*3)+i*W*.4)%(W*1.6))-W*.3;const g=ctx.createRadialGradient(x,y,0,x,y,W*.45);g.addColorStop(0,'rgba(240,220,230,.2)');g.addColorStop(1,'rgba(240,220,230,0)');ctx.fillStyle=g;ctx.save();ctx.translate(0,y);ctx.scale(1,.18);ctx.translate(0,-y);ctx.fillRect(x-W*.45,y-W*.45,W*.9,W*.9);ctx.restore()}\n ctx.restore();\n}\nfunction drawRain(){if(G.wx!=='rain')return;ctx.save();ctx.fillStyle='rgba(20,30,45,.22)';ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(210,225,240,.35)';ctx.lineWidth=1;ctx.beginPath();for(const d of G.rain){ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+d.l*.18,d.y-d.l)}ctx.stroke();ctx.restore()}\nfunction drawFog(){if(G.wx!=='fog')return;ctx.save();const g=ctx.createLinearGradient(0,G.hzY-H*.18,0,H);g.addColorStop(0,'rgba(225,225,235,0)');g.addColorStop(.25,'rgba(225,225,235,.55)');g.addColorStop(.6,'rgba(225,225,235,.18)');g.addColorStop(1,'rgba(225,225,235,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore()}\nfunction drawBub(){ctx.save();ctx.strokeStyle='rgba(230,245,255,.6)';ctx.lineWidth=.8;for(const b of G.bub){ctx.globalAlpha=1-b.life/b.max;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.stroke()}ctx.restore()}\nfunction drawFlies(t){if(!G.flies.length)return;ctx.save();for(const f of G.flies){const fl=Math.sin(t*60+f.ph)*.5+.5;ctx.fillStyle=`rgba(225,240,255,${.3+fl*.3})`;ctx.beginPath();ctx.ellipse(f.x+2,f.y-3.5,2.2,8,.25+fl*.25,0,7);ctx.ellipse(f.x-1,f.y-3.5,2,7,-.25-fl*.25,0,7);ctx.fill();ctx.strokeStyle='#3a1f18';ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(f.x-10,f.y);ctx.lineTo(f.x+4,f.y);ctx.stroke();ctx.fillStyle='#5a2a1c';ctx.beginPath();ctx.arc(f.x+5,f.y,1.8,0,7);ctx.fill()}ctx.restore()}\nfunction drawBait(){const b=G.bait;if(!b)return;const p=proj(b.d,b.lat),q=b.t/.55,L=Math.max(5,16*p.s);ctx.save();ctx.translate(p.x+b.dir*q*14*p.s,p.y-Math.sin(q*Math.PI)*28*p.s);ctx.rotate(b.dir*(q-.5)*1.6);ctx.fillStyle='rgba(200,215,225,.85)';ctx.beginPath();ctx.ellipse(0,0,L*.5,L*.16,0,0,7);ctx.fill();ctx.restore()}\nfunction drawRings(){ctx.save();for(const r of G.rings){const a=(1-r.life/r.max)*.55;ctx.strokeStyle=`rgba(255,255,255,${a})`;ctx.lineWidth=Math.max(.6,1.4*r.s);ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.3,0,0,7);ctx.stroke()}ctx.restore()}\nfunction drawDrops(){ctx.save();ctx.fillStyle='rgba(235,248,255,.85)';for(const d of G.drops){ctx.globalAlpha=1-d.life/d.max;ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,7);ctx.fill()}ctx.r
