<script>(function(){var T="<style>\n/* Layout: full-bleed canvas scene; thin glass HUD floats over it, sheets rise from the bottom like a tackle box drawer. Single committed dark look. */\n:root{\n  --ink:#0b1a22; --panel:rgba(10,24,30,.84); --panel2:rgba(255,255,255,.06);\n  --hair:rgba(214,232,226,.16); --fg:#eef3ec; --muted:#9fb5b0;\n  --float:#ff5a2c; --float2:#ffb199; --good:#4fd1a5; --warn:#ff4d4d; --slack:#6f8fa8;\n  --r0:#b9c6c4; --r1:#5cc8ff; --r2:#c08bff; --r3:#ffc94a;\n  --display:'WCKo','WCZh','Noto Serif KR','AppleMyungjo',serif;\n  --body:'Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif;\n  color-scheme:dark;\n}\nhtml,body{height:100%;background:var(--ink);color:var(--fg);overflow:hidden;font-family:var(--body);-webkit-text-size-adjust:100%}\n[hidden]{display:none!important}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbutton{font:inherit;color:inherit;cursor:pointer}\n#app{position:fixed;inset:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\n#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}\n.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\n\n/* top HUD */\n#top{position:absolute;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;align-items:center;pointer-events:none}\n#top>*{pointer-events:auto}\n.chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:6px 12px 7px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:0}\n.chip .lab{font-size:10px;letter-spacing:.12em;color:var(--muted)}\n.chip b{font-family:var(--display);font-weight:400;font-size:16px;white-space:nowrap}\n.lvbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:7px 10px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}\n.lvrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}\n.lvrow b{color:var(--fg);font-family:var(--display);font-weight:400;font-size:14px}\n.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}\n.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--float),#ffd36b);transition:width .4s}\n.icon{width:40px;height:40px;flex:none;display:grid;place-items:center;background:var(--panel);border:1px solid var(--hair);border-radius:12px}\n.icon svg{width:20px;height:20px}\n\n/* hint & callout */\n#hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 92px);text-align:center;font-size:14px;color:rgba(255,255,255,.88);text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none;transition:opacity .3s}\n#callout{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--display);font-size:clamp(30px,9vw,54px);color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.35),0 0 24px rgba(255,90,44,.55);pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .2s,transform .25s cubic-bezier(.2,1.6,.4,1)}\n#callout.on{opacity:1;transform:scale(1)}\n#callout small{display:block;font-family:var(--body);font-size:15px;margin-top:6px;text-shadow:0 1px 6px rgba(0,0,0,.8)}\n\n/* fight HUD */\n#fight{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:7px;pointer-events:none}\n#fight .box{background:var(--panel);border:1px solid var(--hair);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:520px;margin:0 auto;width:100%}\n.frow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}\n.frow .feel{font-family:var(--display);font-size:18px}\n.frow .dist{font-family:var(--display);font-size:22px}\n.frow .dist small{font-family:var(--body);font-size:12px;color:var(--muted);margin-right:6px}\n.flab{font-size:11px;letter-spacing:.1em;color:var(--muted);display:flex;justify-content:space-between}\n.flab b{font-weight:400;letter-spacing:0;font-size:13px}\n.gauge{position:relative;height:16px;border-radius:8px;background:linear-gradient(90deg,var(--slack) 0 12%,rgba(255,255,255,.18) 12% 40%,var(--good) 40% 85%,var(--warn) 85% 100%);opacity:.95}\n.gauge i{position:absolute;top:-5px;bottom:-5px;width:5px;margin-left:-2.5px;left:30%;background:#fff;border-radius:3px;box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 12px rgba(255,255,255,.7)}\n.gauge .snap{position:absolute;right:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.6);border-radius:0 8px 8px 0}\n.stam{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}\n.stam i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff8a5c,#ffd36b);transform-origin:left}\n\n/* buttons over scene */\n#retrieve{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 86px);background:var(--panel);border:1px solid var(--hair);border-radius:999px;padding:9px 16px;font-size:13px}\n\n/* dock */\n#dock{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;justify-content:center;pointer-events:none}\n#dock .tabs{pointer-events:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--panel);border:1px solid var(--hair);border-radius:18px;padding:5px;width:100%;max-width:440px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}\n#dock button{position:relative;background:none;border:0;border-radius:13px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}\n#dock button svg{width:22px;height:22px}\n#dock button:active{backg ,z=F.T>Z[1]?1.25:F.T>Z[0]?1:F.T>.12?.3:.05;\n F.S=Math.max(0,F.S-dt*z*.12*DF().drain*(6/(G.str+3)));\n if(F.T<Z[0]&&F.mode!=='run')F.S=Math.min(1,F.S+dt*.03*[0,.6,1.2,1.8][S.diff|0]);\n // fail checks\n const snapAt=Math.min(1,Z[1]+.13);if(F.T>snapAt)F.snap+=dt*(F.mode==='jump'?4:2.4)*DF().snap;else F.snap=Math.max(0,F.snap-dt*1.3);\n if(F.T<.12)F.slack+=dt;else F.slack=Math.max(0,F.slack-dt*2);\n if(F.snap>=1)return fail('snap');\n if(F.slack>DF().slack*(F.shallow?.6:1))return fail('slack');\n if(F.D>95)return fail('spool');\n if(F.D<=1.6)return landFish();\n // feedback\n G.reelAng+=eff*dt*3;\n if(G.reel){G.clk+=dt*(5+eff*4);while(G.clk>=1){G.clk--;SFX.click()}}\n setDrag(out>0.002?clamp(F.F*(G.reel?.6:1),0,1):0,clamp(out/dt/6,0,1));\n G.hap-=dt;if(G.hap<=0&&F.T>.42){buzz(Math.round(8+F.T*26));G.hap=lerp(.38,.08,clamp((F.T-.42)/.6,0,1))}\n if(F.T>.75)G.shake=Math.max(G.shake,(F.T-.75)*12);\n if(F.D<10&&!F.seen){F.seen=1;if(G.fish.u>.6||sp.r>=2){callout(G.str>7?'괴물이다…!':'크다…!','',1000);buzz([30,40,30])}}\n F.bubT-=dt;if(F.bubT<=0&&F.mode!=='jump'){const p=proj(F.D,F.x);G.bub.push({x:p.x+(R()-.5)*14*p.s,y:p.y+4*p.s,r:(1+R()*2.2)*Math.max(.5,p.s),life:0,max:.7+R()*.5});F.bubT=F.mode==='run'?.06:.18}\n F.ringT-=dt;if(F.ringT<=0&&F.mode!=='jump'){const p=proj(F.D,F.x);ring(p.x,p.y,p.s,.6+F.F*.5);if(F.mode==='run')splashDrops(p.x,p.y,p.s,3);F.ringT=F.mode==='run'?.18:.45}\n // HUD\n $('#needle').style.left=(clamp(F.T,0,1)*100)+'%';\n $('#snapw').style.width=(F.snap*15)+'%';\n const ts=F.T>Z[1]?['위험! 손을 떼요','var(--warn)']:F.T>Z[0]?['좋아요','var(--good)']:F.T>.12?['조금 더 당겨요','var(--fg)']:['느슨해요, 감아요','var(--slack)'];\n const te=$('#tstate');te.textContent=ts[0];te.style.color=ts[1];\n $('#stam').style.transform=`scaleX(${F.S})`;\n $('#dist').textContent=F.D.toFixed(1);\n}\nfunction fail(kind){\n setDrag(0,0);G.failKind=kind;G.failT=0;\n if(kind==='snap'){SFX.snap();buzz(220);G.shake=14;callout('줄이 터졌다!',S.gear.rod<4?'더 튼튼한 낚싯대가 필요해 보여요':'다음엔 질주할 때 손을 떼요',1800)}\n else if(kind==='slack'){callout('바늘이 빠졌다…',G.F&&G.F.shallow?'얕게 걸린 바늘이 빠졌어요':'줄이 너무 오래 느슨했어요',1600);buzz(60)}\n else if(kind==='spit'){callout('바늘털이에 당했다!','점프할 땐 손을 떼서 장력을 낮춰요',1800);buzz([60,40,60])}\n else callout('줄이 다 풀렸다!','감을 수 있을 때 부지런히 감아요',1600);\n setState('fail');\n}\nfunction landFish(){setDrag(0,0);SFX.splash(1.6);buzz(160);G.shake=8;G.zoom=.05;G.flash=.5;G.land=0;G.slowT=.6;const p=proj(1.5,G.F.x);splashDrops(p.x,p.y,1,30);ring(p.x,p.y,1,2.4);setState('land')}\n\n/* ================= RESULT ================= */\nlet RES=null;\nfunction showResult(){\n const {sp,size,u}=G.fish;const wt=Math.round(WK[sp.shape]*(sp.wk||1)*Math.pow(size,3));\n const d=S.dex[sp.id]||{c:0,b:0};const first=!d.c,best=size>d.b;\n d.c++;if(best)d.b=size;S.dex[sp.id]=d;\n const rw=DF().rw,coin=Math.round([12,35,110,450][sp.r]*(.6+u*1.1)*rw),xp=Math.round([10,26,70,260][sp.r]*(.6+u)*rw);\n const catchRec={cid:Date.now().toString(36)+Math.floor(R()*1e6).toString(36),name:(S.nick||'익명 조사').slice(0,12),sp:sp.id,z:size,w:wt,spot:SP.id,ts:Date.now()};\n S.mine.unshift(catchRec);S.mine=S.mine.slice(0,40);\n RES={sp,size,wt,coin,xp:Math.round(xp*(first?1.5:1)),first,best,rec:catchRec};\n save();postCatch(catchRec);\n // card\n $('#cTier').textContent=TIERS[sp.r].n+' · '+SP.n;$('#cTier').style.color=TIERS[sp.r].c;\n $('#cName').textContent=sp.n;$('#cSize').textContent=size.toFixed(1)+'cm';$('#cWeight').textContent=fmtW(wt);\n $('#cGlow').style.setProperty('--glow',rgbaHex(TIERS[sp.r].c,.38));\n const bd=$('#cBadges');bd.innerHTML='';const add=(t,g)=>{const s=document.createElement('span');s.textContent=t;if(g)s.className='g';bd.append(s)};\n if(first)add('첫 포획',1);else if(best)add('개인 기록 경신',1);\n if(sp.id==='crucian'&&size>=40)add('4짜!',1);else if(sp.id==='crucian'&&size>=30.3)add('월척!',1);\n if(sp.id==='hairtail')add(Math.max(2,Math.round(size/28))+'지 갈치');\n if(u>.85)add('대물');\n if(S.diff>=2)add(DF().n+' 난이도',1);\n $('#cNote').textContent=sp.note||'';\n $('#cRelV').textContent='경험치 +'+Math.rou ,300)}}\nfunction updTop(){$('#lv').textContent=S.lv;$('#coins').textContent=S.coins.toLocaleString('ko-KR')+' 냥';$('#xp').style.width=(S.xp/need(S.lv)*100)+'%';$('#spotName').textContent=SP.n;$('#spotLab').textContent='포인트 · '+WX[G.wx].n;$('#diffLab').textContent=DF().n;setGauge()}\nfunction setGauge(){const z=DF().zone;const g=document.querySelector('.gauge');if(g)g.style.background=`linear-gradient(90deg,var(--slack) 0 12%,rgba(255,255,255,.18) 12% ${z[0]*100}%,var(--good) ${z[0]*100}% ${z[1]*100}%,var(--warn) ${z[1]*100}% 100%)`}\n\n/* ================= EFFECTS ================= */\nfunction ring(x,y,s,k){G.rings.push({x,y,s,r:2,v:(18+R()*8)*k,life:0,max:1.1+k*.3})}\nfunction splashDrops(x,y,s,n){for(let i=0;i<n;i++)G.drops.push({x,y,vx:(R()-.5)*120*s,vy:-(60+R()*180)*s*(.6+R()*.6),life:0,max:.5+R()*.4,r:(1+R()*2)*Math.max(.5,s)})}\n\n/* ================= UPDATE ================= */\nfunction update(dt){\n G.t+=dt;\n if(G.slowT>0){G.slowT-=dt}\n if(G.whip>0)G.whip=Math.max(0,G.whip-dt*3);\n switch(G.state){\n  case 'charge':G.charge+=dt*1.05*G.cdir;if(G.charge>=1){G.charge=1;G.cdir=-1}if(G.charge<=0){G.charge=0;G.cdir=1}break;\n  case 'flight':G.fl+=dt/G.flDur;if(G.fl>=1)landFloat();break;\n  case 'wait':\n   G.wait+=dt;\n   if(G.nibs.length&&G.wait>=G.nibs[0]){G.nibs.shift();G.dip=1;const p=proj(G.floatD,G.lat);ring(p.x,p.y,p.s,.5);SFX.nib();buzz(8)}\n   if(G.fakes.length&&G.wait>=G.fakes[0]){G.fakes.shift();G.dip=2.6;const p=proj(G.floatD,G.lat);ring(p.x,p.y,p.s,1);SFX.nib();SFX.nib();buzz(25)}\n   if(G.wait>=G.biteAt){G.win=G.winMax=DF().win;setState('bite');const p=proj(G.floatD,G.lat);ring(p.x,p.y,p.s,1.6);SFX.plop();buzz(70);G.shake=2;if((S.tips.bite||0)<3){callout('지금!','',600);S.tips.bite=(S.tips.bite||0)+1}}\n   break;\n  case 'bite':G.win-=dt;if(G.win<=0){toast('놓쳤어요. 찌가 다시 떠올랐어요');G.wait=0;G.fish=pickFish();G.biteAt=2+R()*5;schedNibs();setState('wait')}break;\n  case 'fight':updateFight(dt);break;\n  case 'land':G.land+=dt;if(G.land>1.25)showResult();break;\n  case 'fail':G.failT+=dt;if(G.failT>1.6)setState('idle');break;\n  case 'retrieve':G.floatD-=dt*14;G.lat*=Math.pow(.2,dt);G.reelAng+=dt*8;G.clk+=dt*16;while(G.clk>=1){G.clk--;SFX.click()}if(G.floatD<2.5){setState('idle')}break;\n }\n G.dip=Math.max(0,G.dip-dt*(G.dip>1.2?3:4));\n G.flash=Math.max(0,G.flash-dt*4);G.zoom=Math.max(0,G.zoom-dt*.25);\n for(const b of G.bub){b.life+=dt;b.y-=dt*8;b.x+=Math.sin(b.life*9)*.3}G.bub=G.bub.filter(b=>b.life<b.max);\n if(G.wx==='rain'){for(const d of G.rain){d.y+=d.v*dt;d.x-=d.v*.18*dt;if(d.y>H){d.y=-20;d.x=R()*W*1.2}}if(R()<dt*14){const p=proj(2+R()*50,(R()-.5)*1.8);G.rings.push({x:p.x,y:p.y,s:p.s,r:1,v:10,life:0,max:.5})}}\n for(const f of G.flies){f.t-=dt;if(f.t<=0){f.tx=clamp(f.x+(R()-.5)*W*.5,10,W-10);f.ty=clamp(f.y+(R()-.5)*H*.15,G.hzY+20,H*.85);f.t=.4+R()*1.6}f.x=lerp(f.x,f.tx,Math.min(1,dt*3));f.y=lerp(f.y,f.ty,Math.min(1,dt*3))}\n G.baitT-=dt;if(G.baitT<=0){G.baitT=6+R()*10;const d=8+R()*45;G.bait={d,lat:(R()-.5)*1.6,t:0,dir:R()<.5?-1:1};const p=proj(d,G.bait.lat);ring(p.x,p.y,p.s,.7)}\n if(G.bait){G.bait.t+=dt;if(G.bait.t>.55){const p=proj(G.bait.d,G.bait.lat);ring(p.x+G.bait.dir*14*p.s,p.y,p.s,.6);splashDrops(p.x+G.bait.dir*14*p.s,p.y,p.s*.6,4);G.bait=null}}\n if(SP.id==='val'||SP.id==='res'){G.chirpT-=dt;if(G.chirpT<=0){G.chirpT=3+R()*7;if(G.wx!=='rain')SFX.chirp()}}\n G.shake=Math.max(0,G.shake-dt*30);\n // rings & drops\n for(const r of G.rings){r.life+=dt;r.r+=r.v*dt*r.s;r.v*=Math.pow(.35,dt)}\n G.rings=G.rings.filter(r=>r.life<r.max);\n for(const d of G.drops){d.life+=dt;d.vy+=420*dt;d.x+=d.vx*dt;d.y+=d.vy*dt}\n G.drops=G.drops.filter(d=>d.life<d.max);\n // ambient rings\n G.amb-=dt;if(G.amb<=0){G.amb=1.5+R()*3;const p=proj(6+R()*60,(R()-.5)*1.6);if(p.y>G.hzY+4)ring(p.x,p.y,p.s,.5)}\n for(const g of G.gulls){g.x+=g.v*dt;if(g.x>W+40){g.x=-40;g.y=H*(.06+R()*.2)}}\n // rod tip\n const end=lineEnd();\n let tip={x:G.rest.x,y:G.rest.y};\n if(G.state==='charge'){tip.x+=G.charge*W*.12;tip.y-=G.charge*H*.02}\n if(G x+s*.7,g.y-f*.75-s*.14);ctx.stroke()}\n ctx.fillStyle=day?'#f4f6f8':'rgba(30,24,40,.8)';ctx.beginPath();ctx.ellipse(g.x,g.y+.6*g.k,2.6*g.k,1.3*g.k,0,0,7);ctx.fill()}ctx.restore()}\n\nfunction fishScreenLen(sp,size,s){return clamp(size*2.1*s,10,Math.min(W*.55,520))}\n\nfunction render(){\n const t=G.t;\n ctx.save();\n if(G.zoom>0){ctx.translate(W/2,H*.6);ctx.scale(1+G.zoom,1+G.zoom);ctx.translate(-W/2,-H*.6)}\n if(G.shake>0.3)ctx.translate((R()-.5)*G.shake,(R()-.5)*G.shake);\n ctx.drawImage(bgC,0,0,W,H);\n drawGulls(t);\n drawWater(t);\n drawMist(t);\n drawBait();\n drawRings();\n drawBub();\n let attach=null;const st=G.state;\n if(st==='flight'){const e=lineEnd();drawFloat({x:e.x,y:e.y,s:e.s},false,0);attach={x:e.x,y:e.y-14*Math.max(.35,e.s*1.6)}}\n else if(st==='wait'||st==='retrieve'){attach=drawFloat(proj(G.floatD,G.lat),false,G.dip)}\n else if(st==='bite'){attach=drawFloat(proj(G.floatD,G.lat),true,0)}\n else if(st==='fight'){\n  const F=G.F,sp=G.fish.sp,p=proj(F.D,F.x),Lp=fishScreenLen(sp,G.fish.size,p.s);\n  if(F.mode==='jump'&&F.jp>.08&&F.jp<.88){const q=(F.jp-.08)/.8,yy=p.y-Math.sin(q*Math.PI)*H*.18*Math.max(.35,p.s);ctx.save();ctx.translate(p.x,yy);ctx.scale(F.face,1);ctx.rotate(-Math.cos(q*Math.PI)*.9);drawFish(ctx,sp,Lp,{wag:Math.sin(t*30)});ctx.restore();attach={x:p.x+F.face*Lp*.45,y:yy}}\n  else{const rv=clamp((10-F.D)/7,0,1),wg=Math.sin(t*(F.mode==='run'?22:8));ctx.save();ctx.translate(p.x,p.y+Lp*.12+4*p.s);ctx.scale(F.face,.55);if(rv>0)drawFish(ctx,sp,Lp,{alpha:rv*.75,wag:wg});drawFish(ctx,sp,Lp,{sil:`rgba(5,15,20,${.42*(1-rv*.7)})`,wag:wg});ctx.restore();attach=p\n   ctx.save();ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(p.x,p.y,4+3*p.s*(1+F.F),1.4+p.s,0,0,7);ctx.stroke();ctx.restore()}\n }\n else if(st==='land'){const sp=G.fish.sp,e=lineEnd();const Lp=clamp(G.fish.size*2.4,60,W*.6);ctx.save();ctx.translate(e.x,e.y+Lp*.5);ctx.rotate(-Math.PI/2+Math.sin(t*14)*.35);drawFish(ctx,sp,Lp,{wag:Math.sin(t*25)});ctx.restore();attach=e}\n else if(st==='fail'){const k=G.failT;attach={x:G.tip.x+Math.sin(k*9)*20*(1-k/1.6),y:G.tip.y+60+k*30}}\n else{attach={x:G.tip.x-2,y:G.tip.y+H*.08+Math.sin(t*1.5)*3};drawFloat({x:attach.x,y:attach.y+18*.6,s:.38},false,0)}\n const T=st==='fight'?G.F.T:st==='land'?.7:st==='bite'?.35:st==='retrieve'?.45:st==='flight'?.4:.1;\n drawReeds(t);\n ctx.drawImage(fgC,0,0,W,H);\n drawLine(G.tip,attach,T);\n drawRod();\n drawLamps(t);\n drawFlies(t);\n drawDrops();\n drawFog();\n drawRain();\n // charge meter & aim\n if(st==='charge'){\n  const d=castDist(G.charge),p=proj(d,G.aim);ctx.save();ctx.strokeStyle='rgba(255,255,255,.7)';ctx.setLineDash([4,5]);ctx.lineWidth=1.4;ctx.beginPath();ctx.ellipse(p.x,p.y,14*Math.max(.4,p.s*1.5),4*Math.max(.4,p.s*1.5),0,0,7);ctx.stroke();ctx.setLineDash([]);\n  const cx=W/2,cy=H*.74,rad=Math.min(70,W*.17);ctx.lineWidth=8;ctx.lineCap='round';ctx.strokeStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.arc(cx,cy,rad,Math.PI*1.15,Math.PI*1.85);ctx.stroke();\n  ctx.strokeStyle=G.charge>.9?'#ffd36b':'#ff5a2c';ctx.beginPath();ctx.arc(cx,cy,rad,Math.PI*1.15,Math.PI*(1.15+.7*G.charge));ctx.stroke();\n  ctx.fillStyle='#fff';ctx.font='20px '+getComputedStyle(document.documentElement).getPropertyValue('--display');ctx.textAlign='center';ctx.fillText(d.toFixed(0)+'m',cx,cy-6);ctx.restore()}\n ctx.restore();\n ctx.drawImage(vgC,0,0,W,H);\n if(st==='fight'){const k=clamp((G.F.T-DF().zone[1])/.2,0,1)*(.7+.3*Math.sin(t*14));if(k>0){ctx.globalAlpha=k;ctx.drawImage(rvC,0,0,W,H);ctx.globalAlpha=1}}\n if(G.flash>0){ctx.fillStyle=`rgba(255,250,235,${G.flash*.35})`;ctx.fillRect(0,0,W,H)}\n}\n\n/* ================= LOOP ================= */\nlet last=performance.now();\nfunction frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(G.slowT>0)dt*=.4;update(dt);render();requestAnimationFrame(frame)}\n\n/* ================= INPUT ================= */\nlet down=false;\ncv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();down=true;try{cv.set
