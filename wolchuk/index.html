<script>(function(){var T="<style>\n/* Layout: full-bleed canvas scene; thin glass HUD floats over it, sheets rise from the bottom like a tackle box drawer. Single committed dark look. */\n:root{\n  --ink:#0b1a22; --panel:rgba(10,24,30,.84); --panel2:rgba(255,255,255,.06);\n  --hair:rgba(214,232,226,.16); --fg:#eef3ec; --muted:#9fb5b0;\n  --float:#ff5a2c; --float2:#ffb199; --good:#4fd1a5; --warn:#ff4d4d; --slack:#6f8fa8;\n  --r0:#b9c6c4; --r1:#5cc8ff; --r2:#c08bff; --r3:#ffc94a;\n  --display:'WCKo','WCZh','Noto Serif KR','AppleMyungjo',serif;\n  --body:'Apple SD Gothic Neo','Noto Sans KR','Noto Sans CJK KR','Malgun Gothic',sans-serif;\n  color-scheme:dark;\n}\nhtml,body{height:100%;background:var(--ink);color:var(--fg);overflow:hidden;font-family:var(--body);-webkit-text-size-adjust:100%}\n[hidden]{display:none!important}\n*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}\nbutton{font:inherit;color:inherit;cursor:pointer}\n#app{position:fixed;inset:0;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}\n#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}\n.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\n\n/* top HUD */\n#top{position:absolute;left:0;right:0;top:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;gap:8px;align-items:center;pointer-events:none}\n#top>*{pointer-events:auto}\n.chip{display:flex;flex-direction:column;align-items:flex-start;gap:1px;background:var(--panel);border:1px solid var(--hair);border-radius:12px;padding:6px 12px 7px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:0}\n.chip .lab{font-size:10px;letter-spacing:.12em;color:var(--muted)}\n.chip b{font-family:var(--display);font-weight:400;font-size:16px;white-space:nowrap}\n.lvbox{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--hair);border-ra ];let eff=0;\n if(G.reel){eff=rs*clamp(1-F.F*.85,.06,1);F.D-=eff*dt}\n const out=(F.mode==='run'?1:F.mode==='swim'?.22:0)*F.F*5.5*dt*(G.reel?.35:1);\n F.D+=out;\n // stamina\n const Z=DF().zone,z=F.T>Z[1]?1.25:F.T>Z[0]?1:F.T>.12?.3:.05;\n F.S=Math.max(0,F.S-dt*z*.12*DF().drain*(6/(G.str+3)));\n if(F.T<Z[0]&&F.mode!=='run')F.S=Math.min(1,F.S+dt*.03*[0,.6,1.2,1.8][S.diff|0]);\n // fail checks\n const snapAt=Math.min(1,Z[1]+.13);if(F.T>snapAt)F.snap+=dt*(F.mode==='jump'?4:2.4)*DF().snap;else F.snap=Math.max(0,F.snap-dt*1.3);\n if(F.T<.12)F.slack+=dt;else F.slack=Math.max(0,F.slack-dt*2);\n if(F.snap>=1)return fail('snap');\n if(F.slack>DF().slack*(F.shallow?.6:1))return fail('slack');\n if(F.D>95)return fail('spool');\n if(F.D<=1.6)return landFish();\n // feedback\n G.reelAng+=eff*dt*3;\n if(G.reel){G.clk+=dt*(5+eff*4);while(G.clk>=1){G.clk--;SFX.click()}}\n setDrag(out>0.002?clamp(F.F*(G.reel?.6:1),0,1):0,clamp(out/dt/6,0,1));\n G.hap-=dt;if(G.hap<=0&&F.T>.42){buzz(Math.round(8+F.T*26));G.hap=lerp(.38,.08,clamp((F.T-.42)/.6,0,1))}\n if(F.T>.75)G.shake=Math.max(G.shake,(F.T-.75)*12);\n if(F.D<10&&!F.seen){F.seen=1;if(G.fish.u>.6||sp.r>=2){callout(G.str>7?'괴물이다…!':'크다…!','',1000);buzz([30,40,30])}}\n F.bubT-=dt;if(F.bubT<=0&&F.mode!=='jump'){const p=proj(F.D,F.x);G.bub.push({x:p.x+(R()-.5)*14*p.s,y:p.y+4*p.s,r:(1+R()*2.2)*Math.max(.5,p.s),life:0,max:.7+R()*.5});F.bubT=F.mode==='run'?.06:.18}\n F.ringT-=dt;if(F.ringT<=0&&F.mode!=='jump'){const p=proj(F.D,F.x);ring(p.x,p.y,p.s,.6+F.F*.5);if(F.mode==='run')splashDrops(p.x,p.y,p.s,3);F.ringT=F.mode==='run'?.18:.45}\n // HUD\n $('#needle').style.left=(clamp(F.T,0,1)*100)+'%';\n $('#snapw').style.width=(F.snap*15)+'%';\n const ts=F.T>Z[1]?['위험! 손을 떼요','var(--warn)']:F.T>Z[0]?['좋아요','var(--good)']:F.T>.12?['조금 더 당겨요','var(--fg)']:['느슨해요, 감아요','var(--slack)'];\n const te=$('#tstate');te.textContent=ts[0];te.style.color=ts[1];\n $('#stam').style.transform=`scaleX(${F.S})`;\n $('#dist').textContent=F.D.toFixed(1);\n}\nfunction fa
