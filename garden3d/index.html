<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>채소 정원 디펜스 · 3D풍 시험판</title>
<style>
html,body{margin:0;height:100%;background:#13466a;overflow:hidden;touch-action:none;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-user-select:none;user-select:none}
#c{position:absolute;left:50%;top:0;transform:translateX(-50%);display:block}
.hud{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 8px);display:flex;gap:8px;justify-content:space-between;align-items:center;padding:0 10px;pointer-events:none}
.pill{pointer-events:auto;background:rgba(20,40,30,.78);color:#fff;border-radius:14px;padding:8px 12px;font-weight:800;font-size:14px;border:2px solid rgba(255,255,255,.25)}
button.pill{min-width:48px;min-height:44px}
#pick{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);transform:translateX(-50%);display:none;gap:8px;background:rgba(20,40,30,.88);padding:8px;border-radius:18px;border:2px solid rgba(255,255,255,.25)}
#pick.on{display:flex}
#pick button{width:72px;height:84px;border-radius:14px;border:0;background:#2f5a3a;color:#fff;font-weight:800;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:4px;background-size:auto 70%;background-repeat:no-repeat;background-position:center 6px}
#tip{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 64px);transform:translateX(-50%);background:rgba(0,0,0,.55);color:#fff;padding:6px 12px;border-radius:12px;font-size:13px;font-weight:700;white-space:nowrap;pointer-events:none;transition:opacity .5s}
#load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><div class="pill" id="info">웨이브 1 · 정원 20</div><div style="display:flex;gap:6px"><button class="pill" id="spd">1배</button><button class="pill" id="pause">⏸</button></div></div>
<div id="tip">빈 화분을 눌러 채소를 심어요 · 정원지기를 누르면 물을 줘요</div>
<div id="pick"></div>
<div id="load">불러오는 중…</div>
<script>
const W=941,H=1672;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let VS=1,DPR=Math.min(2,window.devicePixelRatio||1);
function fit(){const sw=innerWidth,sh=innerHeight;VS=Math.min(sh/H,sw/(W-90));
  cv.style.width=W*VS+'px';cv.style.height=H*VS+'px';cv.style.top=Math.max(0,(sh-H*VS)*0.35)+'px';cv.width=Math.round(W*VS*DPR);cv.height=Math.round(H*VS*DPR);}
addEventListener('resize',fit);fit();
// ---------- assets ----------
const IMG={};let META;
const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src;});
// ---------- map data (traced from the picture) ----------
const PATH=[[495,140],[485,220],[440,262],[300,305],[150,335],[95,380],[85,440],[110,495],[200,535],[400,545],[650,550],[790,575],[845,630],[855,690],[830,740],[700,775],[400,780],[150,790],[95,830],[85,900],[95,960],[140,1010],[300,1025],[470,1040],[525,1090],[530,1140],[500,1185],[470,1240],[465,1300],[463,1395]];
const POTS=[[295,400],[298,647],[470,647],[640,647],[295,885],[467,885],[625,883],[775,880],[425,1072],[355,1246],[610,1246]];
const GARD=[470,1520];
// smooth path → dense points with distance
const PTS=[];(function(){const P=PATH;for(let i=0;i<P.length-1;i++){const p0=P[Math.max(0,i-1)],p1=P[i],p2=P[i+1],p3=P[Math.min(P.length-1,i+2)];for(let t=0;t<1;t+=0.05){const t2=t*t,t3=t2*t;const f=(a,b,c,d)=>0.5*(2*b+(-a+c)*t+(2*a-5*b+4*c-d)*t2+(-a+3*b-3*c+d)*t3);PTS.push([f(p0[0],p1[0],p2[0],p3[0]),f(p0[1],p1[1],p2[1],p3[1])]);}}PTS.push(P[P.length-1]);
  let d=0;PTS[0][2]=0;for(let i=1;i<PTS.length;i++){d+=Math.hypot(PTS[i][0]-PTS[i-1][0],PTS[i][1]-PTS[i-1][1]);PTS[i][2]=d;}})();
const END=PTS[PTS.length-1][2];
function posAt(d){d=Math.max(0,Math.min(END,d));let lo=0,hi=PTS.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(PTS[m][2]<d)lo=m;else hi=m;}const a=PTS[lo],b=PTS[hi],t=(d-a[2])/((b[2]-a[2])||1);return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
// ---------- units ----------
const PLANT={
 broc:{name:'브로콜리',k:150/190,range:240,cd:1.5,dmg:16},
 radish:{name:'무',k:140/190,range:170,cd:1.8,dmg:14},
 pumpkin:{name:'늙은호박',k:115/150,range:280,cd:2.4,dmg:26},
 bamboo:{name:'죽순',k:160/200,range:320,cd:2.0,dmg:34},
};
const FOE={boar:{k:80/110,hp:70,spd:52},mouse:{k:55/90,hp:26,spd:92},bigboar:{k:125/150,hp:260,spd:34}};
const FPS=22;
const S={t:0,speed:1,paused:false,wave:1,lives:20,foes:[],plants:[],fx:[],nums:[],spawnT:1,spawnQ:[],gard:{st:'idle',t:0,cd:5},buff:0,sel:-1,coins:0};
function frameOf(name,clip,f){const m=META[name],c=m.clips[clip];f=((f%c.n)+c.n)%c.n;return{img:IMG[name+'_'+clip],sx:(f%c.cols)*m.w,sy:Math.floor(f/c.cols)*m.h,w:m.w,h:m.h,ax:m.ax,ay:m.ay};}
function drawFr(fr,x,y,k,flip,alpha,flash){if(!fr.img)return;ctx.save();ctx.translate(x,y);if(flip)ctx.scale(-1,1);ctx.globalAlpha=alpha==null?1:alpha;
  if(flash>0)ctx.filter=`brightness(${1+flash*1.6}) saturate(${1-flash*.6})`;
  ctx.drawImage(fr.img,fr.sx,fr.sy,fr.w,fr.h,-fr.ax*k,-fr.ay*k,fr.w*k,fr.h*k);ctx.restore();}
function shadow(x,y,r){ctx.save();ctx.fillStyle='rgba(0,20,10,.33)';ctx.beginPath();ctx.ellipse(x,y,r,r*.36,0,0,7);ctx.fill();ctx.restore();}
// ---------- waves ----------
function makeWave(n){const q=[];const nb=6+n*2;for(let i=0;i<nb;i++)q.push(['boar',i*1.1]);if(n>=2)for(let i=0;i<4+n*2;i++)q.push(['mouse',3+i*0.45]);if(n>=3||n%2==0)for(let i=0;i<Math.floor(n/2)+1;i++)q.push(['bigboar',6+i*5]);return q.sort((a,b)=>a[1]-b[1]);}
S.spawnQ=makeWave(1);let waveT=0;
function spawn(kind){const F=FOE[kind];const hp=Math.round(F.hp*Math.pow(1.18,S.wave-1));S.foes.push({kind,d:0,hp,max:hp,spd:F.spd*(0.9+Math.random()*0.2),f:Math.random()*17,flash:0,slow:0,stun:0,face:'front',flip:false,vx:0,vy:0,dead:0,off:(Math.random()-.5)*36});}
// ---------- plants ----------
function plant(i,type){S.plants.push({i,type,x:POTS[i][0],y:POTS[i][1]+28,clip:'idle',f:Math.random()*17,cd:0.5+Math.random(),pop:0});document.getElementById('tip').style.opacity=0;}
function foesIn(x,y,r){return S.foes.filter(e=>!e.dead&&(()=>{const p=posAt(e.d);return Math.hypot(p[0]-x,(p[1]-y)*1.1)<r;})());}
function hit(e,dmg,col){if(e.dead)return;const m=S.buff>0?1.5:1;dmg=Math.round(dmg*m*(0.85+Math.random()*0.3));e.hp-=dmg;e.flash=1;const p=posAt(e.d);S.nums.push({x:p[0]+e.off+(Math.random()-.5)*20,y:p[1]-60,v:dmg,t:0,col:col||'#fff'});if(e.hp<=0)kill(e);}
function kill(e){e.dead=1;e.dt=0;S.coins++;const p=posAt(e.d);e.dx=p[0]+e.off;e.dy=p[1];for(let i=0;i<9;i++)S.fx.push({k:'dust',x:e.dx,y:e.dy-12,vx:(Math.random()-.5)*160,vy:-Math.random()*120,r:10+Math.random()*12,t:0,life:.5});S.fx.push({k:'stars',x:e.dx,y:e.dy,t:0,life:1.1,h:FOE[e.kind].k*110});}
function act(p,dt){const T=PLANT[p.type];p.cd-=dt;
  if(p.clip!=='idle'){p.f+=dt*FPS;const n=META[p.type].clips[p.clip].n;
    if(p.type==='broc'&&p.clip==='wind'&&p.f>=n){p.clip='blow';p.f=0;fire(p);return;}
    if(p.type!=='broc'&&!p.fired&&p.f>=n*0.45){p.fired=1;fire(p);}
    if(p.f>=n){p.clip='idle';p.f=0;}return;}
  p.f+=dt*FPS*0.8;
  if(p.cd<=0){const L=foesIn(p.x,p.y,T.range);if(L.length){p.cd=T.cd;p.fired=0;p.clip=p.type==='broc'?'wind':'atk';p.f=0;p.tgt=L.sort((a,b)=>b.d-a.d)[0];}}}
function fire(p){const T=PLANT[p.type];
  if(p.type==='broc'){const L=foesIn(p.x,p.y,T.range);const tp=p.tgt&&!p.tgt.dead?posAt(p.tgt.d):(L[0]?posAt(L[0].d):[p.x,p.y-100]);const ang=Math.atan2(tp[1]-p.y,tp[0]-p.x);
    for(const e of L){const q=posAt(e.d);let da=Math.atan2(q[1]-p.y,q[0]-p.x)-ang;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<0.75){hit(e,T.dmg,'#e9ffd0');e.d=Math.max(0,e.d-22);}}
    for(let i=0;i<4;i++)S.fx.push({k:'gust',x:p.x,y:p.y-70,ang:ang+(i-1.5)*0.22,t:-i*0.05,life:.5,R:T.range});}
  else if(p.type==='radish'){for(const e of foesIn(p.x,p.y,T.range)){hit(e,T.dmg,'#d9ffe6');e.slow=1.2;}S.fx.push({k:'ring',x:p.x,y:p.y-20,t:0,life:.5,R:T.range,col:'160,255,190'});}
  else if(p.type==='pumpkin'){const e=p.tgt&&!p.tgt.dead?p.tgt:foesIn(p.x,p.y,T.range)[0];if(!e)return;const q=posAt(e.d+e.spd*0.7);S.fx.push({k:'ball',x0:p.x,y0:p.y-90,x1:q[0],y1:q[1],t:0,life:.7,dmg:T.dmg});}
  else if(p.type==='bamboo'){const L=foesIn(p.x,p.y,T.range).sort((a,b)=>b.hp-a.hp);const e=L[0];if(!e)return;const q=posAt(e.d);S.fx.push({k:'spike',x:q[0]+e.off,y:q[1],t:0,life:.55});hit(e,T.dmg,'#ffe08a');e.stun=.5;}}
// ---------- gardener ----------
function water(){const g=S.gard;if(g.st!=='idle'||g.cd>0)return;g.st='up';g.t=0;g.cd=7;}
// ---------- update ----------
function update(dt){S.t+=dt;waveT+=dt;
  while(S.spawnQ.length&&S.spawnQ[0][1]<=waveT){spawn(S.spawnQ.shift()[0]);}
  if(!S.spawnQ.length&&!S.foes.length){S.wave++;waveT=-2.5;S.spawnQ=makeWave(S.wave);banner('웨이브 '+S.wave);}
  for(const e of S.foes){if(e.dead){e.dt+=dt;continue;}e.flash=Math.max(0,e.flash-dt*5);
    if(e.stun>0){e.stun-=dt;continue;}const sp=e.spd*(e.slow>0?0.5:1);e.slow-=dt;
    const a=posAt(e.d);e.d+=sp*dt;const b=posAt(e.d);const vx=b[0]-a[0],vy=b[1]-a[1];e.vx=e.vx*0.85+vx*0.15;e.vy=e.vy*0.85+vy*0.15;
    e.f+=sp*dt/5.5;
    if(e.kind==='boar'){const side=Math.abs(e.vx)>Math.abs(e.vy)*0.9;e.face=side?'side':'front';e.flip=side&&e.vx<0;}else{e.face='front';e.flip=e.vx<-0.3;}
    if(e.d>=END){e.dead=2;S.lives=Math.max(0,S.lives-(e.kind==='bigboar'?3:1));banner('울타리가 뚫렸어요!');}}
  S.foes=S.foes.filter(e=>!(e.dead===2||(e.dead===1&&e.dt>1.1)));
  for(const p of S.plants)act(p,dt);
  const g=S.gard;g.cd-=dt;g.t+=dt*FPS;S.buff-=dt;
  if(g.st==='up'&&g.t>=17){g.st='down';g.t=0;S.buff=3.5;for(const p of S.plants)S.fx.push({k:'drops',x:p.x,y:p.y-120,t:0,life:.8});banner('💧 물을 줬어요! 3초 동안 공격력 ×1.5');}
  else if(g.st==='down'&&g.t>=17){g.st='idle';g.t=0;}
  if(g.st==='idle'&&g.cd<=0&&S.foes.some(e=>!e.dead))water();
  for(const f of S.fx){f.t+=dt;if(f.k==='dust'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=300*dt;}
    if(f.k==='ball'&&f.t>=f.life&&!f.done){f.done=1;for(const e of S.foes){if(e.dead)continue;const q=posAt(e.d);if(Math.hypot(q[0]-f.x1,q[1]-f.y1)<85)hit(e,f.dmg,'#ffc070');}
      S.fx.push({k:'boom',x:f.x1,y:f.y1,t:0,life:.45});for(let i=0;i<8;i++)S.fx.push({k:'dust',x:f.x1,y:f.y1-10,vx:(Math.random()-.5)*220,vy:-Math.random()*200,r:9+Math.random()*10,t:0,life:.45,col:'255,170,70'});}}
  S.fx=S.fx.filter(f=>f.t<f.life);for(const n of S.nums)n.t+=dt;S.nums=S.nums.filter(n=>n.t<0.8);
  document.getElementById('info').textContent=`웨이브 ${S.wave} · 정원 ${S.lives} · 🪙${S.coins}`;}
// ---------- draw ----------
function draw(){ctx.setTransform(VS*DPR,0,0,VS*DPR,0,0);ctx.drawImage(IMG.map,0,0,W,H);
  // empty pots
  const used=new Set(S.plants.map(p=>p.i));POTS.forEach(([x,y],i)=>{if(used.has(i))return;const im=IMG.pot;ctx.drawImage(im,x-im.width*0.5,y-im.height*0.5);if(S.sel===i){ctx.strokeStyle='rgba(255,255,160,.9)';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(x,y,80,58,0,0,7);ctx.stroke();}});
  const D=[];
  for(const p of S.plants)D.push({y:p.y,f:()=>{const T=PLANT[p.type];shadow(p.x,p.y-4,58*T.k*1.4);drawFr(frameOf(p.type,p.clip,Math.floor(p.f)),p.x,p.y,T.k,false,1,S.buff>0?0.15+0.1*Math.sin(S.t*12):0);}});
  for(const e of S.foes){const F=FOE[e.kind];let x,y,al=1;
    if(e.dead===1){const t=e.dt;const a=posAt(e.d);const b=posAt(Math.max(0,e.d-40));const dx=Math.sign(b[0]-a[0]||1);x=e.dx+dx*t*260;y=e.dy-t*120;al=Math.max(0,1-t/1.0);
      D.push({y,f:()=>drawFr(frameOf(e.kind,e.kind==='boar'?'side':'front',Math.floor(e.f+t*40)),x,y,F.k,e.kind==='boar'?dx<0:dx>0,al*0.9,0)});continue;}
    const p=posAt(e.d);x=p[0]+e.off;y=p[1];
    D.push({y,f:()=>{shadow(x,y-2,38*F.k*1.5);drawFr(frameOf(e.kind,e.face,Math.floor(e.f)),x,y,F.k,e.flip,1,e.flash);
      if(e.hp<e.max){const w=56*F.k*1.3,hy=y-META[e.kind].ay*F.k-10;ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(x-w/2-2,hy-2,w+4,9);ctx.fillStyle='#e8433a';ctx.fillRect(x-w/2,hy,w*e.hp/e.max,5);}}});}
  const g=S.gard;D.push({y:GARD[1],f:()=>{shadow(GARD[0],GARD[1]-2,52);drawFr(frameOf('gard',g.st,Math.floor(g.t)%17),GARD[0],GARD[1],130/170,false,1,0);}});
  D.sort((a,b)=>a.y-b.y);for(const d of D)d.f();
  for(const f of S.fx){const q=f.t/f.life;if(f.t<0)continue;ctx.save();
    if(f.k==='dust'){ctx.fillStyle=`rgba(${f.col||'235,225,200'},${(1-q)*.85})`;ctx.beginPath();ctx.arc(f.x,f.y,f.r*(1+q),0,7);ctx.fill();}
    else if(f.k==='stars'){for(let i=0;i<3;i++){const a=S.t*8+i*2.1;ctx.fillStyle=`rgba(255,230,90,${1-q})`;ctx.font='bold 26px sans-serif';ctx.fillText('★',f.x+Math.cos(a)*26-10,f.y-f.h-10+Math.sin(a)*8-q*40);}}
    else if(f.k==='gust'){ctx.strokeStyle=`rgba(235,255,235,${(1-q)*.75})`;ctx.lineWidth=10*(1-q)+2;ctx.lineCap='round';const r=40+q*f.R;ctx.beginPath();ctx.arc(f.x,f.y,r,f.ang-0.35,f.ang+0.35);ctx.stroke();}
    else if(f.k==='ring'){ctx.strokeStyle=`rgba(${f.col},${(1-q)*.8})`;ctx.lineWidth=14*(1-q)+2;ctx.beginPath();ctx.ellipse(f.x,f.y,f.R*q,f.R*q*.45,0,0,7);ctx.stroke();}
    else if(f.k==='ball'){const x=f.x0+(f.x1-f.x0)*q,y=f.y0+(f.y1-f.y0)*q-Math.sin(q*Math.PI)*170;shadow(f.x0+(f.x1-f.x0)*q,f.y0+90+(f.y1-f.y0-90)*q,16);const fr=frameOf('pumpkin','idle',0);drawFr(fr,x,y+22,0.28,false,1,0);}
    else if(f.k==='boom'){ctx.fillStyle=`rgba(255,200,90,${(1-q)*.7})`;ctx.beginPath();ctx.ellipse(f.x,f.y,30+q*70,(30+q*70)*.5,0,0,7);ctx.fill();}
    else if(f.k==='spike'){const h=Math.sin(Math.min(1,q*2.2)*Math.PI/2)*(q<.7?1:(1-q)/.3)*110;const gr=ctx.createLinearGradient(0,f.y-h,0,f.y);gr.addColorStop(0,'#c8e06a');gr.addColorStop(.25,'#e9c46a');gr.addColorStop(1,'#9a6a32');ctx.fillStyle=gr;
      for(const [dx,s] of [[-18,.7],[0,1],[16,.8]]){ctx.beginPath();ctx.moveTo(f.x+dx-13*s,f.y);ctx.lineTo(f.x+dx,f.y-h*s);ctx.lineTo(f.x+dx+13*s,f.y);ctx.closePath();ctx.fill();}
      ctx.fillStyle='rgba(120,90,50,.6)';ctx.beginPath();ctx.ellipse(f.x,f.y,34,11,0,0,7);ctx.fill();}
    else if(f.k==='drops'){ctx.fillStyle=`rgba(140,210,255,${1-q})`;for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(f.x+(i-2.5)*14,f.y+q*80+(i%2)*14,5,0,7);ctx.fill();}}
    ctx.restore();}
  ctx.textAlign='center';for(const n of S.nums){const q=n.t/0.8;ctx.font=`900 ${30+(q<.15?(1-q/.15)*12:0)}px -apple-system,sans-serif`;ctx.lineWidth=6;ctx.strokeStyle=`rgba(40,20,10,${1-q})`;ctx.fillStyle=n.col;ctx.globalAlpha=1-q*q;ctx.strokeText(n.v,n.x,n.y-q*50);ctx.fillText(n.v,n.x,n.y-q*50);ctx.globalAlpha=1;}
  if(S.paused){ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,W,H);}}
// ---------- ui ----------
let bannerT=0;function banner(t){const el=document.getElementById('tip');el.textContent=t;el.style.opacity=1;clearTimeout(bannerT);bannerT=setTimeout(()=>el.style.opacity=0,1800);}
const pick=document.getElementById('pick');
function openPick(i){S.sel=i;pick.innerHTML='';for(const k of Object.keys(PLANT)){const b=document.createElement('button');const m=META[k];
  const cvs=document.createElement('canvas');cvs.width=m.w;cvs.height=m.h;cvs.getContext('2d').drawImage(IMG[k+'_idle'],0,0,m.w,m.h,0,0,m.w,m.h);b.style.backgroundImage=`url(${cvs.toDataURL()})`;
  b.textContent=PLANT[k].name;b.onclick=ev=>{ev.stopPropagation();plant(i,k);S.sel=-1;pick.classList.remove('on');};pick.appendChild(b);}pick.classList.add('on');}
cv.addEventListener('pointerdown',ev=>{const r=cv.getBoundingClientRect();const x=(ev.clientX-r.left)/VS,y=(ev.clientY-r.top)/VS;
  if(Math.hypot(x-GARD[0],y-(GARD[1]-70))<80){water();return;}
  const used=new Set(S.plants.map(p=>p.i));const i=POTS.findIndex(([px,py],j)=>!used.has(j)&&Math.hypot(x-px,(y-py)*1.3)<85);
  if(i>=0)openPick(i);else{S.sel=-1;pick.classList.remove('on');}});
document.getElementById('spd').onclick=()=>{S.speed=S.speed===1?2:1;document.getElementById('spd').textContent=S.speed+'배';};
document.getElementById('pause').onclick=()=>{S.paused=!S.paused;document.getElementById('pause').textContent=S.paused?'▶':'⏸';};
// ---------- loop ----------
let last=performance.now();function loop(now){const dt=Math.min(0.05,(now-last)/1000);last=now;if(!S.paused)for(let s=0;s<S.speed;s++)update(dt);draw();requestAnimationFrame(loop);}
(async()=>{META=await (await fetch('a/meta.json')).json();const L=[['map','a/map.webp'],['pot','a/pot.webp']];
  for(const n of Object.keys(META))for(const c of Object.keys(META[n].clips))L.push([n+'_'+c,`a/${n}_${c}.webp`]);
  await Promise.all(L.map(async([k,s])=>IMG[k]=await load(s)));document.getElementById('load').remove();
  plant(1,'broc');plant(5,'radish');plant(4,'pumpkin');plant(8,'bamboo');
  requestAnimationFrame(loop);})();
</script></body></html>
