<script>
// ---- adapter: portraits + mobs from the host atlases, optional art/legion/*.webp from ChatGPT ----
const PIMG={},MIMG={},ART={},HAVE=["map_bg","bg_castle", "bg_forest", "bg_gate", "bg_mountain", "bg_plain", "bg_river", "brush_stroke", "flag_0", "flag_1", "flag_2", "flag_3", "fx_eastwind", "fx_firewall", "fx_heal", "fx_qinglong", "fx_wushuang", "reserve_ally", "reserve_foe", "seal", "sol_arc_ally", "sol_arc_foe", "sol_cav_ally", "sol_cav_foe", "sol_inf_ally", "sol_inf_foe", "sol_str_ally", "sol_str_foe"];let wait=2+HAVE.length;
function load(src,fn){const im=new Image();im.onload=()=>{fn(im);if(--wait===0)go();};im.onerror=()=>{if(--wait===0)go();};im.src=src;}
load('art/portraits.webp',im=>PKEYS.forEach((k,i)=>{const c=document.createElement('canvas');c.width=c.height=PCELL;c.getContext('2d').drawImage(im,(i%PCOLS)*PCELL,((i/PCOLS)|0)*PCELL,PCELL,PCELL,0,0,PCELL,PCELL);PIMG[k]=c;}));
load('art/mobs.webp',im=>{for(const k in MRECT){const r=MRECT[k],c=document.createElement('canvas');c.width=r[2];c.height=r[3];c.getContext('2d').drawImage(im,r[0],r[1],r[2],r[3],0,0,r[2],r[3]);MIMG[k]=c;}});
HAVE.forEach(k=>load('art/legion/'+k+'.webp',im=>ART[k]=im));
// until ChatGPT draws legion backgrounds, borrow the host's own theme strips
const BGA={bg_gate:'theme_siege',bg_castle:'theme_siege',bg_plain:'theme_day',bg_river:'theme_dusk',bg_mountain:'theme_winter',bg_forest:'theme_night'};wait+=Object.keys(BGA).length;
for(const k in BGA)load('art/'+BGA[k]+'.webp',im=>{if(!ART[k])ART[k]=im;});
const cv=document.getElementById('cv');function fit(){const d=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*d;cv.height=innerHeight*d;}addEventListener('resize',fit);fit();
let game;function go(){game=LEGION.mount({canvas:cv,lang:'zh',units:U,factions:FAC,
 portrait:id=>PIMG[id]||PIMG[PALIAS[id]]||null,mob:k=>MIMG[k]||null,art:k=>ART[k]||null,
 load:()=>{try{return JSON.parse(localStorage.getItem('cheonha_legion_v2'))}catch(e){return null}},
 store:o=>{try{localStorage.setItem('cheonha_legion_v2',JSON.stringify(o))}catch(e){}},
 onExit:()=>location.href='zh.html',
 ads:{rewarded:(kind,done)=>{if(confirm('广告测试：并非真实广告。要发放测试奖励吗？'))done();}}});}
const P=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
cv.addEventListener('pointerdown',e=>game&&game.touch('down',...P(e)));cv.addEventListener('pointerup',e=>game&&game.touch('up',...P(e)));
