<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>천하등용</title><meta http-equiv="refresh" content="2;url=../index.html">
<script>
// 천하등용 정식판은 /cheonha/ 주소로 옮겼습니다. 옛 v30 캐시를 지우고 이동합니다.
(async()=>{try{if('serviceWorker' in navigator){for(const r of await navigator.serviceWorker.getRegistrations()){if(r.scope.endsWith('/v30/'))await r.unregister();}}
if(self.caches){for(const k of await caches.keys()){if(k.startsWith('cheonhav30sd-'))await caches.delete(k);}}}catch(e){}
location.replace('../index.html'+location.search+location.hash);})();
</script></head>
<body style="background:#1d120d;color:#f2e6cc;font-family:sans-serif;text-align:center;padding-top:30vh">
천하등용이 새 주소로 옮겨졌어요. 잠시 후 이동합니다…<br><a style="color:#f2c14e" href="../index.html">바로 이동</a></body></html>
