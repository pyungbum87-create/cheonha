<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>html,body{margin:0;height:100%;background:#141c26;overflow:hidden;touch-action:none;overscroll-behavior:none;display:flex;align-items:center;justify-content:center;font-family:sans-serif}
canvas{display:block;height:min(100dvh,177.78vw);width:min(100vw,56.25dvh);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}</style>
<title>실험 A · 퐁당 합체 수비</title></head><body><canvas id="c" width="450" height="800"></canvas><script>
/* 회색 박스 실험 A: 떨어뜨려 합치는 수비. 도형만 사용. 규칙 확인용이라 그림·소리·저장 없음(최고 기록만). */
const c=document.getElementById('c'),g=c.getContext('2d'),W=450,H=800,RIM=430,JL=22,JR=428,JB=784;
const COL=[{c:'#ff7a5c',cd:1.25,dmg:6,aoe:48},{c:'#5cb8ff',cd:.38,dmg:2.1},{c:'#ffd24d',cd:1.5,dmg:5,pierce:1}];
const RAD=t=>14+t*5.5,POW=t=>Math.pow(2.5,t-1);let S,uid=1;
const mk=()=>({col:Math.random()*3|0,tier:Math.random()<.22?2:1});
function reset(){S={t:0,balls:[],en:[],shots:[],fx:[],next:mk(),aimX:225,cd:0,over:false,danger:0,kills:0,spawnT:1.2,bossT:40,shakeCd:0,best:+(localStorage.labA||0),down:false,merges:0};}
function addBall(x,y,col,tier,rock){const b={id:uid++,x,y,vx:0,vy:0,r:rock?(tier||17):RAD(tier),col,tier,rock:!!rock,cd:Math.random(),age:0};S.balls.push(b);return b;}
function fx(x,y,r,col){S.fx.push({x,y,r,col,t:0});}
function hurt(e,d){e.hp-=d;e.hit=.1;if(e.hp<=0&&!e.dead){e.dead=true;S.kills++;fx(e.x,e.y,e.r+10,'#fff');}}
function step(dt){
  if(S.over)return;S.t+=dt;S.cd-=dt;S.shakeCd-=dt;
  // 적 등장: 시간이 갈수록 많고 단단하게
  if((S.spawnT-=dt)<=0){S.spawnT=Math.max(.38,1.5-S.t*.011);const hp=6*Math.pow(1+S.t/24,1.7);S.en.push({x:50+Math.random()*350,y:-20,r:17,hp,max:hp,sp:Math.min(58,26+S.t*.22)});}
  if((S.bossT-=dt)<=0){S.bossT=40;const hp=90*Math.pow(1+S.t/24,1.7);S.en.push({x:225,y:-40,r:36,hp,max:hp,sp:17,boss:1});}
  for(const e of S.en){e.y+=e.sp*dt;if(e.hit>0)e.hit-=dt;if(e.y+e.r>=RIM&&!e.dead){e.dead=true;const n=e.boss?3:1;for(let i=0;i<n;i++){const b=addBall(Math.max(JL+24,Math.min(JR-24,e.x+(i-(n-1)/2)*50)),RIM+26,0,e.boss?22:17,1);b.vy=120;}fx(e.x,RIM,30,'#9aa3ad');}}
  S.en=S.en.filter(e=>!e.dead);
  // 통 안 물리: 중력, 벽, 서로 밀어내기, 같은 것끼리 합체
  const sub=2,h=dt/sub;
  for(let k=0;k<sub;k++){
    for(const b of S.balls){b.vy+=1500*h;b.px=b.x;b.py=b.y;b.x+=b.vx*h;b.y+=b.vy*h;}
    for(let it=0;it<6;it++){for(let i=0;i<S.balls.length;i++){const a=S.balls[i];if(a.gone)continue;for(let j=i+1;j<S.balls.length;j++){const b=S.balls[j];if(b.gone)continue;
      const dx=b.x-a.x,dy=b.y-a.y,rr=a.r+b.r,d2=dx*dx+dy*dy;if(d2>=rr*rr)continue;const d=Math.sqrt(d2)||.01,nx=dx/d,ny=dy/d;
      if(!a.rock&&!b.rock&&a.col===b.col&&a.tier===b.tier){merge(a,b);continue;}
      const ma=a.r*a.r,mb=b.r*b.r,ov=(rr-d),ta=mb/(ma+mb),tb=ma/(ma+mb);a.x-=nx*ov*ta;a.y-=ny*ov*ta;b.x+=nx*ov*tb;b.y+=ny*ov*tb;}}
      for(const b of S.balls){if(b.x-b.r<JL)b.x=JL+b.r;if(b.x+b.r>JR)b.x=JR-b.r;if(b.y+b.r>JB)b.y=JB-b.r;}}
    for(const b of S.balls)if(b.px!==undefined){b.vx=(b.x-b.px)/h*.985;b.vy=(b.y-b.py)/h;}   // 위치를 먼저 맞추고 속도를 거기서 구한다(쌓여도 떨지 않음)
    S.balls=S.balls.filter(b=>!b.gone);
  }
  // 자동 공격
  for(const b of S.balls){b.age+=dt;if(b.rock)continue;const C=COL[b.col];if((b.cd-=dt)>0||!S.en.length)continue;let t=null,bd=1e9;for(const e of S.en){if(e.y<0)continue;const d=(e.x-b.x)**2+(e.y-b.y)**2;if(d<bd){bd=d;t=e;}}if(!t)continue;
    b.cd=C.cd;const d=Math.sqrt(bd)||1;S.shots.push({x:b.x,y:b.y,vx:(t.x-b.x)/d*760,vy:(t.y-b.y)/d*760,dmg:C.dmg*POW(b.tier),col:b.col,r:2.5+b.tier,seen:[],life:1.6});}
  for(const s of S.shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.y>RIM-4)continue;for(const e of S.en){if(e.dead||s.seen.includes(e))continue;if((e.x-s.x)**2+(e.y-s.y)**2<(e.r+s.r+3)**2){const C=COL[s.col];hurt(e,s.dmg);
      if(C.aoe){fx(s.x,s.y,C.aoe,C.c);for(const o of S.en)if(o!==e&&!o.dead&&(o.x-s.x)**2+(o.y-s.y)**2<(C.aoe+o.r)**2)hurt(o,s.dmg*.6);}
      if(C.pierce)s.seen.push(e);else{s.life=0;break;}}}}
  S.shots=S.shots.filter(s=>s.life>0&&s.x>-20&&s.x<W+20&&s.y>-40);S.en=S.en.filter(e=>!e.dead);
  for(const f of S.fx)f.t+=dt;S.fx=S.fx.filter(f=>f.t<.3);
  // 넘침 판정: 가라앉은 공이 선 위로 올라온 채 2초
  let top=false;for(const b of S.balls)if(b.age>1.2&&b.y-b.r<RIM+4&&Math.abs(b.vy)<220)top=true;S.danger=top?S.danger+dt:Math.max(0,S.danger-dt*2);
  if(S.danger>2){S.over=true;if(S.t>S.best){S.best=S.t;try{localStorage.labA=S.t;}catch(e){}}}
}
function merge(a,b){a.gone=b.gone=true;if(a.tier>=7){S.merges++;fx(225,300,300,'#fff');for(const o of S.balls)if(o.rock)o.gone=true;for(const e of S.en)hurt(e,e.boss?e.max*.5:1e9);return;}   // 7단계 둘이 만나면 대폭발: 돌 전부 제거
  const x=(a.x+b.x)/2,y=(a.y+b.y)/2,n=addBall(x,y,a.col,a.tier+1);n.vy=-160;n.age=1;S.merges++;fx(x,y,n.r*2.4,COL[a.col].c);
  for(const o of S.balls)if(o.rock&&!o.gone&&(o.x-x)**2+(o.y-y)**2<(n.r*2.4+o.r)**2){o.gone=true;fx(o.x,o.y,o.r+8,'#9aa3ad');}   // 합체 충격으로 옆의 돌이 부서진다
  const es=S.en.filter(e=>e.y>0).sort((p,q)=>q.y-p.y).slice(0,3);for(const e of es){hurt(e,6*POW(n.tier));S.shots.push({x,y,vx:0,vy:0,dmg:0,col:a.col,r:0,seen:[],life:.12,bolt:[x,y,e.x,e.y]});}}
function drop(){if(S.cd>0||S.over)return;const r=RAD(S.next.tier),x=Math.max(JL+r,Math.min(JR-r,S.aimX));addBall(x,RIM+r+6,S.next.col,S.next.tier);S.next=mk();S.cd=.5;}
function shakeJar(){if(S.shakeCd>0||S.over)return;S.shakeCd=12;for(const b of S.balls){b.vx+=(Math.random()-.5)*700;b.vy-=300+Math.random()*250;}}
function T(s,x,y,sz,col,al){g.font='bold '+sz+'px sans-serif';g.textAlign=al||'center';g.textBaseline='middle';g.fillStyle=col||'#fff';g.fillText(s,x,y);}
function draw(){
  g.fillStyle='#22303f';g.fillRect(0,0,W,RIM);g.fillStyle='#2e3d4f';g.fillRect(0,RIM,W,H-RIM);g.fillStyle='#3d5068';g.fillRect(JL-8,RIM,8,JB-RIM+8);g.fillRect(JR,RIM,8,JB-RIM+8);g.fillRect(JL-8,JB,JR-JL+16,8);
  const dz=S.danger>0&&Math.floor(S.t*6)%2;g.strokeStyle=dz?'#ff4d4d':'#7f93aa';g.lineWidth=dz?5:2;g.setLineDash([10,8]);g.beginPath();g.moveTo(JL,RIM);g.lineTo(JR,RIM);g.stroke();g.setLineDash([]);
  for(const e of S.en){g.fillStyle=e.hit>0?'#fff':e.boss?'#b0413e':'#d9655f';g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.fill();g.fillStyle='#000';g.fillRect(e.x-e.r,e.y-e.r-8,e.r*2,4);g.fillStyle='#7dff9a';g.fillRect(e.x-e.r,e.y-e.r-8,e.r*2*Math.max(0,e.hp/e.max),4);if(e.boss)T('BOSS',e.x,e.y,13);}
  for(const s of S.shots){if(s.bolt){g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(s.bolt[0],s.bolt[1]);g.lineTo(s.bolt[2],s.bolt[3]);g.stroke();}else{g.fillStyle=COL[s.col].c;g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill();}}
  for(const b of S.balls){g.fillStyle=b.rock?'#8a929c':COL[b.col].c;g.beginPath();g.arc(b.x,b.y,b.r,0,7);g.fill();g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=2;g.stroke();if(!b.rock)T(b.tier,b.x,b.y+1,10+b.tier*3,'rgba(0,0,0,.6)');}
  if(!S.over){const r=RAD(S.next.tier),x=Math.max(JL+r,Math.min(JR-r,S.aimX));g.globalAlpha=S.cd>0?.3:.9;g.fillStyle=COL[S.next.col].c;g.beginPath();g.arc(x,RIM+r+6,r,0,7);g.fill();T(S.next.tier,x,RIM+r+7,10+S.next.tier*3,'rgba(0,0,0,.6)');g.globalAlpha=.25;g.fillStyle='#fff';g.fillRect(x-1,RIM+r*2+8,2,JB-RIM);g.globalAlpha=1;}
  for(const f of S.fx){g.globalAlpha=1-f.t/.3;g.strokeStyle=f.col;g.lineWidth=4;g.beginPath();g.arc(f.x,f.y,f.r*(.4+f.t*2),0,7);g.stroke();g.globalAlpha=1;}
  const mm=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');T('버틴 시간 '+mm(S.t),14,24,20,'#fff','left');T('최고 '+mm(S.best)+' · 처치 '+S.kills,14,50,14,'#9fb3c8','left');
  g.fillStyle=S.shakeCd>0?'#44566b':'#7c5cff';g.fillRect(340,10,100,46);T(S.shakeCd>0?Math.ceil(S.shakeCd)+'초':'흔들기',390,34,18);
  if(S.t<9){T('끌어서 놓으면 통에 떨어져요',225,150,19);T('같은 색·같은 숫자는 합쳐져서 강해져요',225,180,17,'#cfe0f0');T('놓친 적은 돌이 되어 통에 쌓여요. 넘치면 끝!',225,208,17,'#cfe0f0');}
  if(S.over){g.fillStyle='rgba(0,0,0,.72)';g.fillRect(0,0,W,H);T('통이 넘쳤어요',225,320,34);T('버틴 시간 '+mm(S.t)+' · 최고 '+mm(S.best),225,372,20,'#ffd24d');T('화면을 누르면 다시',225,430,20,'#9fb3c8');}
}
function P(e){const r=c.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
c.addEventListener('pointerdown',e=>{e.preventDefault();const p=P(e);if(S.over){if(S.overAt&&performance.now()-S.overAt>700)reset();return;}if(p.x>330&&p.y<64){shakeJar();return;}S.down=true;S.aimX=p.x;});
addEventListener('pointermove',e=>{if(S.down)S.aimX=P(e).x;});addEventListener('pointerup',()=>{if(S.down){S.down=false;drop();}});
let last=0,acc=0;function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;acc+=dt;while(acc>=1/60){step(1/60);acc-=1/60;}if(S.over&&!S.overAt)S.overAt=performance.now();draw();requestAnimationFrame(loop);}
reset();requestAnimationFrame(loop);window.__lab={get S(){return S;},drop,step,reset};
</script></body></html>
