  if(p.inv>0&&((G.t*20)|0)%2) ctx.globalAlpha=.5; drawRunner(ctx,'jay',p.x,p.y,p.ang,p.phase,p.mv,{size:34}); ctx.globalAlpha=1;
  if(lv('saw')){ const n=lv('saw')+1; for(let i=0;i<n;i++){ const a=G.sawA+i*6.283/n, sx=p.x+Math.cos(a)*54, sy=p.y+Math.sin(a)*54; ctx.save(); ctx.translate(sx,sy); ctx.rotate(G.t*18); ctx.fillStyle='#cfd8e3'; ctx.beginPath(); for(let k=0;k<10;k++){ const r=k%2?11:7, b=k*.628; ctx.lineTo(Math.cos(b)*r,Math.sin(b)*r); } ctx.fill(); ctx.fillStyle='#5a6676'; ctx.beginPath(); ctx.arc(0,0,3,0,7); ctx.fill(); ctx.restore(); } }
  ctx.lineCap='round'; for(const b of G.bul){ if(b.mol){ const t=b.t/b.life, x=b.x0+(b.x-b.x0)*t, y=b.y0+(b.y-b.y0)*t-Math.sin(t*3.14)*40; prop(ctx,'firebottle',x,y,9,t*9); continue; } ctx.strokeStyle=b.tc?'#ffd166':'#9fe8ff'; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-b.vx*.028,b.y-b.vy*.028); ctx.stroke(); }
  for(const b of G.bolts){ ctx.strokeStyle='rgba(160,235,255,'+(1-b.t/.14)+')'; ctx.lineWidth=3; ctx.beginPath(); for(let i=0;i<b.pts.length;i++){ const q=b.pts[i]; if(i===0) ctx.moveTo(q[0],q[1]); else { const o=b.pts[i-1]; ctx.lineTo((o[0]+q[0])/2+rnd(-8,8),(o[1]+q[1])/2+rnd(-8,8)); ctx.lineTo(q[0],q[1]); } } ctx.stroke(); }
  for(const f of G.fx){ const t=f.t/f.life; if(f.k==='ring'){ ctx.globalAlpha=1-t; ctx.strokeStyle=f.c; ctx.lineWidth=f.w||3; ctx.beginPath(); ctx.arc(f.x,f.y,f.R*(.25+.75*t),0,7); ctx.stroke(); } else { ctx.globalAlpha=1-t; ctx.fillStyle=f.c; for(let i=0;i<f.n;i++){ const a=f.a+i*1.3, r=(10+i%3*8)*(1-(1-t)*(1-t))*1.7; ctx.beginPath(); ctx.arc(f.x+Math.cos(a)*r,f.y+Math.sin(a)*r*.8,2.4-(i%2),0,7); ctx.fill(); } } ctx.globalAlpha=1; }
  ctx.font='900 10px sans-serif'; ctx.textAlign='center'; for(const n of G.num){ ctx.globalAlpha=1-n.t*2; ctx.fillStyle='#fff'; ctx.fillText(n.s,n.x,n.y-n.t*26); } ctx.globalAlpha=1;
  // hp bar under the player
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(p.x-18,p.y+20,36,4); ctx.fillStyle=p.hp/p.maxHp>.35?'#5dff9a':'#ff4d5e'; ctx.fillRect(p.x-18,p.y+20,36*p.hp/p.maxHp,4);
  ctx.restore();
  if(G.siren){ const a=.1+.08*Math.sin(G.t*8); const g=ctx.createRadialGradient(FW/2,FH/2,FH*.3,FW/2,FH/2,FH*.75); g.addColorStop(0,'rgba(255,40,40,0)'); g.addColorStop(1,'rgba(255,40,40,'+a*2+')'); ctx.fillStyle=g; ctx.fillRect(0,0,FW,FH); }
  if(G.flash>0){ ctx.fillStyle='rgba(255,30,40,'+G.flash*1.2+')'; ctx.fillRect(0,0,FW,FH); }
  if(joy.on){ ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(joy.ox,joy.oy,52,0,7); ctx.stroke(); ctx.fillStyle='rgba(255,255,255,.3)'; ctx.beginPath(); ctx.arc(joy.ox+joy.x*52,joy.oy+joy.y*52,20,0,7); ctx.fill(); } }
const mmss=t=>((t/60)|0)+':'+String((t%60)|0).padStart(2,'0');
function hud(){ if(!G) return; $('time').textContent=mmss(G.t); $('kills').textContent=G.kills; $('lv').textContent='Lv '+G.lv; $('xpFill').style.width=clamp(G.xp/G.need*100,0,100)+'%'; }
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('on'),1300); }
function banner(t){ const e=$('banner'); e.textContent=t; e.classList.add('on'); clearTimeout(banner.t); banner.t=setTimeout(()=>e.classList.remove('on'),2200); }
// ---- flow ----
function start(){ newGame(); state='run'; $('titleScr').classList.remove('on'); $('endScr').classList.remove('on'); frame.classList.add('play'); last=performance.now(); music('night'); toast('끌어서 이동 · 공격은 자동'); }
function end(won){ if(state==='over') return; state='over'; frame.classList.remove('play'); sfx(won?'win':'lose'); const nb=G.t>best; if(nb){ best=G.t; try{localStorage.setItem('ds_best',String(best));}catch(e){} }
  $('endTag').textContent=won?'탈출 성공':'쓰러졌다'; $('endTag').style.color=won?'#7dff9a':'#ff4d5e'; $('endTitle').textContent=won?'문지기를 쓰러뜨렸다!':mmss(G.t)+' 버팀';
  $('endStat').innerHTML='<div><b>'+G.kills+'</b>처치</div><div><b>Lv '+G.lv+'</b>도달</div><div><b>'+mmss(best)+'</b>최고 기록'+(nb?' · NEW':'')+'</div>'; $('endW').innerHTML=$('chips').innerHTML; $('endScr').classList.add('on'); }
$('startBtn').onclick=start; $('againBtn').onclick=start; $('sirenBtn').onclick=()=>{ if(state!=='run') return; G.siren=!G.siren; $('sirenBtn').classList.toggle('on',G.siren); sfx(G.siren?'siren':'ui'); banner(G.siren?'사이렌 ON · 떼 ×2 · 경험치 ×2':'사이렌 OFF'); };
$('pauseBtn').onclick=()=>{ if(state==='run'){ state='pause'; $('pauseScr').classList.add('on'); } }; $('resumeBtn').onclick=()=>{ state='run'; $('pauseScr').classList.remove('on'); last=performance.now(); };
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&state==='run') $('pauseBtn').onclick(); });
function bot(){ let ax=0, ay=0, th=0; for(const z of G.zs){ const dx=P.x-z.x, dy=P.y-z.y, d=hyp(dx,dy)||1; if(d<90){ ax+=dx/d*(90-d); ay+=dy/d*(90-d); th++; } }
  let gx=0, gy=0, gd=1e9; for(const g of G.gems){ const d=hyp(g.x-P.x,g.y-P.y); if(d<gd){ gd=d; gx=g.x-P.x; gy=g.y-P.y; } } const gl=hyp(gx,gy)||1, al=hyp(ax,ay)||1;
  let x=(th?ax/al*1.2:0)+gx/gl*(th>3?.4:1)+Math.cos(G.t*.5)*.15, y=(th?ay/al*1.2:0)+gy/gl*(th>3?.4:1)+Math.sin(G.t*.5)*.15; const l=hyp(x,y)||1; joy.x=x/l; joy.y=y/l; }
function loop(now){ requestAnimationFrame(loop); let dt=Math.min(.05,(now-last)/1000); last=now; if(state==='run'){ if(AUTO) bot(); for(let i=0;i<XS&&state==='run';i++) update(dt); }
  render(); hud(); if(AUTO&&G) document.title=JSON.stringify({t:G.t|0,k:G.kills,lv:G.lv,hp:P.hp|0,zs:G.zs.length,st:state,w:G.w,ms:+(performance.now()-now).toFixed(1)}); }
{ const t0=Date.now(), tick=setInterval(()=>{ const ok=IMGS.filter(i=>i.complete&&i.naturalWidth).length; $('loadBar').style.width=Math.round(100*ok/IMGS.length)+'%'; if(ok>=IMGS.length&&mapReady&&ZRED){ clearInterval(tick); buildSprites(); $('loadWrap').style.display='none'; $('startBtn').style.display=''; $('bestTxt').textContent=best?'최고 기록 '+mmss(best):''; if(AUTO) start(); } else if(Date.now()-t0>6000) $('loadTip').textContent='인터넷이 느려 시간이 걸리고 있어요…'; },100); }
requestAnimationFrame(loop);
window.__dbg={ev:c=>eval(c)};

})();
